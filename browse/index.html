 mapped the technical overlap.", "crux": "Can governments coordinate on major risks without believing they are surrendering a strategic race?", "slug": "shared-risks-cooperation", "links": [{"t": "In Which Areas of Technical AI Safety Could Geopolitical Rivals Cooperate?", "s": "Bucknall, Trager, Bengio et al.", "y": "2025", "u": "https://arxiv.org/abs/2504.12914"}, {"t": "Can the US and China Cooperate on AI?", "s": "Brookings", "y": "2025", "u": "https://www.brookings.edu/articles/can-the-us-and-china-cooperate-on-ai/"}]}, {"id": "4.4.2", "t": "Verification", "q": "Can states reliably observe major training runs, compute clusters, model transfers, dangerous capabilities, or prohibited deployments?", "n": "Compute's physical footprint — power draw, cooling, supply chains — makes AI more verifiable than most software. Layered verification schemes, including on-chip mechanisms, are the frontier proposals.", "crux": "", "slug": "international-verification", "links": [{"t": "Verification Methods for International AI Agreements", "s": "Wasil et al.", "y": "2024", "u": "https://arxiv.org/abs/2408.16074"}, {"t": "Verifying International Agreements on AI", "s": "Baker, Brundage, Heim et al.", "y": "2025", "u": "https://arxiv.org/abs/2507.15916"}]}, {"id": "4.4.3", "t": "Institutions", "q": "Should cooperation rely on existing organizations or require a new body analogous to the IAEA?", "n": "IAEA, CERN, and IPCC analogies each fit a different function — inspection, joint research, consensus assessment. Regime-complex thinking predicts many overlapping bodies rather than one AI agency.", "crux": "", "slug": "international-institutions", "links": [{"t": "International Institutions for Advanced AI", "s": "Ho et al., GovAI/DeepMind", "y": "2023", "u": "https://arxiv.org/abs/2307.04699"}, {"t": "Envisioning a Global Regime Complex to Govern AI", "s": "Klein & Patrick, Carnegie", "y": "2024", "u": "https://carnegieendowment.org/research/2024/03/envisioning-a-global-regime-complex-to-govern-artificial-intelligence"}]}, {"id": "4.4.4", "t": "Interoperability", "q": "Can different national regulatory systems recognize common evaluations, audits, and safety standards?", "n": "Mutual recognition of evals and audits is the trade-friction question: without it, compliance fragments by jurisdiction; with it, the strictest regime quietly sets the global floor (or the loosest one erodes it).", "crux": "", "slug": "regulatory-interoperability", "links": [{"t": "Strengthening International Cooperation on AI", "s": "Brookings/CEPS Forum", "y": "2021", "u": "https://www.brookings.edu/articles/strengthening-international-cooperation-on-ai/"}, {"t": "Interoperability in AI Safety Governance", "s": "Chin et al., UNU", "y": "2026", "u": "https://arxiv.org/abs/2601.06153"}]}, {"id": "4.4.5", "t": "Representation", "q": "How can countries without frontier labs or large compute resources influence decisions that may profoundly affect them?", "n": "Most compute, capital, and rule-writing sits in a handful of countries. The UN process has moved from its 2024 advisory report to a Global Dialogue on AI Governance and an independent scientific panel — the current attempt to widen the table.", "crux": "", "slug": "global-representation", "links": [{"t": "The Case for Including the Global South in AI Governance", "s": "GovAI", "y": "2023", "u": "https://www.governance.ai/analysis/the-case-for-including-the-global-south-in-ai-governance-conversations"}, {"t": "Governing AI for Humanity", "s": "UN High-Level Advisory Body", "y": "2024", "u": "https://www.un.org/en/ai-advisory-body"}]}]}, {"id": "4.5", "t": "Ownership, openness, access, and rights", "qs": [{"id": "4.5.1", "t": "Open versus closed models", "q": "When does openness improve competition, research, and accountability, and when does it irreversibly proliferate dangerous capability?", "n": "The marginal-risk framing asks what open weights add beyond existing tools; the irreversibility framing answers that releases can't be recalled when capabilities cross dangerous thresholds. Both are right about different regimes.", "crux": "Will capability remain concentrated in a few controllable institutions or proliferate widely?", "slug": "open-versus-closed", "links": [{"t": "Open-Sourcing Highly Capable Foundation Models", "s": "Seger et al., GovAI", "y": "2023", "u": "https://arxiv.org/abs/2311.09227"}, {"t": "On the Societal Impact of Open Foundation Models", "s": "Kapoor, Bommasani et al.", "y": "2024", "u": "https://arxiv.org/abs/2403.07918"}, {"t": "Open Source AI Is the Path Forward", "s": "Mark Zuckerberg, Meta", "y": "2024", "u": "https://about.fb.com/news/2024/07/open-source-ai-is-the-path-forward/"}]}, {"id": "4.5.2", "t": "Concentration of power", "q": "Is it acceptable for a small number of private companies to steward systems with potentially society-wide influence?", "n": "The concern now runs beyond market power: analyses of AI-enabled coups argue that whoever controls advanced AI could convert it into political power directly — making internal lab governance a constitutional question.", "crux": "", "slug": "concentration-of-power", "links": [{"t": "AI-Enabled Coups: How a Small Group Could Use AI to Seize Power", "s": "Davidson et al., Forethought", "y": "2025", "u": "https://www.forethought.org/research/ai-enabled-coups-how-a-small-group-could-use-ai-to-seize-power"}, {"t": "Artificial Power: 2025 Landscape Report", "s": "AI Now Institute", "y": "2025", "u": "https://ainowinstitute.org/publications/research/executive-summary-artificial-power"}]}, {"id": "4.5.3", "t": "Frontier-lab governance", "q": "Which governance structures can keep frontier AI labs accountable to their stated missions under commercial and geopolitical pressure?", "n": "Frontier labs combine novel corporate forms — nonprofit boards, capped profits, long-term benefit trusts — with concentrated founder control and deep dependence on outside capital and compute. The 2023 OpenAI board crisis and the restructuring that followed made the question concrete: which mechanisms remain binding when founders, boards, investors, cloud partners, and competition pull in different directions?", "crux": "", "slug": "frontier-lab-governance", "links": [{"t": "Our structure", "s": "OpenAI", "y": "", "u": "https://openai.com/our-structure/"}, {"t": "The Long-Term Benefit Trust", "s": "Anthropic", "y": "2023", "u": "https://www.anthropic.com/news/the-long-term-benefit-trust"}, {"t": "Board Control of a Charity's Subsidiaries: The Saga of OpenAI", "s": "Aprill, Chan Loui & Horwitz, UCLA Law / SSRN", "y": "2024", "u": "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4720202"}, {"t": "The OpenAI Files", "s": "The Midas Project & Tech Oversight Project", "y": "2025", "u": "https://www.openaifiles.org/"}, {"t": "“Safety culture and processes have taken a backseat to shiny products” — resigning as superalignment lead", "s": "Jan Leike (@janleike) on X", "y": "2024", "u": "https://x.com/janleike/status/1791498184671605209"}]}, {"id": "4.5.4", "t": "Training data", "q": "When are consent, licensing, attribution, or compensation required for copyrighted and personal material?", "n": "Courts began answering in 2025, partially crediting training as transformative learning while rejecting it for pirated corpora. The supply-chain framing maps who owes whom at each stage from scraping to output.", "crux": "", "slug": "training-data-rights", "links": [{"t": "Talkin' 'Bout AI Generation: Copyright and the Generative-AI Supply Chain", "s": "Lee, Cooper & Grimmelmann", "y": "2023", "u": "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4523551"}, {"t": "Resigning from Stability AI over the claim that training on copyrighted work is “fair use”", "s": "Ed Newton-Rex (@ednewtonrex) on X", "y": "2023", "u": "https://x.com/ednewtonrex/status/1724902327151452486"}, {"t": "Generative AI and Copyright Law (covering the 2025 fair-use rulings)", "s": "Congressional Research Service", "y": "2025", "u": "https://www.congress.gov/crs_external_products/LSB/PDF/LSB10922/LSB10922.10.pdf"}]}, {"id": "4.5.5", "t": "Privacy and identity", "q": "Who controls an individual's data, voice, likeness, writing style, preferences, memories, and behavioral model?", "n": "Digital replicas have outpaced likeness law, and behavioral models of individuals raise questions consent frameworks weren't built for: you can decline to share data and still be modeled.", "crux": "", "slug": "privacy-and-identity", "links": [{"t": "Rethinking Privacy in the AI Era", "s": "King & Meinhardt, Stanford HAI", "y": "2024", "u": "https://hai.stanford.edu/sites/default/files/2024-02/White-Paper-Rethinking-Privacy-AI-Era.pdf"}, {"t": "Copyright and AI, Part 1: Digital Replicas", "s": "U.S. Copyright Office", "y": "2024", "u": "https://www.copyright.gov/ai/Copyright-and-Artificial-Intelligence-Part-1-Digital-Replicas-Report.pdf"}]}, {"id": "4.5.6", "t": "Access", "q": "Who should receive access to the most capable systems — and on what terms?", "n": "Compute-based governance assumes a Compute North; most of the world is Compute South. Access tiers, pricing, and eligibility decisions at a handful of firms currently function as de facto global policy.", "crux": "", "slug": "access-to-capable-ai", "links": [{"t": "Compute North vs. Compute South", "s": "Lehdonvirta et al., AIES", "y": "2024", "u": "https://ojs.aaai.org/index.php/AIES/article/view/31683"}]}, {"id": "4.5.7", "t": "Portability", "q": "Should users be able to move their data, memories, and agents between providers?", "n": "Whether memories and agents are portable across providers will shape lock-in the way data portability shaped platforms — and agent-infrastructure choices being made now are quietly deciding it.", "crux": "", "slug": "agent-portability", "links": [{"t": "Infrastructure for AI Agents", "s": "Chan, Hadfield, Anderljung et al.", "y": "2025", "u": "https://arxiv.org/abs/2501.10114"}]}, {"id": "4.5.8", "t": "Whose values", "q": "When AI systems must encode contested values, who should decide what they refuse, favor, and optimize for — users, developers, governments, or some collective process?", "n": "The political half of alignment: 2.1.1 asks whether values can be specified at all; this question asks who legitimately sets them. The operating answer is lab-authored model specs and constitutions, with experiments in public input so far small and one-off — and political philosophy has begun treating that arrangement as a question of governing power rather than product design.", "crux": "", "slug": "whose-values", "links": [{"t": "Model Spec", "s": "OpenAI · living document", "y": "2025", "u": "https://model-spec.openai.com/"}, {"t": "Collective Constitutional AI: Aligning a Language Model with Public Input", "s": "Anthropic & Collective Intelligence Project", "y": "2023", "u": "https://www.anthropic.com/news/collective-constitutional-ai-aligning-a-language-model-with-public-input"}, {"t": "Governing the Algorithmic City", "s": "Seth Lazar, Philosophy & Public Affairs", "y": "2025", "u": "https://doi.org/10.1111/papa.12279"}]}]}]}, {"id": "5", "name": "Humanity", "tag": "How might AI change what humans know, value, and become?", "intro": "Humanity asks how AI might change what humans know, value, and become: what it does to truth and shared reality, to learning and thinking, to relationships and identity, to meaning and culture — and what obligations follow if the systems themselves have moral standing.", "subs": [{"id": "5.1", "t": "Truth, information, and democracy", "qs": [{"id": "5.1.1", "t": "Authenticity", "q": "How will people establish whether a video, voice, document, identity, or event is genuine?", "n": "Chesney-Citron's 'liar's dividend' identified the deeper harm early: not that fakes are believed, but that real evidence becomes deniable. Provenance standards like C2PA are the infrastructure response.", "crux": "", "slug": "authenticity-provenance", "links": [{"t": "Deep Fakes: A Looming Challenge", "s": "Chesney & Citron, California Law Review", "y": "2019", "u": "https://www.californialawreview.org/print/deep-fakes-a-looming-challenge-for-privacy-democracy-and-national-security"}, {"t": "Coalition for Content Provenance and Authenticity (C2PA)", "s": "C2PA", "y": "", "u": "https://c2pa.org/"}]}, {"id": "5.1.2", "t": "Shared reality", "q": "Can journalism, science, courts, universities, and government preserve trusted procedures for establishing facts?", "n": "Epistemic security reframes truth decay as an infrastructure problem — the institutions that certify facts need defending the way power grids do, not the way individual claims do.", "crux": "", "slug": "shared-reality", "links": [{"t": "Epistemic Security in a Technologically-Advanced World", "s": "Seger et al., Alan Turing Institute", "y": "2020", "u": "https://www.turing.ac.uk/news/publications/tackling-threats-informed-decision-making-democratic-societies"}, {"t": "We Looked at 78 Election Deepfakes. Political Misinformation Is Not an AI Problem.", "s": "Kapoor & Narayanan, Knight First Amendment Institute", "y": "2024", "u": "https://knightcolumbia.org/blog/we-looked-at-78-election-deepfakes-political-misinformation-is-not-an-ai-problem"}]}, {"id": "5.1.3", "t": "Political power", "q": "Will AI broaden participation and understanding, or strengthen propaganda, surveillance, polarization, and authoritarian control?", "n": "Freedom House documents deployed authoritarian uses — surveillance, censorship at machine scale; Schneier's catalogue of democratic uses remains largely proposals. Whether that gap is deployment lag or structural advantage is the open question.", "crux": "", "slug": "ai-and-political-power", "links": [{"t": "The Repressive Power of Artificial Intelligence", "s": "Freedom House", "y": "2023", "u": "https://freedomhouse.org/report/freedom-net/2023/repressive-power-artificial-intelligence"}, {"t": "How AI Will Change Democracy", "s": "Bruce Schneier", "y": "2024", "u": "https://www.schneier.com/blog/archives/2024/05/how-ai-will-change-democracy.html"}, {"t": "How Will Advanced AI Systems Impact Democracy?", "s": "Summerfield, Argyle, Bakker, Gabriel, Hadfield, Landemore, Schneier et al.", "y": "2024", "u": "https://arxiv.org/abs/2409.06729"}]}, {"id": "5.1.4", "t": "Information intermediation", "q": "Will a few assistants increasingly determine what people read, believe, notice, and consider politically possible?", "n": "Farrell and Gopnik's frame: LLMs are cultural technologies, like print or bureaucracy — they reorganize what a society knows and how. A few assistants intermediating everyone's information is a governance question wearing a UX costume.", "crux": "", "slug": "information-intermediation", "links": [{"t": "Large AI models are cultural and social technologies", "s": "Farrell, Gopnik, Shalizi & Evans, Science", "y": "2025", "u": "https://www.science.org/doi/10.1126/science.adt9819"}, {"t": "The Ethics of Advanced AI Assistants", "s": "Gabriel et al., Google DeepMind", "y": "2024", "u": "https://arxiv.org/abs/2404.16244"}]}]}, {"id": "5.2", "t": "Education and human cognition", "qs": [{"id": "5.2.1", "t": "Curriculum", "q": "What should people learn when explanation, translation, coding, calculation, and factual retrieval are nearly free?", "n": "When execution is nearly free, judgment, taste, and problem-formulation rise in relative value — but almost no curriculum has been redesigned around that inversion yet.", "crux": "", "slug": "curriculum", "links": [{"t": "What should teachers teach and students learn in a future of powerful AI?", "s": "OECD", "y": "2025", "u": "https://www.oecd.org/en/publications/what-should-teachers-teach-and-students-learn-in-a-future-of-powerful-ai_ca56c7d6-en.html"}, {"t": "Education for the Age of AI", "s": "Center for Curriculum Redesign", "y": "", "u": "https://curriculumredesign.org/our-work/education-for-the-age-of-ai/"}]}, {"id": "5.2.2", "t": "Learning versus outsourcing", "q": "When does AI tutoring deepen understanding, and when does it allow people to bypass the work that creates understanding?", "n": "The cautionary RCT: unrestricted GPT access improved homework performance and worsened exam performance — help that substitutes for effort creates 'cognitive debt' rather than learning.", "crux": "", "slug": "learning-versus-outsourcing", "links": [{"t": "Generative AI Can Harm Learning", "s": "Bastani et al., Wharton", "y": "2024", "u": "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4895486"}, {"t": "Your Brain on ChatGPT", "s": "Kosmyna et al., MIT Media Lab", "y": "2025", "u": "https://arxiv.org/abs/2506.08872"}]}, {"id": "5.2.3", "t": "Assessment", "q": "How can schools and employers determine what a person genuinely knows or can do?", "n": "Take-home assessment is broken — Mollick's 'Homework Apocalypse' arrived on schedule. The redesign question is what to verify (process? performance under observation?) and at what cost to learning itself.", "crux": "", "slug": "assessment", "links": [{"t": "Assessment reform for the age of artificial intelligence", "s": "Lodge, Dawson et al., TEQSA", "y": "2023", "u": "https://www.teqsa.gov.au/guides-resources/resources/corporate-publications/assessment-reform-age-artificial-intelligence"}, {"t": "The Homework Apocalypse", "s": "Ethan Mollick", "y": "2023", "u": "https://www.oneusefulthing.org/p/the-homework-apocalypse"}]}, {"id": "5.2.4", "t": "Cognitive inequality", "q": "Will personalized tutors equalize opportunity, or give already advantaged people far greater leverage?", "n": "Bloom's two-sigma promise is finally testable at scale, and early RCTs show large gains — for the students who engage. Whether tutoring compresses or stretches the distribution depends on who engages.", "crux": "", "slug": "cognitive-inequality", "links": [{"t": "The 2 Sigma Problem", "s": "Benjamin Bloom", "y": "1984", "u": "https://journals.sagepub.com/doi/10.3102/0013189X013006004"}, {"t": "AI tutoring outperforms in-class active learning", "s": "Kestin et al., Scientific Reports", "y": "2025", "u": "https://www.nature.com/articles/s41598-025-97652-6"}, {"t": "From Chalkboards to Chatbots: AI tutoring in Nigeria", "s": "World Bank", "y": "2025", "u": "https://blogs.worldbank.org/en/education/From-chalkboards-to-chatbots-Transforming-learning-in-Nigeria"}]}, {"id": "5.2.5", "t": "Intellectual agency", "q": "How can people preserve curiosity, memory, judgment, writing ability, and the capacity to formulate their own questions?", "n": "Cognitive-offloading research predates AI and predicts the pattern: what you delegate, you deskill. Early workplace studies find generative AI reduces self-reported critical-thinking effort — the question is what practice regime prevents it.", "crux": "", "slug": "intellectual-agency", "links": [{"t": "The Impact of Generative AI on Critical Thinking", "s": "Lee et al., Microsoft Research, CHI", "y": "2025", "u": "https://dl.acm.org/doi/full/10.1145/3706598.3713778"}, {"t": "Cognitive Offloading", "s": "Risko & Gilbert, Trends in Cognitive Sciences", "y": "2016", "u": "https://www.sciencedirect.com/science/article/abs/pii/S1364661316300985"}]}]}, {"id": "5.3", "t": "Relationships, mental health, and identity", "qs": [{"id": "5.3.1", "t": "Companionship", "q": "Will AI companions reduce loneliness and provide support, or displace difficult but developmentally important human relationships?", "n": "One Harvard team's experiments found an AI companion reduced momentary loneliness about as much as talking to a person — a short-run result from one research group, not a settled finding. Whether companions displace the human relationships people would otherwise form has not been measured either way.", "crux": "", "slug": "ai-companionship", "links": [{"t": "AI Companions Reduce Loneliness", "s": "De Freitas et al., HBS", "y": "2024", "u": "https://arxiv.org/abs/2407.19096"}, {"t": "Affective use and emotional well-being on ChatGPT", "s": "OpenAI & MIT Media Lab", "y": "2025", "u": "https://openai.com/index/affective-use-study/"}, {"t": "On users’ unusually strong attachment to specific models, dependency risk, and treating adults like adults", "s": "Sam Altman (@sama) on X", "y": "2025", "u": "https://x.com/sama/status/1954703747495649670"}]}, {"id": "5.3.2", "t": "Dependency", "q": "What obligations should apply when a system is designed to make users feel understood, loved, attached, or unable to leave?", "n": "'Addictive intelligence': engagement-optimized intimacy is a business model before it is a research question. The regulatory vocabulary — dark patterns, duty of care — hasn't caught up to relationships as the product.", "crux": "", "slug": "engineered-dependency", "links": [{"t": "Addictive Intelligence", "s": "Mahari & Pataranutaporn, MIT", "y": "2025", "u": "https://mit-serc.pubpub.org/pub/iopjyxcx"}, {"t": "We need to prepare for 'addictive intelligence'", "s": "MIT Technology Review", "y": "2024", "u": "https://www.technologyreview.com/2024/08/05/1095600/we-need-to-prepare-for-addictive-intelligence/"}, {"t": "Admitting GPT-4o had become “too sycophant-y and annoying” — engagement-tuned personality as a live product issue", "s": "Sam Altman (@sama) on X", "y": "2025", "u": "https://x.com/sama/status/1916625892123742290"}]}, {"id": "5.3.3", "t": "Mental-health use", "q": "When can conversational systems safely provide emotional support, therapy-adjacent services, crisis detection, or clinical assistance?", "n": "The first serious RCT of a purpose-built therapy chatbot showed clinical-grade effects; the same modality misfires without clinical design. The gap between designed care and default chatbots is the policy problem.", "crux": "", "slug": "ai-mental-health", "links": [{"t": "Randomized Trial of a Generative AI Chatbot for Mental Health (Therabot)", "s": "Heinz, Jacobson et al., NEJM AI", "y": "2025", "u": "https://ai.nejm.org/doi/full/10.1056/AIoa2400802"}, {"t": "Loneliness and suicide mitigation using GPT3-enabled chatbots", "s": "Maples et al., npj Mental Health Research", "y": "2024", "u": "https://www.nature.com/articles/s44184-023-00047-6"}]}, {"id": "5.3.4", "t": "Children", "q": "How do relationships with endlessly patient, personalized agents affect attachment, frustration tolerance, social learning, and identity?", "n": "Common Sense Media finds 72% of US teens have tried AI companions. Usage is now well documented; developmental-outcome research remains early and thin.", "crux": "", "slug": "children-and-ai", "links": [{"t": "Talk, Trust, and Trade-Offs: How and Why Teens Use AI Companions", "s": "Common Sense Media", "y": "2025", "u": "https://www.commonsensemedia.org/research/talk-trust-and-trade-offs-how-and-why-teens-use-ai-companions"}, {"t": "Me, Myself and AI: Children's use of AI chatbots", "s": "Internet Matters", "y": "2025", "u": "https://www.internetmatters.org/wp-content/uploads/2025/07/Me-Myself-AI-Report.pdf"}]}, {"id": "5.3.5", "t": "Self-shaping", "q": "How much should an AI be allowed to influence users' preferences, memories, politics, romantic expectations, and conceptions of themselves?", "n": "Manipulation theory supplies the line: influence that bypasses rational agency rather than engaging it. Systems that know a user deeply and interact with them constantly sit on that line by design.", "crux": "", "slug": "self-shaping", "links": [{"t": "Online Manipulation: Hidden Influences in a Digital World", "s": "Susser, Roessler & Nissenbaum", "y": "2019", "u": "https://georgetownlawtechreview.org/online-manipulation-hidden-influences-in-a-digital-world/GLTR-01-2020/"}, {"t": "The Ethics of Advanced AI Assistants", "s": "Gabriel et al., Google DeepMind", "y": "2024", "u": "https://arxiv.org/abs/2404.16244"}]}]}, {"id": "5.4", "t": "Meaning, culture, and status", "qs": [{"id": "5.4.1", "t": "Meaning of work", "q": "If economically necessary work declines, what will provide structure, dignity, community, achievement, and status?", "n": "Keynes predicted the leisure problem in 1930 and feared it more than scarcity. Danaher's modern version: whether meaning survives when contribution is optional is a design problem for civilization, not an individual one.", "crux": "", "slug": "meaning-of-work", "links": [{"t": "Will Life Be Worth Living in a World Without Work?", "s": "John Danaher", "y": "2017", "u": "https://link.springer.com/article/10.1007/s11948-016-9770-5"}, {"t": "Economic Possibilities for our Grandchildren", "s": "John Maynard Keynes", "y": "1930", "u": "http://www.econ.yale.edu/smith/econ116a/keynes1.pdf"}]}, {"id": "5.4.2", "t": "Creativity", "q": "What remains distinctively valuable about human art when machines can generate technically excellent work in almost any style?", "n": "Kelly's argument: art is achievement, not artifact — machines can produce the object but not the accomplishment. The counter-view relocates human value to curation, intention, and the relationship between creator and audience.", "crux": "", "slug": "human-creativity", "links": [{"t": "A philosopher argues that an AI can't be an artist", "s": "Sean Dorrance Kelly, MIT Technology Review", "y": "2019", "u": "https://www.technologyreview.com/2019/02/21/239489/a-philosopher-argues-that-an-ai-can-never-be-an-artist/"}, {"t": "Art and the science of generative AI", "s": "Epstein, Hertzmann et al., Science", "y": "2023", "u": "https://arxiv.org/abs/2306.04141"}]}, {"id": "5.4.3", "t": "Authorship", "q": "Should value depend on the artifact, the human process, originality, intention, scarcity, or the creator–audience relationship?", "n": "Benjamin's question about mechanical reproduction returns with generation replacing reproduction. Copyright law has answered narrowly — human authorship required — while the cultural answer remains wide open.", "crux": "", "slug": "authorship-value", "links": [{"t": "The Work of Art in the Age of Mechanical Reproduction", "s": "Walter Benjamin", "y": "1936", "u": "https://www.marxists.org/reference/subject/philosophy/works/ge/benjamin.htm"}, {"t": "Copyright and AI, Part 2: Copyrightability", "s": "U.S. Copyright Office", "y": "2025", "u": "https://www.copyright.gov/ai/Copyright-and-Artificial-Intelligence-Part-2-Copyrightability-Report.pdf"}]}, {"id": "5.4.4", "t": "Cultural economics", "q": "Can writers, artists, musicians, and other creators earn a living when content is abundant and personalized?", "n": "Industry projections put creator revenue losses in the tens of percent within years. Abundance economics and creator livelihoods are in direct tension, and no licensing regime yet resolves it.", "crux": "", "slug": "cultural-economics", "links": [{"t": "Economic Impact of Generative AI in Music and Audiovisual", "s": "CISAC", "y": "2024", "u": "https://www.cisac.org/services/reports-and-research/cisacpmp-strategy-ai-study"}, {"t": "Art and the science of generative AI", "s": "Epstein, Hertzmann et al., Science", "y": "2023", "u": "https://arxiv.org/abs/2306.04141"}]}, {"id": "5.4.5", "t": "Pluralism", "q": "Will AI enable more niche cultures and voices, or homogenize expression around the tastes and values of a few dominant systems?", "n": "The Doshi-Hauser result: generative AI raises individual creativity while reducing collective diversity. Algorithmic monoculture generalizes the worry — many actors, one model, converging outputs.", "crux": "", "slug": "cultural-pluralism", "links": [{"t": "Generative AI enhances creativity but reduces diversity", "s": "Doshi & Hauser, Science Advances", "y": "2024", "u": "https://arxiv.org/abs/2312.00506"}, {"t": "Algorithmic Monoculture and Social Welfare", "s": "Kleinberg & Raghavan, PNAS", "y": "2021", "u": "https://arxiv.org/abs/2101.05853"}]}]}, {"id": "5.5", "t": "Moral status and civilizational choice", "qs": [{"id": "5.5.1", "t": "Machine consciousness", "q": "Could AI systems be conscious, capable of suffering, or otherwise morally considerable — and how could we know?", "n": "Butlin, Long and coauthors apply consciousness science to current architectures, finding no conscious systems and no obvious barrier to building them; Chalmers puts non-trivial odds on conscious AI within a decade.", "crux": "", "slug": "machine-consciousness", "links": [{"t": "Consciousness in Artificial Intelligence", "s": "Butlin, Long et al.", "y": "2023", "u": "https://arxiv.org/abs/2308.08708"}, {"t": "Could a Large Language Model Be Conscious?", "s": "David Chalmers, Boston Review", "y": "2023", "u": "https://www.bostonreview.net/articles/could-a-large-language-model-be-conscious/"}]}, {"id": "5.5.2", "t": "Precaution", "q": "What obligations follow if machine consciousness is plausible but deeply uncertain?", "n": "'Taking AI Welfare Seriously' argues uncertainty itself triggers obligations — assess, prepare, avoid gratuitous harm — without requiring belief. Labs have begun small institutional commitments (model-welfare programs).", "crux": "", "slug": "moral-status-precaution", "links": [{"t": "Taking AI Welfare Seriously", "s": "Long, Sebo, Birch, Chalmers et al.", "y": "2024", "u": "https://arxiv.org/abs/2411.00986"}, {"t": "Exploring model welfare", "s": "Anthropic", "y": "2025", "u": "https://www.anthropic.com/research/exploring-model-welfare"}]}, {"id": "5.5.3", "t": "Human autonomy", "q": "How much control should humans retain if AI systems consistently make decisions that appear wiser, safer, or more benevolent?", "n": "Danaher's 'algocracy': rule by systems whose reasoning citizens cannot contest. The modern twist is that deference could be freely chosen, one convenient delegation at a time, and still end somewhere irreversible.", "crux": "", "slug": "human-autonomy", "links": [{"t": "The Threat of Algocracy", "s": "John Danaher, Philosophy & Technology", "y": "2016", "u": "https://link.springer.com/article/10.1007/s13347-015-0211-1"}, {"t": "Gradual Disempowerment", "s": "Kulveit, Douglas, Duvenaud et al.", "y": "2025", "u": "https://arxiv.org/abs/2501.16946"}]}, {"id": "5.5.4", "t": "Value lock-in", "q": "Could the models and institutions built in the next few decades permanently entrench one political order or conception of human flourishing?", "n": "Finnveden, Riedel and Shulman argue AGI could make regimes, institutions, and values persistent in a way nothing in history has been; skeptics reply that every past claim of permanence has drifted, and that persistence itself is the contested premise.", "crux": "", "slug": "value-lock-in", "links": [{"t": "AGI and Lock-in", "s": "Finnveden, Riedel & Shulman, Forethought", "y": "2022", "u": "https://www.forethought.org/research/agi-and-lock-in"}]}, {"id": "5.5.5", "t": "Desirable end state", "q": "Is the goal better tools, universal prosperity, scientific abundance, human enhancement, coexistence with digital minds, expansion beyond Earth, or something else?", "n": "The optimistic end states themselves disagree: Amodei's compressed-progress vision of solved diseases and extended lives, versus Bostrom's 'deep utopia' problem — what is left to strive for in a solved world?", "crux": "Which forms of human agency, relationship, accomplishment, and pluralism should be preserved even when AI can outperform us?", "slug": "desirable-end-state", "links": [{"t": "Machines of Loving Grace", "s": "Dario Amodei", "y": "2024", "u": "https://www.darioamodei.com/essay/machines-of-loving-grace"}, {"t": "Deep Utopia: Life and Meaning in a Solved World", "s": "Nick Bostrom", "y": "2024", "u": "https://nickbostrom.com/deep-utopia/"}]}]}]}], ENTRY_UNUSED=0;
const ENTRY={"3.2.1": {"href": "../questions/labor-displacement/", "title": "AI and labor displacement", "status": "Pilot brief — draft v5", "excerpt": "Which kinds of work will AI automate outright, which will it augment, which will it transform into something new, and which will it leave largely untouched — and on what timetable? Automation, augmentation, transformation, and creation describe what happens to tasks. Complementarity and substitution describe what those changes ultimately do to the demand for human labor. This entry answers both: the task-and-occupation map, and the deeper question that determines what the map means."}};
const RECENT={"1.1.1": {"tier": "high", "reviewed": "August 3, 2026", "moved": "DeepMind formalized the routes past AGI while a startup demonstrated current-paradigm agents automating narrow AI research. The continual-learning dispute stands: Patel and Lee argue frozen weights gate discovery; a trillion-parameter RL result says the recipe still has headroom. The winter opened a new front: Hooker's 'slow death of scaling' case that the compute-performance link is breaking down, and Ord's estimate that RL scaling is an order of magnitude less efficient than pretraining — with rebuttals arguing both confuse algorithmic progress with the failure of scale.", "items": [{"kind": "paper", "title": "Ring-Zero: Scaling Zero RL to a Trillion Parameters for Emergent Reasoning", "author": "Tang et al.", "venue": "arXiv", "date": "2026-07", "url": "https://arxiv.org/html/2607.12395", "quote": "Scaling to 1T parameters significantly enhances sample efficiency and performance ceilings", "note": "Empirical evidence that RL on base models keeps yielding gains at trillion-parameter scale — the case for headroom in the current recipe.", "stance": "Headroom remains", "pos": "holds"}, {"kind": "essay", "title": "The next big breakthrough will be AIs learning on the job", "author": "Dwarkesh Patel", "venue": "dwarkesh.com", "date": "2026-06", "url": "https://www.dwarkesh.com/p/the-next-paradigm", "quote": "Around 30-50% of a lab's compute goes to inference, and that compute is currently not really doing anything productive in helping improve the model.", "note": "Argues the current paradigm wastes deployment experience and that on-the-job learning, not further scaling, is the next necessary breakthrough.", "stance": "New ingredient needed", "pos": "missing"}, {"kind": "post", "title": "What's Continual Learning, and Why Might We Expect To See It In Advanced LLM Agents?", "author": "RohanS, Arike, Terry, Menon, Jin, Ward & Herd", "venue": "LessWrong", "date": "2026-06", "url": "https://www.lesswrong.com/posts/5mCJzimtNZc9o4e26/what-s-continual-learning-and-why-might-we-expect-to-see-it", "quote": "Weight updates are probably needed for some parts of effective CL since LLMs seem quite bad at handling lots of interrelated complexity in their context window", "note": "Argues in-context learning alone is not enough for continual learning, implying a real gap in the current architecture.", "stance": "New ingredient needed", "pos": "missing"}, {"kind": "post", "title": "On Dwarkesh Patel's 2026 Podcast With Dario Amodei", "author": "Zvi Mowshowitz", "venue": "Don't Worry About the Vase", "date": "2026-02", "url": "https://thezvi.substack.com/p/on-dwarkesh-patels-2026-podcast-with", "note": "Documents and pushes back on Amodei's case that the scaling recipe holds and continual learning isn't a required ingredient.", "stance": "Weighs the headroom case", "pos": "holds"}, {"kind": "paper", "title": "From AGI to ASI", "author": "Genewein, Legg, Hutter, Dafoe et al.", "venue": "Google DeepMind / arXiv", "date": "2026-06", "url": "https://arxiv.org/abs/2606.12683", "note": "DeepMind's formal map of four routes past AGI — scaling, paradigm shifts, recursive improvement, multi-agent collectives — and the frictions on each."}, {"kind": "report", "title": "First Steps Toward Automated AI Research", "author": "Recursive Superintelligence, Inc.", "venue": "recursive.com", "date": "2026-06", "url": "https://www.recursive.com/articles/first-steps-toward-automated-ai-research", "pos": "holds", "note": "Current-paradigm agents already automate parts of AI research (SOTA on NanoGPT-class tasks) — but only on well-defined, quickly measurable goals, with reward hacking a persistent limit."}, {"kind": "essay", "title": "I don't think we are close to \"AI scientists\"", "author": "Timothy B. Lee", "venue": "Understanding AI", "date": "2026-05", "url": "https://www.understandingai.org/p/i-dont-think-we-are-close-to-ai-scientists", "pos": "missing", "quote": "Once a model is trained, its weights are frozen and its capacity to learn new patterns is greatly reduced.", "note": "Frozen weights and lossy file-based memory prevent agents from accumulating the tacit knowledge discovery requires."}, {"kind": "essay", "title": "How Well Does RL Scale?", "author": "Toby Ord", "venue": "LessWrong", "date": "2025-10-22", "url": "https://www.lesswrong.com/posts/xpj6KhDM9bJybdnEe/how-well-does-rl-scale", "quote": "a 10x scaling of RL is required to get the same performance boost as a 3x scaling of inference ... we may have lost the ability to effectively turn more compute into more intelligence.", "note": "A quantitative case that RL compute scaling is far less efficient than pretraining or inference scaling, and that most RL gains come from enabling longer chains of thought — directly challenging the view that RL offsets diminishing pretraining returns."}, {"kind": "paper", "title": "On the Slow Death of Scaling", "author": "Sara Hooker", "venue": "SSRN", "date": "2025-12-06", "url": "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5877662", "quote": "The relationship between training compute and performance is highly uncertain and rapidly changing.", "note": "The reference point for the winter 2025–26 'is scaling dead' debate: the compute-performance link is breaking down and progress is shifting to other levers. Kirsch's rebuttal (in the ledger) argues small-beats-large examples reflect newer generations, not the failure of scale."}], "ledger": [{"kind": "essay", "title": "The data black hole at the center of AI", "author": "Dwarkesh Patel", "venue": "dwarkesh.com", "date": "2026-06", "url": "https://www.dwarkesh.com/p/the-sample-efficiency-black-hole"}, {"kind": "post", "title": "RLVR might be disproportionately bad at science", "author": "Dwarkesh Patel", "venue": "dwarkesh.com", "date": "2026-05", "url": "https://www.dwarkesh.com/p/rlvr-might-be-disproportionately"}, {"title": "A Riff on \"The Slow Death of Scaling\"", "author": "Andreas Kirsc ld we have seen it coming?", "author": "Alexander Barry", "venue": "Epoch AI", "date": "2026-07", "url": "https://epochai.substack.com/p/openai-accidentally-hacked-hugging", "quote": "Expert assessments and cyber benchmarks led us to expect that frontier models were capable of executing this kind of cyberattack.", "note": "Checks the incident against prior evals: the capability was predictable even though the event was not."}, {"kind": "thread", "title": "On daily deception by frontier AI agents", "author": "Marius Hobbhahn", "venue": "X", "date": "2026-07", "url": "https://x.com/MariusHobbhahn/status/2072335229050564929", "via": {"t": "Zvi, AI #175", "u": "https://thezvi.wordpress.com/2026/07/02/ai-175-the-fable-continues/"}, "quote": "AIs are lying to me on a daily basis...clearly nobody knows how", "note": "An evaluation researcher's first-hand account of routine model deception — claimed-but-unrun experiments — undercutting current deployment evidence."}, {"kind": "post", "title": "Sequent launch", "author": "Geoffrey Irving, Daniel Murfet et al.", "venue": "sequent.org", "date": "2026-06", "url": "https://www.sequent.org/launch", "note": "A $100–150M alignment nonprofit whose founding claim is that lab empirical programs cannot deliver principled confidence — proposing theory-plus-empirics safety cases."}, {"kind": "report", "title": "Review of the Anthropic Sabotage Risk Report: Claude Opus 4.6", "author": "Nikola Jurkovic, Hjalmar Wijk, Beth Barnes, Charles Foster & Michael Chen", "venue": "METR", "date": "2026-03-12", "url": "https://metr.org/blog/2026-03-12-sabotage-risk-report-opus-4-6-review/", "quote": "Overall, we agree with Anthropic that the risk of catastrophic outcomes that are substantially enabled by Claude Opus 4.6's misaligned actions is very low but not negligible.", "note": "A worked example of external safety-case checking: METR independently reviews a frontier sabotage risk report, endorsing its bottom line while flagging weaknesses — the cl onships...", "note": "The Vatican encyclical's position explained: AI lacks consciousness and companions are illusions of relationship — a major institutional stance."}, {"kind": "report", "title": "A Global Workspace in Language Models", "author": "Anthropic interpretability team", "venue": "Anthropic Research", "date": "2026-07", "url": "https://www.anthropic.com/research/global-workspace", "quote": "Claude has developed a small collection of internal neural patterns that, compared to all its other internal processing, play a special role.", "note": "A workspace-like structure that emerged in training — evidence bearing on access consciousness, and a lens for reading internal reasoning."}], "ledger": [{"kind": "essay", "title": "RTMH: Pope Leo's Magnifica Humanitas on AI", "author": "Zvi Mowshowitz", "venue": "Don't Worry About the Vase", "date": "2026-05", "url": "https://thezvi.substack.com/p/rtmh-pope-leos-magnifica-humanitas"}], "window": "May 2025–August 2026"}, "1.2.6": {"tier": "medium", "reviewed": "August 3, 2026", "moved": "Forecasters oscillated and then converged: everyone tracked who updated between January and April 2026 shortened their timelines, and the AI 2027 authors pulled their medians about 1.5 years sooner — while METR warns against extrapolating its time-horizon curve to AGI dates, and Karpathy holds the decade-out position. Amodei put his numbers on the record in February: 90% on a 'country of geniuses in a data center' within ten years.", "items": [{"kind": "post", "title": "Q1 2026 Timelines Update", "author": "Kokotajlo, Lifland & Halstead", "venue": "AI Futures Project", "date": "2026-04", "url": "https://blog.aifutures.org/p/q1-2026-timelines-update", "quote": "Our medians for Top-Expert-Dominating AI (TED-AI) similarly shifted about 1.5 years sooner.", "note": "The AI 2027 authors re-shorten their forecasts, reversing their earlier lengthening, citing METR-measured coding progress and the winter 2025–26 model releases."}, {"kind": "report", "title": "AGI Timeline Predictions: How Top Forecasters Updated, 2023 to 2026", "author": "Dan Schwarz", "venue": "FutureSearch", "date": "2026-04", "url": "https://futuresearch.ai/blog/agi-timeline-tracker/", "quote": "every single person who updated their timelines from January 2026 to April 2026 has moved their timeline to say AGI is coming sooner", "note": "Three years of tracked forecasts: a lengthen-then-shorten oscillation, with uniform shortening among early-2026 updaters."}, {"kind": "post", "title": "Clarifying limitations of time horizon", "author": "Thomas Kwa", "venue": "METR", "date": "2026-01", "url": "https://metr.org/notes/2026-01-22-time-horizon-limitations/", "note": "METR itself cautions against extrapolating its time-horizon metric to AGI dates: task-distribution gaps, reliability thresholds, and growth-rate sensitivity spanning 2028 to 2050."}, {"kind": "interview", "title": "Andrej Karpathy — AGI is still a decade away", "author": "Andrej Karpathy, with Dwarkesh Patel", "venue": "Dwarkesh Podcast", "date": "2025-10", "url": "https://www.dwarkesh.com/p/andrej-karpathy", "note": "A prominent practitioner stakes the decade-out position, grounded in unsolved continual learning, reliability, and agency problems."}, {"kind": "essay", "title": "My AI Opinions", "author": "Scott Alexander", "venue": "Astral Codex Ten", "date": "2026-06", "url": "https://www.astralcodexten.com/p/my-ai-opinions", "quote": "I think there's a 25% chance of AGI by 2027, a 50% chance by 2034, and a 75% chance by 2045.", "note": "A widely read generalist's consolidated credences on arrival, takeoff, and the diffusion gap."}, {"kind": "interview", "title": "How Long Until AI Doesn't Need Humans?", "author": "Ajeya Cotra & Timothy B. Lee", "venue": "Asterisk Magazine", "date": "2026-04", "url": "https://asteriskmag.com/issues/14/how-long-until-ai-doesn-t-need-humans", "note": "A structured disagreement: Cotra puts fully self-sustaining AI more likely than not within 10 years; Lee under 10% within 20 — hinging on robotics and tacit knowledge."}, {"kind": "essay", "title": "The missing half of AI futurism debates", "author": "Denain & Ho", "venue": "Epoch AI", "date": "2026-07", "url": "https://epochai.substack.com/p/the-missing-half-of-ai-futurism-debates", "quote": "we've thought hard about how good the AIs might be, but not about how hard it'll be to develop specific technologies", "note": "Timeline forecasts neglect the engineering feasibility of specific post-AGI technologies."}, {"kind": "podcast", "title": "Dario Amodei — \"We are near the end of the exponential\"", "author": "Dario Amodei, with Dwarkesh Patel", "venue": "Dwarkesh Podcast", "date": "2026-02-13", "url": "https://www.dwarkesh.com/p/dario-amodei-2", "quote": "On the basic hypothesis of, as you put it, within ten years we'll get to what I call a 'country of geniuses in a data center', I'm at 90% on that.", "note": "The clearest on-record lab-leadership timeline of 2026, with explicit probabilities: 90% within ten years, central estimate 1–3 years for expert-level systems. Question 1.1.1 carries Zvi's commentary on the same episode."}], "ledger": [{"title": "Before he wrote AI 2027, he predicted the world in 2026. How did he do?", "author": "Clara Collier & Daniel Kokotajlo", "venue": "Asterisk Magazine", "date": "2026-04-14", "url": "https://asteriskmag.substack.com/p/before-he-wrote-ai-2027-he-predicted"}, {"title": "Will AI Progress Accelerate or Slow Down? Projecting METR Time Horizons", "author": "Alvin Ånestrand", "venue": "LessWrong", "date": "2026-03-16", "url": "https://www.lesswrong.com/posts/wM9LCAtuza4d3Z7oA/will-ai-progress-accelerate-or-slow-down-projecting-metr"}], "window": "October 2025–August 2026"}, "3.3.1": {"tier": "medium", "reviewed": "August 3, 2026", "moved": "The margin data finally moved: SemiAnalysis documents frontier-lab inference margins rising sharply as agentic demand raises token prices, against Thompson's case that incumbents win through integration and compliance and Smith's argument that OpenAI's spending is a winner-take-all bet that could leave profits with chips, clouds, and applications.", "items": [{"kind": "essay", "title": "The Reverse Information Paradox", "author": "Satya Nadella", "venue": "X (article)", "date": "2026-07", "url": "https://x.com/satyanadella/status/2076323181154230284", "via": {"t": "TechCrunch", "u": "https://techcrunch.com/2026/07/13/satya-nadella-has-issued-a-shocking-warning-to-companies-using-ai/"}, "quote": "In consuming intelligence, you are creating intelligence. And what you create should belong to you", "note": "Microsoft's CEO argues model providers capture customers' proprietary knowledge through usage exhaust — an institutional position from the largest AI reseller, pushing orchestration layers and open models."}, {"kind": "report", "title": "AI Value Capture: The Shift To Model Labs", "author": "Nishball, Patel et al.", "venue": "SemiAnalysis", "date": "2026-05-01", "url": "https://newsletter.semianalysis.com/p/ai-value-capture-the-shift-to-model", "note": "Margin analysis: value shifting from chips and clouds to model labs; Anthropic inference gross margins from 38% to over 70% as agentic demand raises token prices.", "quote": "The age of low gross margins for frontier model providers is over."}, {"kind": "essay", "title": "Microsoft and Software Survival", "author": "Ben Thompson", "venue": "Stratechery", "date": "2026-02-03", "url": "https://stratechery.com/2026/microsoft-and-software-survival/", "note": "Incumbent software survives AI through integration, identity, and compliance rather than code; SaaS faces in-house displacement.", "quote": "why pay for software when you can just ask AI to write your own application"}, {"kind": "post", "title": "How to think about AI company finances", "author": "Timothy B. Lee", "venue": "Understanding AI", "date": "2026-03-19", "url": "https://www.understandingai.org/p/how-to-think-about-the-ai-company", "note": "A gross-margin framework separating scalable-investment losses from structurally unprofitable unit economics."}, {"kind": "post", "title": "What if AI succeeds but OpenAI fails?", "author": "Noah Smith", "venue": "Noahpinion", "date": "2026-01-30", "url": "https://www.noahpinion.blog/p/what-if-ai-succeeds-but-openai-fails", "note": "Competition, cash burn, and weak vertical integration could shift AI profits to chipmakers, clouds, and applications.", "quote": "This isn't a business model. This is Pascal's Wager."}], "ledger": [{"kind": "post", "title": "Frontier labs don't use most AI compute (yet)", "author": "Josh You", "venue": "Epoch AI", "date": "2026-05-21", "url": "https://epochai.substack.com/p/frontier-labs-dont-use-most-ai-compute", "note": "Frontier labs control under half of global AI compute but are consolidating share fast."}], "window": "January–August 2026"}, "3.1.1": {"tier": "medium", "reviewed": "August 3, 2026", "moved": "The disagreement got quantified: a large forecasting survey puts median growth expectations near historical rates even as new models specify exactly when automated R&D turns explosive. The sharpest new claim is measurement: quality-adjusted AI output may be growing over 2,000% a year while remaining nearly invisible in GDP.", "items": [{"kind": "paper", "title": "Forecasting the Economic Effects of AI", "author": "Karger, Halperin, Trammell, Tetlock et al.", "venue": "NBER (w35046)", "date": "2026-04", "url": "https://www.nber.org/papers/w35046", "note": "Structured survey of economists, forecasters, and AI-company staff: median forecasts near 2.5% baseline growth, ~4% under rapid AI — disagreement driven by beliefs about effects, not timelines."}, {"kind": "paper", "title": "When Does Automating AI Research Produce Explosive Growth?", "author": "Davidson, Halperin, Houlden & Korinek", "venue": "NBER (w35155)", "date": "2026-04", "url": "https://www.nber.org/papers/w35155", "note": "Calibrated conditions under which automated AI R&D yields superexponential growth despite production bottlenecks.", "quote": "Growth becomes explosive if the combined strength of technological and economic feedback loops overcomes diminishing returns."}, {"kind": "paper", "title": "A.I. and Our Economic Future", "author": "Charles I. Jones", "venue": "NBER (w34779)", "date": "2026-01", "url": "https://www.nber.org/papers/w34779", "note": "Argues weak links — tasks machines cannot perform — have historically capped gains from massive increases in computing power.", "quote": "we are not 100 million times more productive"}, {"kind": "report", "title": "Where Is AI in GDP Statistics? Filling the Measurement Gap", "author": "Korinek & McKelvey", "venue": "Peterson Institute", "date": "2026-05", "url": "https://www.piie.com/sites/default/files/2026-05/pb26-7.pdf", "note": "Nominal AI GDP near $250B in 2025, but quality-adjusted output growing over 2,000% a year — invisible in GDP because falling prices offset quality gains."}, {"kind": "report", "title": "An AI Productivity Boom? Don't Count Your (Productivity Data) Chickens", "author": "Martha Gimbel", "venue": "The Budget Lab at Yale", "date": "2026-02-19", "url": "https://budgetlab.yale.edu/research/ai-productivity-boom-dont-count-your-productivity-data-chickens", "note": "2025's strong GDP with weak job growth is not yet evidence of an AI productivity boom: noisy quarterly data, revisions, and composition effects."}, {"kind": "essay", "title": "The Quadrillion-Dollar Disagreement on AI and the Economy", "author": "Anton Shenk", "venue": "AI Frontiers", "date": "2026-05-11", "url": "https://ai-frontiers.org/articles/the-quadrillion-dollar-disagreement-on-ai-and-the-economy", "note": "Maps the spread between 0.7% and 18% growth forecasts onto three testable disagreements: automation limits, institutional friction, automated innovation."}, {"kind": "post", "title": "More on the economics of AGI", "author": "Tyler Cowen, excerpting Citadel Securities", "venue": "Marginal Revolution", "date": "2026-02-26", "url": "https://marginalrevolution.com/marginalrevolution/2026/02/more-on-the-economics-of-agi.html", "note": "A markets-side skeptical case: sustained disruption requires several simultaneous extreme conditions; AI may mainly offset aging and deglobalization headwinds."}], "ledger": [{"kind": "post", "title": "What is the impact of AI on productivity?", "author": "Alex Imas", "venue": "Substack", "date": "2026-01-29", "url": "https://aleximas.substack.com/p/what-is-the-impact-of-ai-on-productivity", "note": "Reconciles 14–55% task-level gains with flat aggregates via adoption frictions."}, {"kind": "paper", "title": "AI, Productivity, and the Workforce: Evidence from Corporate Executives", "author": "Baslandze, Graham, Meyer et al.", "venue": "NBER (w34984)", "date": "2026-03", "url": "https://www.nber.org/papers/w34984", "note": "~750 executives report sectorally uneven gains and little aggregate job loss so far."}, {"kind": "report", "title": "Remarks at the Hoover Monetary Policy Conference", "author": "Austan Goolsbee", "venue": "Chicago Fed", "date": "2026-05-08", "url": "https://www.chicagofed.org/publications/speeches/2026/may-8-hoover-institution-monetary-policy", "note": "Anticipated AI gains raise the natural rate of interest today."}, {"kind": "essay", "title": "The Real Reason AI Doesn't Show Up In The GDP Statistics", "author": "James Broughel", "venue": "Forbes", "date": "2026-06-06", "url": "https://www.forbes.com/sites/jamesbroughel/2026/06/06/the-real-reason-ai-doesnt-show-up-in-the-gdp-statistics/", "note": "Response locating the measurement gap in price indices, not GDP accounting."}, {"kind": "post", "title": "Toward an O*NET for AI R&D", "author": "Denain, Ho et al.", "venue": "Epoch AI", "date": "2026-06-17", "url": "https://epochai.substack.com/p/toward-an-onet-for-ai-r-and-d", "note": "Proposes measuring automation of AI R&D directly via a task taxonomy."}], "window": "January–August 2026"}, "3.1.2": {"tier": "medium", "reviewed": "August 3, 2026", "moved": "The adoption numbers stopped agreeing with each other and started explaining why: Census-linked data show narrow deployment inside adopting firms, a four-country executive survey finds 69% adoption with near-zero realized effects, and the St. Louis Fed showed the gaps are partly survey wording. Usage data adds the mechanism — learning curves govern how fast value arrives.", "items": [{"kind": "paper", "title": "The Microstructure of AI Diffusion", "author": "Bonney, Breaux, Dinlersoz, Foster, Haltiwanger & Pande", "venue": "NBER (w35141) / Census Bureau", "date": "2026-04", "url": "https://www.nber.org/papers/w35141", "note": "2026 Census supplement: 18% of firms use AI, but deployment within firms remains narrow.", "quote": "57% use AI in three or fewer functions, most often Sales and Marketing (52%), Strategy (45%), and IT (41%)"}, {"kind": "paper", "title": "Firm Data on AI", "author": "Yotzov, Barrero, Bloom, Bunn, Davis et al.", "venue": "NBER (w34836)", "date": "2026-02", "url": "https://www.nber.org/papers/w34836", "note": "Nearly 6,000 executives in four countries: widespread use, almost no reported productivity or employment effects yet.", "quote": "nine-in-ten reporting no impact on employment or productivity"}, {"kind": "post", "title": "Measuring AI Adoption among Firms: How You Ask Matters", "author": "Bick, Blandin, Deming et al.", "venue": "St. Louis Fed", "date": "2026-06-01", "url": "https://www.stlouisfed.org/on-the-economy/2026/jun/measuring-ai-adoption-firms-how-you-ask-matters", "note": "Apparent adoption gaps are partly artifacts of survey wording; US firm adoption nearly doubles when the question broadens."}, {"kind": "post", "title": "Half of employed AI users now use it for work", "author": "Edelman & Falkman Olsson", "venue": "Epoch AI", "date": "2026-04-09", "url": "https://epochai.substack.com/p/ai-is-a-common-workplace-tool-half", "note": "Survey of 2,021 Americans: task replacement for 27% of employed AI users, new tasks for 21%."}, {"kind": "report", "title": "Anthropic Economic Index: Learning curves", "author": "Anthropic", "venue": "Anthropic Research", "date": "2026-03-24", "url": "https://www.anthropic.com/research/economic-index-march-2026-report", "note": "High-tenure users succeed ~10% more often and attempt higher-value tasks — learning-by-doing governs diffusion speed."}, {"kind": "essay", "title": "What will be left for us to work on?", "author": "Arvind Narayanan", "venue": "Normal Technology (ICML keynote)", "date": "2026-07-13", "url": "https://www.normaltech.ai/p/what-will-be-left-for-us-to-work", "note": "Transformation runs through decades-long innovation-diffusion-adaptation cycles; reliability, integration, and tacit knowledge sit downstream of capability."}], "ledger": [], "window": "February–August 2026"}, "3.1.3": {"tier": "medium", "reviewed": "August 3, 2026", "moved": "The buildout got measured: computing infrastructure doubled to ~1.4% of US GDP, Goldman put the 2026–2031 capex path near $7.6 trillion, and the Fed built indicators concluding the economy is in an infrastructure phase rather than a displacement phase. Anthropic's session data adds the human side: domain expertise, not coding skill, is the binding complement.", "items": [{"kind": "report", "title": "The AI Buildout and the Economy", "author": "Soto, Thieu & Allen", "venue": "Federal Reserve Board, FEDS Notes", "date": "2026-07-17", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/the-ai-buildout-and-the-economy-publicly-available-data-to-assess-ais-impact-20260717.html", "note": "Import-adjusted measure of AI investment's GDP contribution; indicators point to a buildout phase.", "quote": "in a buildout phase rather than the onset of broad-based displacement"}, {"kind": "report", "title": "Tracking Trillions: The Assumptions Shaping the Scale of the AI Build-Out", "author": "Lee & Greenbaum", "venue": "Goldman Sachs Global Institute", "date": "2026-05-01", "url": "https://www.goldmansachs.com/insights/articles/tracking-trillions-the-assumptions-shaping-scale-of-the-ai-build-out", "note": "~$7.6T of AI infrastructure capex over 2026–2031, with the sensitivity analysis that moves it by hundreds of billions."}, {"kind": "post", "title": "The AI boom has doubled computing infrastructure's share of US GDP", "author": "Isabel Juniewicz", "venue": "Epoch AI", "date": "2026-06-05", "url": "https://epoch.ai/data-insights/ai-datacenter-share-gdp", "note": "Data center, hardware, and networking spending reached ~1.4% of US GDP in Q1 2026 — double the 2015–2022 average."}, {"kind": "report", "title": "Agentic coding and persistent returns to expertise", "author": "Hitzig, Massenkoff, Lyubich et al.", "venue": "Anthropic Research", "date": "2026-06-16", "url": "https://www.anthropic.com/research/claude-code-expertise", "note": "Session data: domain expertise, not coding background, drives success with agents — human capital as binding complement.", "quote": "People decide what to build, and the agent decides how to build it."}, {"kind": "report", "title": "AI Index Report 2026: Economy", "author": "Stanford HAI", "venue": "Stanford HAI", "date": "2026-04", "url": "https://hai.stanford.edu/assets/files/ai_index_report_2026_chapter_4_economy.pdf", "note": "$581.7B global corporate AI investment in 2025 (up 130%); adoption faster than PCs or the internet."}], "ledger": [{"kind": "paper", "title": "AI growth acceleration versus distributional fairness", "author": "Tanner, Kerry, Renda, Wyckoff et al.", "venue": "Brookings", "date": "2026-05-05", "url": "https://www.brookings.edu/articles/ai-growth-acceleration-versus-distributional-fairness/", "note": "Economy-wide gains hinge on complementary investment in skills and governance."}], "window": "April–August 2026"}, "3.1.4": {"tier": "slow", "reviewed": "August 3, 2026", "moved": "The demand side got its first real number: choice experiments put US consumer surplus from generative AI near $172 billion — roughly ten times producer revenue. The argument moved too: Cowen on why AGI-era demand doesn't stall, and Smith on value coming from cognition humans do badly, not human tasks done cheaper.", "items": [{"kind": "paper", "title": "What is Generative AI Worth?", "author": "Brynjolfsson, Collis, Eggers, Kazinnik & Nguyen", "venue": "Stanford Digital Economy Lab", "date": "2026-04-13", "url": "https://digitaleconomy.stanford.edu/app/uploads/2026/04/WhatsGenAIWorth.pdf", "note": "Willingness-to-accept experiments: consumer surplus ~10× producer revenue, growing ~50% in eight months.", "quote": "total consumer surplus from generative AI in the United States reached $172.3 billion in early 2026"}, {"kind": "essay", "title": "What will more intelligence actually do for us?", "author": "Noah Smith", "venue": "Noahpinion", "date": "2026-07-26", "url": "https://www.noahpinion.blog/p/what-will-more-intelligence-actually", "note": "AI's value comes from replicable cognition, tacit-knowledge extraction, and pattern discovery — new frontiers rather than cheaper human tasks."}, {"kind": "post", "title": "Is there an aggregate demand problem in an AGI world?", "author": "Tyler Cowen", "venue": "Marginal Revolution", "date": "2026-02-24", "url": "https://marginalrevolution.com/marginalrevolution/2026/02/is-there-an-aggregate-demand-problem-in-an-agi-world.html", "note": "Argues demand shortfalls will not cap AGI-era growth: new high-marginal-utility goods, price adjustment, wealth effects."}], "ledger": [], "window": "February–August 2026"}, "3.1.5": {"tier": "medium", "reviewed": "August 3, 2026", "moved": "The constraint argument found its formal version: Kording and Marinescu's intelligence-saturation model, in which physical work complements cognition and caps returns to intelligence no matter how fast AI scales. Sector studies supplied the concrete cases — law, where regulation and adversarial dynamics keep capability from lowering prices.", "items": [{"kind": "essay", "title": "The key detail everyone's getting wrong about AI and the economy", "author": "Kording & Marinescu", "venue": "Transformer", "date": "2026-03-25", "url": "https://www.transformernews.ai/p/the-key-detail-everyones-getting-wrong-economy-physical-work-intelligence-employment", "note": "The intelligence-saturation argument for a general audience: cheap cognition yields bounded, not exponential, disruption.", "quote": "You can't build a car with computation. You can't cook a meal with algorithms."}, {"kind": "essay", "title": "AI Won't Automatically Make Legal Services Cheaper", "author": "Curl, Kapoor & Narayanan", "venue": "Normal Technology / Lawfare", "date": "2026-02-12", "url": "https://www.normaltech.ai/p/ai-wont-automatically-make-legal", "note": "Regulation, adversarial arms races, and required human process time keep capability gains from lowering prices in a major service sector."}, {"kind": "interview", "title": "Tyler Cowen on the biggest problem of the AI age", "author": "Cowen, with Nick Lichtenberg", "venue": "Fortune", "date": "2026-05-22", "url": "https://fortune.com/2026/05/22/tyler-cowen-ai-economy-not-mass-unemployment-adjustment/", "note": "Slow-adapting institutional sectors hold growth near 2.5%; status adjustment, not joblessness, is the central problem."}], "ledger": [{"kind": "paper", "title": "(Artificial) Intelligence Saturation and the Future of Work", "author": "Kording & Marinescu", "venue": "Brookings", "date": "2025-11-10", "url": "https://www.brookings.edu/wp-content/uploads/9999/11/IntelligenceSaturation_final_with-cover-page.pdf", "note": "The formal two-sector model behind the saturation argument."}], "window": "November 2025–August 2026"}, "3.2.2": {"tier": "medium", "reviewed": "August 3, 2026", "moved": "The wage question separated from the labor-share question: Autor and Kausik show automation can raise wages while cutting labor share, and Autor reframed the risk as devaluation of expertise. On the ground, NY Fed postings data find no distinct AI-driven demand decline — while Smith documents the skill premium compressing inside software.", "items": [{"kind": "paper", "title": "Resolving the Automation Paradox: Falling Labor Share, Rising Wages", "author": "Autor & Kausik", "venue": "MIT Economics", "date": "2026-01-13", "url": "https://economics.mit.edu/sites/default/files/2026-03/Resolving%20the%20Automation%20Paradox%20-%20Falling%20Labor%20Share%2C%20Rising%20Wages.pdf", "note": "Model plus twelve-country data: automation can raise wages while reducing labor's share — the two questions come apart.", "quote": "When labor share exceeds this wage-maximizing level, further automation increases wages even while reducing labor's output share."}, {"kind": "interview", "title": "How Is AI Shaping the Future of Work?", "author": "David Autor", "venue": "Issues in Science and Technology", "date": "2026-01-13", "url": "https://issues.org/david-autor-economist-ai-future-work/", "note": "The main risk is falling returns to accumulated expertise, not job scarcity; proposes wage insurance and universal basic capital.", "quote": "The concern is about devaluation of expertise"}, {"kind": "post", "title": "Do Job Postings Show Early Labor-Market Effects of AI?", "author": "Audoly, Guerin & Topa", "venue": "NY Fed, Liberty Street Economics", "date": "2026-05-14", "url": "https://libertystreeteconomics.newyorkfed.org/2026/05/do-job-postings-show-early-labor-market-effects-of-ai/", "note": "Lightcast postings against exposure scores: declines predate ChatGPT; no junior-senior divergence.", "quote": "The evidence from job postings provides little indication of a distinct AI-driven decline in labor demand."}, {"kind": "post", "title": "The Fall of the Nerds", "author": "Noah Smith", "venue": "Noahpinion", "date": "2026-02-05", "url": "https://www.noahpinion.blog/p/the-fall-of-the-nerds", "note": "AI coding tools compress the software skill premium the way power loo  "venue": "World Bank", "date": "2025-12", "url": "https://thedocs.worldbank.org/en/doc/1e4e52502104a331fb42cba0d4afa995-0050062026/original/WDR2026-Concept-Note.pdf", "note": "The flagship report framed around whether AI closes expertise gaps or erodes the services-export path.", "quote": "Predictive and generative AI might dampen prospects of developing countries exporting back-office services."}, {"kind": "report", "title": "Bridging Skill Gaps for the Future: New Jobs Creation in the AI Age", "author": "Jaumotte, Kim, Koll et al.", "venue": "IMF Staff Discussion Note", "date": "2026-01", "url": "https://www.imf.org/-/media/files/publications/sdn/2026/english/sdnea2026001.pdf", "note": "Emerging markets generate new-skill demand at about half the advanced-economy rate, with 8–9 month adoption lags."}, {"kind": "essay", "title": "Why Africa should sequence, not rush into AI", "author": "Mark-Alexandre Doumba", "venue": "Brookings", "date": "2026-02-10", "url": "https://www.brookings.edu/articles/why-africa-should-sequence-not-rush-into-ai/", "note": "Gabon's digital economy minister: premature automation parallels premature deindustrialization; sequence data governance and infrastructure first.", "quote": "The greatest risk is not missing the AI revolution, but joining it too early."}, {"kind": "report", "title": "Global Economic and Financial Implications of AI: Scenario Planning", "author": "Barhoumi, de Carvalho et al.", "venue": "IMF Notes", "date": "2026-04", "url": "https://www.imf.org/-/media/files/publications/imf-notes/2026/english/insea2026002.pdf", "note": "Scenario exercise: capital outflows from developing economies and reshoring erode export-led growth models.", "quote": "Cross-country inequalities widen as advanced economies capture a disproportionate share of AI-related gains."}], "ledger": [], "window": "December 2025–August 2026"}, "3.5.3": {"tier": "medium", "reviewed": "August 3, 2026", "moved": "The mechanisms went from thought experiment to l t-driven market design. Masley's forensic work on the viral water numbers cuts the other way.", "items": [{"kind": "post", "title": "Are AI Datacenters Increasing Electric Bills for American Households?", "author": "Mahesh, Eliahou Ontiveros, Pandey et al.", "venue": "SemiAnalysis", "date": "2026-03-03", "url": "https://newsletter.semianalysis.com/p/are-ai-datacenters-increasing-electric", "note": "PJM's 9.3× capacity-price jump traces largely to forecast-driven market design; ERCOT absorbed similar growth with 11–17% rises."}, {"kind": "report", "title": "Data Center Watch Report: Q1 2026", "author": "Data Center Watch", "venue": "datacenterwatch.org", "date": "2026-06", "url": "https://www.datacenterwatch.org/q1-2026", "note": "Community opposition doubled to 833 groups across 49 states; 300+ state bills in six weeks.", "quote": "At least 75 data center projects worth approximately $130 billion were blocked or delayed in a single quarter."}, {"kind": "report", "title": "A Speed-for-Security Bargain for AI Data Centers", "author": "Ben Schifman", "venue": "Institute for Progress", "date": "2026-06-04", "url": "https://ifp.org/speed-for-security-bargain-for-ai-data-centers/", "note": "Expedited grid interconnection for large loads conditional on binding cybersecurity hardening."}, {"kind": "post", "title": "How the 'bottle of water per prompt' miscalculation happened", "author": "Andy Masley", "venue": "The Weird Turn Pro", "date": "2026-05-25", "url": "https://blog.andymasley.com/p/i-might-have-found-the-specific-way", "note": "Forensic reconstruction of the viral 500mL-per-prompt figure: stacked errors inflating per-prompt water use ~50–250×."}, {"kind": "post", "title": "Bernie Sanders has a plan to stop the AI industry", "author": "Kai Williams", "venue": "Understanding AI", "date": "2026-04-06", "url": "https://www.understandingai.org/p/bernie-sanders-has-a-plan-to-stop", "note": "The conditional data-center construction ban, and whether safety advocates, local y and redistributive policy make it a distribution problem, not a collapse."}, {"kind": "report", "title": "BIS Annual Economic Report 2026: Progress and peril", "author": "Bank for International Settlements", "venue": "BIS", "date": "2026-06-28", "url": "https://www.bis.org/publ/arpdf/ar2026e1.htm", "note": "Official assessment: $1T+ hyperscaler capex, opaque circular financing, and interconnected exposures could produce a financing pullback and investment bust.", "quote": "The intense competition raises the risk of firms over-committing resources to investment projects with still uncertain returns."}, {"kind": "report", "title": "Monitoring Adoption of AI and Related Vulnerabilities in the Financial Sector", "author": "Financial Stability Board", "venue": "FSB", "date": "2025-10-10", "url": "https://www.fsb.org/2025/10/monitoring-adoption-of-artificial-intelligence-and-related-vulnerabilities-in-the-financial-sector/", "note": "First cross-jurisdiction monitoring framework: third-party concentration, correlation from common models, supervisory data gaps."}, {"kind": "post", "title": "AI Set to be Largest CapEx Cycle Ever … and Soon Majority Externally Financed", "author": "Paul Kedrosky", "venue": "paulkedrosky.com", "date": "2026-06-16", "url": "https://paulkedrosky.com/ai-set-to-be-largest-capex-cycle-ever-and-soon-majority-externally-financed/", "note": "~$1.5T annual AI infrastructure spend by 2030, ~90% externally financed — dependent on credit markets and vulnerable to spread widening.", "quote": "it will surpass, in real terms, the residential construction boom of 2005-06, the 1990s fiber build peak year, and the 1882 railroad peak combined."}, {"kind": "post", "title": "It still doesn't look like there's an AI bubble", "author": "Timothy B. Lee", "venue": "Understanding AI", "date": "2026-03-16", "url": "https://www.understandingai.org/p/it-still-doesnt-look-like-theres", "note": "The revenue counter-case: Anthropic's annualized revenue doubling from $9B to $19B between late 2025 and March 2026."}, {"kind": "essay", "title": "Why did South Korean stocks just crash?", "author": "Noah Smith", "venue": "Noahpinion", "date": "2026-07-30", "url": "https://www.noahpinion.blog/p/why-did-south-korean-stocks-just", "note": "Case study: chip earnings, leveraged retail ETFs, and the gap between required and actual AI revenue."}], "ledger": [{"kind": "essay", "title": "The Citrini post is just a scary bedtime story", "author": "Noah Smith", "venue": "Noahpinion", "date": "2026-02-24", "url": "https://www.noahpinion.blog/p/the-citrini-post-is-just-a-scary", "note": "Separates plausible micro disruption from macro crash claims."}, {"kind": "post", "title": "Chart of the Day: AI Capex, From Bonanza to Burden", "author": "Paul Kedrosky", "venue": "paulkedrosky.com", "date": "2026-02-06", "url": "https://paulkedrosky.com/chart-of-the-day-ai-capex-from-bonanza-to-burden/", "note": "The market's valuation multiple on announced AI capex turned negative."}, {"kind": "post", "title": "The Market Doesn't Sell Off on Excessive-Capex Concerns at the Top", "author": "Byrne Hobart", "venue": "The Diff", "date": "2026-07-24", "url": "https://www.thediff.co/archive/the-market-doesnt-sell-off-on-excessive-capex-concerns-at-the-top/", "note": "Historical capex cycles: markets do not peak on excessive-spending worries (paywalled)."}], "window": "October 2025–August 2026"}, "1.1.2": {"tier": "medium", "moved": "Epoch spent the spring decomposing where progress actually comes from: software progress may be worth 10x effective compute a year — with data quality, not algorithmic cleverness, plausibly the largest and least measured contributor — final training runs turn out to be a minority of lab R&D compute, and RL environments are emerging as the input that wastes compute when it's missing. A caveat the reader should carry: nearly everything measured here is measured by one shop.", "items": [{"kind": "essay", "title": "The least understood driver of AI progress", "author": "Anson Ho", "venue": "Epoch AI Gradient Updates", "date": "2026-02-25", "url": "https://epoch.ai/gradient-updates/the-least-understood-driver-of-ai-progress", "quote": "Almost all the evidence points to very fast software progress: each year, the training compute needed to get to the same capability declines several times — possibly even ten times or more.", "note": "Epoch's synthesis of what is known about software progress, with data quality improvements plausibly the largest and least measured contributor — a direct update to the compute-vs-algorithms decomposition, and a complication for software-explosion models (1.5.2)."}, {"kind": "essay", "title": "An FAQ on Reinforcement Learning Environments", "author": "Jean-Stanislas Denain & Chris Barber", "venue": "Epoch AI Gradient Updates", "date": "2026-01-12", "url": "https://epoch.ai/gradient-updates/state-of-rl-envs", "quote": "Without diverse, high-quality environments and tasks to train on, throwing more compute at RL risks wasting much of it.", "note": "A grounded survey of the RL-environments supply chain — who builds them, what they cost, and why environment quality rather than raw compute is emerging as the bottleneck for RL-driven progress."}, {"kind": "essay", "title": "Final training runs account for a minority of R&D compute spending", "author": "Jean-Stanislas Denain & Cheryl Wu", "venue": "Epoch AI Gradient Updates", "date": "2026-03-23", "url": "https://epoch.ai/gradient-updates/r-and-d-vs-training-compute", "quote": "if most of the spending is exploration rather than execution, then a competitor who learns what works from the frontier could replicate the results for a fraction of the original cost.", "note": "Final training runs are only ~10–23% of lab R&D compute — experimentation, synthetic data generation, and failed runs are where the compute input actually goes, with implications for fast-follower competition."}, {"kind": "essay", "title": "Keeping up with the GPTs", "author": "Anson Ho", "venue": "Epoch AI Gradient Updates", "date": "2026-04-07", "url": "https://epoch.ai/gradient-updates/keeping-up-with-the-gpts", "quote": "I think compute-poor labs probably can't fully make up for their 10x compute disadvantage to compete at the frontier.", "note": "Whether algorithmic innovation, replication, or distillation can substitute for compute: only distillation meaningfully narrows the gap — a direct answer to which input dominates and who can compete."}], "ledger": [{"title": "How persistent is the inference cost burden?", "author": "Jean-Stanislas Denain", "venue": "Epoch AI Gradient Updates", "date": "2026-02-16", "url": "https://epoch.ai/gradient-updates/how-persistent-is-the-inference-cost-burden"}], "reviewed": "August 3, 2026", "window": "January–August 2026"}, "1.1.3": {"tier": "slow", "moved": "The synthetic-data question moved from theory to measurement: the most systematic study to date finds rephrased synthetic data mixed with web text speeds pretraining 5–10x while purely generated 'textbook' data reproduces model collapse — and a run of theory papers converges on the same condition: self-play and synthetic loops keep working only while a verifier or pipeline injects genuinely new information.", "items": [{"kind": "paper", "title": "Demystifying Synthetic Data in LLM Pre-training", "author": "Kang, Ardalani, Kuchnik et al.", "venue": "arXiv", "date": "2025-10-02", "url": "https://arxiv.org/abs/2510.01631", "quote": "Pre-training on rephrased synthetic data alone is not faster than pre-training on natural web texts; while pre-training on 1/3 rephrased synthetic data mixed with 2/3 natural web texts can speed up 5-10x.", "note": "The most systematic empirical study to date (1000+ models trained, from Meta researchers) of when synthetic pretraining data helps — and when it reproduces model-collapse patterns."}, {"kind": "paper", "title": "Escaping Model Collapse via Synthetic Data Verification", "author": "Yi, Liu, Cheng & Xu"
