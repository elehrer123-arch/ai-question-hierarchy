l": "https://palisaderesearch.org/blog/four-corners-loss-of-control", "quote": "We will just be at their mercy. If they decide to treat us well, then that might go very well for us. If they decide to treat us poorly, that will go very poorly for us.", "note": "A mainstream-TV articulation of the loss-of-control argument, stressing that absent governance humanity's fate becomes contingent on AI disposition — a signal of the debate reaching a general audience."}], "ledger": [], "reviewed": "August 3, 2026", "window": "April–August 2026"}, "4.1.1": {"tier": "medium", "moved": "The United States began answering the question in drafts: the bipartisan Great American AI Act would attach rules to large frontier developers — an authorized standards center, third-party verifiers, SB 53-style transparency — in exchange for preemption, and the state laws it would preempt already converge on the same object: developers defined by compute-plus-revenue triggers. The counterargument gained precision too: rules attached to models or weights don't survive replication, so regulate use at deployment choke points.", "items": [{"kind": "news", "title": "The best AI bill yet may not get far", "author": "Shakeel Hashim, Veronica Irwin & Celia Ford", "venue": "Transformer", "date": "2026-06-05", "url": "https://www.transformernews.ai/p/the-best-ai-bill-yet-may-not-get-obernolte-trahan-gaaia", "quote": "At 269 pages, GAAIA contains plenty of excellent stuff. It would formally authorize the Center for AI Standards and Innovation with a $100m annual budget.", "note": "The definitive early read on the bipartisan Great American AI Act — the first serious federal answer to the regulatory-object question: attach rules to frontier developers via an authorized CAISI, third-party verification organizations, and SB 53-style transparency, traded against preemption."}, {"kind": "essay", "title": "Frontier AI Goes Federal: How the Great American AI Act Compares to State Laws", "author": "Justine Gluck", "venue": "Future of Privacy Forum", "date": "2026-06-09", "url": "https://fpf.org/blog/frontier-ai-goes-federal-how-the-great-american-ai-act-compares-to-state-laws/", "quote": "The draft's frontier model provisions are not starting from scratch. They closely track the framework emerging from California's SB 53, New York's RAISE Act, and Illinois' SB 315.", "note": "Side-by-side of the federal draft against SB 53, RAISE, and Illinois SB 315, showing a de facto US regulatory object — large frontier developers defined by compute-plus-revenue triggers — crystallizing from state templates."}, {"kind": "essay", "title": "OpenAI Offers A New Policy Blueprint", "author": "Zvi Mowshowitz", "venue": "Don't Worry About the Vase", "date": "2026-06-05", "url": "https://thezvi.substack.com/p/openai-offers-a-new-policy-blueprint", "quote": "Implementation details matter a lot, but this document exceeds expectations a lot.", "note": "Close reading of OpenAI's federal policy blueprint — developer-level obligations overseen by CAISI in exchange for preemption — arguing it could be the 'minimum viable deal' on what rules attach to, while flagging the accountability gaps such a bargain must close."}, {"kind": "essay", "title": "Don't Regulate AI Models. Regulate AI Use", "author": "John deVadoss", "venue": "IEEE Spectrum", "date": "2026-02-02", "url": "https://spectrum.ieee.org/ai-model-regulation", "quote": "Model weights and code are digital artifacts; once released, by a lab, a leak, or a foreign competitor, they replicate at near-zero cost.", "note": "A clean statement of the use-based position: model- and weights-attached rules are unenforceable once artifacts replicate, so regulation should bind at deployment choke points — the application-layer answer the framing warns misses the frontier."}, {"kind": "essay", "title": "Where State AI Legislation Stands Half Way Into 2026", "author": "Scott Babwah Brennen", "venue": "TechPolicy.Press", "date": "2026-07-06", "url": "https://www.techpolicy.press/where-state-ai-legislation-stands-half-way-into-2026/", "quote": "more than half of US states have together enacted more than 100 new AI laws this term", "note": "The best mid-2026 empirical map of what US states actually attach rules to — companion chatbots, data centers, insurance, dynamic pricing — showing application-layer objects dominating state practice even as frontier-developer frameworks spread."}], "ledger": [], "reviewed": "August 3, 2026", "window": "February–August 2026"}, "4.1.2": {"tier": "slow", "moved": "The thresholds that exist got graded: SaferAI's systematic scoring of twelve company safety frameworks finds capability thresholds defined in vague terms with almost no quantitative criteria, scores topping out at 34%. The constructive work has begun — a first methodology for deriving harmonized cross-lab thresholds from expected-harm modeling.", "items": [{"kind": "paper", "title": "Evaluating AI Providers' Frontier Safety Frameworks", "author": "Stelling, Murray, Galizzi, Schaffelder, Campos & Papadatos", "venue": "arXiv (SaferAI)", "date": "2025-12-01", "url": "https://arxiv.org/abs/2512.01166", "quote": "Overall scores range from 34% (Anthropic) to 8% (Cohere), with a median of 18%.", "note": "The most systematic grading yet of the twelve company safety frameworks that function as de facto capability thresholds: thresholds defined in vague terms ('severe harm', 'meaningful uplift') with almost no quantitative criteria or risk modeling linking them to residual-risk tolerances."}, {"kind": "report", "title": "Common Elements of Frontier AI Safety Policies (December 2025 Update)", "author": "METR", "venue": "METR", "date": "2025-12-09", "url": "https://metr.org/blog/2025-12-09-common-elements-of-frontier-ai-safety-policies/", "quote": "The policies also outline commitments to conduct model evaluations assessing whether models are approaching capability thresholds that could enable severe or catastrophic harm.", "note": "The reference cross-company survey of which capability thresholds — bio, cyber, autonomous replication, automated AI R&D — currently trigger evaluation, security, and deployment commitments across the industry."}, {"kind": "paper", "title": "Harmonizing AI Safety Thresholds", "author": "Anterola, Ball, Lafuerza & Grey", "venue": "arXiv", "date": "2026-07-17", "url": "https://arxiv.org/abs/2607.16112", "quote": "We develop a methodology for deriving harmonized thresholds across three risk domains.", "note": "First serious methodology for deriving consistent cross-lab capability thresholds — expected-harm risk modeling for cyber and bio misuse, rate-of-progress triggers for automated AI R&D — answering the critique that current thresholds are ad hoc and incommensurable."}], "ledger": [], "reviewed": "August 3, 2026", "window": "December 2025–August 2026"}, "4.1.3": {"tier": "medium", "moved": "The US acquired a de facto ex-ante regime without legislating one: the June executive order's 30-day 'voluntary' pre-release security review is, on Zvi's reading, mandatory licensing in all but name. The scholarship sharpened on both sides — Ramakrishnan shows tort liability can perversely deter developers from investigating and disclosing novel risks, concluding ex-ante oversight is needed, while Weil extends his strict-liability case through abnormally-dangerous-activity doctrine.", "items": [{"kind": "paper", "title": "Tort Law at the Frontier of Artificial Intelligence", "author": "Ketan Ramakrishnan", "venue": "SSRN", "date": "2026-06", "url": "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6979919", "quote": "it is largely the common law of torts - our society's most ancient and general legal mechanism for governing serious risks of physical injury - that will govern the frontier of AI development.", "note": "Major scholarly treatment of tort as the default frontier-AI governor: defends negligence doctrine's flexibility but shows liability can perversely deter developers from investigating and disclosing novel risks — concluding ex ante regulatory oversight is urgently needed."}, {"kind": "paper", "title": "Abnormally Dangerous Algorithms: The Case for Strict Liability at the AI Frontier", "author": "Gabriel Weil", "venue": "SSRN", "date": "2026-04-20", "url": "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6588958", "quote": "many serious AI harms arise from residual, hard-to-eliminate risks rather than from readily provable negligence.", "note": "Weil's most developed statement since his canonical tort paper: severe third-party harms from misaligned agentic AI warrant strict liability, via abnormally-dangerous-activity doctrine or adapted vicarious liability."}, {"kind": "essay", "title": "Trump Signs Executive Order For AI Testing Prior To Frontier Model Releases", "author": "Zvi Mowshowitz", "venue": "Don't Worry About the Vase", "date": "2026-06-03", "url": "https://thezvi.substack.com/p/trump-signs-executive-order-for-ai", "quote": "Make no mistake. This is a de facto mandatory governmental licensing, preclearance and permitting requirement.", "note": "The sharpest analysis of the June executive order's 30-day 'voluntary' pre-release security review: the US has slid into ex ante approval for frontier models without legislation or the word 'licensing' — with the discretion and abuse risks that implies."}, {"kind": "news", "title": "Is OpenAI changing its tune on AI laws?", "author": "Shakeel Hashim & Celia Ford", "venue": "Transformer", "date": "2026-05-15", "url": "https://www.transformernews.ai/p/is-openai-changing-its-tune-on-ai-laws-illinois-regulation", "quote": "We want to be very clear: we do not support the liability safe harbor included in SB 3444.", "note": "Reports the Illinois fight over compliance-based liability safe harbors — the live legislative test of whether ex post liability gets traded away for ex ante compliance regimes."}], "ledger": [{"title": "The Insurability Frontier of AI Risk", "author": "Leung, Zhang, Ling, Toyoda & Loh", "venue": "arXiv", "date": "2026-06-12", "url": "https://arxiv.org/abs/2605.18784"}], "reviewed": "August 3, 2026", "window": "April–August 2026"}, "4.1.4": {"tier": "medium", "moved": "Measured transparency went backwards: the Foundation Model Transparency Index fell 17 points against stiffened criteria, with training data the most opaque domain — reversing the index's earlier finding that naming laggards raised disclosure. A novel constitutional constraint arrived from the other direction: mandatory disclosure of trade secrets may trigger Fifth Amendment takings claims, an argument any disclosure regime now has to design around.", "items": [{"kind": "report", "title": "The Foundation Model Transparency Index (December 2025)", "author": "Wan, Klyman, Kapoor, Maslej, Longpre, Xiong, Liang & Bommasani", "venue": "Stanford CRFM", "date": "2025-12", "url": "https://crfm.stanford.edu/fmti/December-2025", "quote": "Companies score worse this year. The mean score this year is 41: this is a 17 point decrease over the previous year.", "note": "New edition of the canonical index reverses its own earlier finding that naming laggards raised disclosure: measured transparency fell 17 points against stiffened criteria, with training data still the most opaque domain."}, {"kind": "essay", "title": "AI Regulation and the Looming Problem of the Takings Clause", "author": "Micah Musser", "venue": "Lawfare", "date": "2026-06-12", "url": "https://www.lawfaremedia.org/article/ai-regulation-and-the-looming-problem-of-the-takings-clause", "quote": "Regulations that force developers to disclose trade secrets to the public could violate the Constitution.", "note": "Novel constitutional constraint on the transparency agenda: because trade secrets are protected property, mandatory public disclosure of training-data and model details could trigger Fifth Amendment takings claims."}, {"kind": "essay", "title": "What is California's AI safety law?", "author": "Malihe Alikhani & Aidan T. Kane", "venue": "Brookings", "date": "2025-12-23", "url": "https://www.brookings.edu/articles/what-is-californias-ai-safety-law/", "quote": "Each large developer must design, implement, and publicly post a company-wide safety and risk management plan describing how catastrophic risks are identified, assessed, and reduced.", "note": "The reference explainer for SB 53 implementation: how the first binding US frontier-transparency statute converts voluntary safety frameworks into enforceable publication, 15-day incident reporting, and whistleblower duties."}, {"kind": "report", "title": "Requirements for Model Specifications in the EU GPAI Code of Practice", "author": "Alan Chan", "venue": "GovAI", "date": "2026-03-20", "url": "https://www.governance.ai/research-paper/requirements-for-model-specifications-in-the-eu-gpai-code-of-practice", "quote": "The EU GPAI Code of Practice commits Signatories to providing a description of intended model behavior (a 'model spec') in their Model Reports", "note": "Turns the Code of Practice's model-spec commitment into concrete disclosure requirements — publish intended behaviors relevant to systemic risk so the AI Office can audit against them — a template for spec-level transparency mandates."}, {"kind": "report", "title": "AI Safety Index: Winter 2025", "author": "Future of Life Institute", "venue": "Future of Life Institute", "date": "2025-12", "url": "https://futureoflife.org/ai-safety-index-winter-2025/", "quote": "All of the companies reviewed are racing toward AGI/superintelligence without presenting any explicit plans for controlling or aligning such smarter-than-human technology", "note": "Latest external scorecard of company disclosure and risk-management practice (Anthropic and OpenAI at C+, most rivals D or below) — evidence for how far voluntary transparency falls short of what mandatory floors would demand."}], "ledger": [{"title": "Incident reporting and investigation under the AI act: some insights from aviation", "author": "Michael Chatzipanagiotis", "venue": "International Journal of Law and Information Technology", "date": "2026-02-27", "url": "https://academic.oup.com/ijlit/article/doi/10.1093/ijlit/eaaf019/8501132"}, {"title": "\"Be It Enacted\": A Draft Bill for AI Transparency and Federal Preemption", "author": "Dean W. Ball", "venue": "Hyperdimensional", "date": "2025-10-02", "url": "https://www.hyperdimensional.co/p/be-it-enacted"}], "reviewed": "August 3, 2026", "window": "October 2025–August 2026"}, "4.1.5": {"tier": "medium", "moved": "The year ran two live experiments in updating AI law. The EU renegotiated its AI Act deadlines under industry pressure and — on the insider account — kept the changes targeted rather than hollowing it out. The US preemption fight produced its clearest institutional proposals yet: government-certified private verifiers auditing labs against their own frameworks, and a FINRA-style supervised self-regulatory organization designed against capture. Meanwhile the states kept converging bottom-up, the direct counterpoint to the patchwork thesis.", "items": [{"kind": "essay", "title": "What the EU AI Omnibus Deal Changes for the AI Act and What Lies Ahead", "author": "Laura Caroli", "venue": "TechPolicy.Press", "date": "2026-05-08", "url": "https://www.techpolicy.press/what-the-eu-ai-omnibus-deal-changes-for-the-ai-act-and-what-lies-ahead/", "quote": "negotiators managed — just barely, at the finish line — to conclude it quickly enough to replace the August 2, 2026 deadline in time, and to keep the changes relatively targeted.", "note": "Authoritative insider account (Caroli negotiated the AI Act) of the omnibus renegotiation — deadlines deferred, obligations trimmed, core requirements preserved — the central 2026 case study of revising a landmark AI law under industry pressure."}, {"kind": "essay", "title": "The AI Patchwork Emerges", "author": "Dean W. Ball", "venue": "Hyperdimensional", "date": "2026-01-15", "url": "https://www.hyperdimensional.co/p/the-ai-patchwork-emerges", "quote": "You cannot preempt all of these laws piece-by-piece; broad-based preemption of some kind is essential, and anyone who pretends otherwise is simply not engaging with the reality on the ground.", "note": "The strongest statement of the pro-preemption side: documents the accelerating, incoherent state patchwork and argues only broad federal preemption keeps AI rules coherent — the frame the rest of the year's debate responded to."}, {"kind": "essay", "title": "What Should Be Done", "author": "Dean W. Ball", "venue": "Hyperdimensional", "date": "2026-06-26", "url": "https://www.hyperdimensional.co/p/what-should-be-done", "quote": "It would be good for someone to thoroughly audit the frontier labs at least to test their adherence to their own safety plans", "note": "Ball's positive program: government-certified private verification bodies auditing labs against their own safety frameworks — a revival of the regulatory-markets idea, argued as the only oversight design fast and expert enough to track the frontier."}, {"kind": "essay", "title": "Designing a FINRA for Frontier AI", "author": "Mark Thomas", "venue": "Lawfare", "date": "2026-07-30", "url": "https://www.lawfaremedia.org/article/designing-a-finra-for-frontier-ai", "quote": "A supervised self-regulatory organization (SRO), like FINRA, is a private industry body that writes and enforces rules for that industry, under the supervision of a government agency.", "note": "Detailed institutional design for a supervised SRO for frontier AI — mandatory membership, industry funding via compute assessments, majority non-industry board — squarely addressing how rules evolve with the technology while building in anti-capture safeguards."}, {"kind": "essay", "title": "With the RAISE Act, New York Aligns With California on Frontier AI Laws", "author": "Alasdair Phillips-Robins & Scott Singer", "venue": "Carnegie Endowment", "date": "2026-02-05", "url": "https://carnegieendowment.org/emissary/2026/02/ai-state-law-new-york-raise-act-california-sb53", "quote": "Both bills create a core set of transparency requirements, mandating developers to publish frontier AI risk frameworks and report safety incidents to state officials.", "note": "Evidence against the patchwork thesis: New York deliberately converged on California's SB 53 template, suggesting states can harmonize frontier AI rules bottom-up without federal preemption."}], "ledger": [{"title": "Executive Preemption and the Dormant Commerce Clause After Pataki and Paxton", "author": "J.B. Branch", "venue": "Harvard Law Review Blog", "date": "2026-01-15", "url": "https://harvardlawreview.org/blog/2026/01/executive-preemption-and-the-dormant-commerce-clause-after-pataki-and-paxton/"}, {"title": "The campaign to stop federal AI laws is backfiring", "author": "Hashim, Ford & Irwin", "venue": "Transformer", "date": "2026-05-29", "url": "https://www.transformernews.ai/p/the-campaign-to-stop-federal-ai-laws-illinois-sb-315"}, {"title": "Delays to Frontier AI in the EU and UK", "author": "Lidiard, Vereschak, Gibbs & Anderljung", "venue": "GovAI", "date": "2026-06-28", "url": "https://www.governance.ai/research-paper/delays-to-frontier-ai-in-the-eu-and-uk"}, {"title": "Scaling Laws: Can AI Make AI Regulation Cheaper?", "author": "Rozenshtein, O'Keefe & Frazier", "venue": "Lawfare (podcast)", "date": "2026-02-24", "url": "https://www.lawfaremedia.org/article/scaling-laws--can-ai-make-ai-regulation-cheaper---with-cullen-o'keefe-and-kevin-frazier"}], "reviewed": "August 3, 2026", "window": "January–August 2026"}, "4.2.1": {"tier": "medium", "moved": "The capacity question got concrete data points: CAISI now runs classified pre-deployment security testing on models from multiple labs — evaluation capacity actually operating — while a former White House AI staffer's assessment is that Congress and agencies still lack the technical depth, and procurement conditions increasingly substitute for the evaluative capacity agencies don't have.", "items": [{"kind": "news", "title": "Commerce AI center will evaluate Google DeepMind, Microsoft and xAI models", "author": "Alexandra Kelley", "venue": "Nextgov/FCW", "date": "2026-05-05", "url": "https://www.nextgov.com/artificial-intelligence/2026/05/commerce-ai-center-will-evaluate-google-deepmind-microsoft-and-xai-models/413349/", "quote": "The Center for Artificial Intelligence Standards and Innovation will be conducting testing on leading AI models from Google Deepmind, Microsoft and xAI to evaluate their security prior to deployment.", "note": "Documents CAISI expanding pre-deployment national-security testing beyond OpenAI and Anthropic — the clearest 2026 evidence of what US in-house evaluation capacity actually does."}, {"kind": "essay", "title": "Kicking the Tires: A Voluntary Path to Pre-deployment AI Vetting", "author": "Dean W. Ball & Kevin Frazier", "venue": "Lawfare", "date": "2026-05-05", "url": "https://www.lawfaremedia.org/article/kicking-the-tires--a-voluntary-path-to-pre-deployment-ai-vetting", "quote": "The administration lacks authority to mandate frontier model vetting—but existing CAISI and CISA tools enable a voluntary alternative.", "note": "Sketches how the government's existing technical organs could do pre-deployment vetting of frontier models without new statute — a concrete test of whether current state capacity can evaluate systems and challenge industry claims."}, {"kind": "essay", "title": "'Voluntary' Until the Government Is Your Customer", "author": "Jessica Tillipman", "venue": "Lawfare", "date": "2026-06-23", "url": "https://www.lawfaremedia.org/article/voluntary--until-the-government-is-your-customer", "quote": "The government's spending power can turn a voluntary frontier framework into a condition of doing business with the government, without a single statute or regulation stating 'license.'", "note": "Shows procurement — not new regulatory capacity — becoming the government's main lever over frontier labs: contract conditions cascade through the AI supply chain, substituting for the evaluative capacity agencies lack."}, {"kind": "podcast", "title": "Why America isn't ready for the AI revolution", "author": "Dean W. Ball, with Meghna Chakrabarti", "venue": "WBUR On Point", "date": "2026-04-27", "url": "https://www.wbur.org/onpoint/2026/04/27/ai-dean-ball-white-house-tech", "quote": "Congress and the government lacks a lot of the technical chops that you really need to do a great job in the governance of this technology.", "note": "A former White House AI policy staffer's first-hand assessment of the technical-competence gap in Congress and the executive branch."}], "ledger": [{"title": "New Jersey, Virginia Can Lead the Nation By Building 'AI Resilience Cohorts'", "author": "Ariana Soto & Hannah Downing", "venue": "Federation of American Scientists", "date": "2026-07-22", "url": "https://fas.org/publication/nj-va-lead-ai-resilience-state-talent-pipelines/"}, {"title": "One year of AI Accelerator: building Government tech talent", "author": "Ruth A. Panin", "venue": "UK Government Digital Service", "date": "2026-03-31", "url": "https://technology.blog.gov.uk/2026/03/31/one-year-of-the-ai-accelerator-building-government-tech-talent"}], "reviewed": "August 3, 2026", "window": "March–August 2026"}, "4.2.2": {"tier": "medium", "moved": "Adoption ran ahead of governance: 3.4 million federal users can now reach frontier chatbots through GSA's OneGov deals, and the first major ruling held that an agency's chatbot-driven classifications are the government's own act for constitutional purposes — outsourcing a decision to a model does not launder state action. The deeper problem now has a research agenda: automating the executive branch removes the human friction that checks presidential power.", "items": [{"kind": "essay", "title": "A Judicial Wake-Up Call on Government by AI", "author": "Jordan Ascher", "venue": "TechPolicy.Press", "date": "2026-07-02", "url": "https://www.techpolicy.press/a-judicial-wakeup-call-on-government-by-ai/", "quote": "DOGE selected the AI tool, formulated the prompt, and defined the operative viewpoint-based criterion.", "note": "Analyzes the first major ruling holding an agency's chatbot-driven classifications to be 'the Government's own for constitutional purposes' — a landmark for the procedural-safeguard side of the government-AI debate."}, {"kind": "essay", "title": "Executive Branch AI and the Rule of Law: An Emerging Research Agenda", "author": "Cullen O'Keefe, Alan Z. Rozenshtein & Christoph Winter", "venue": "Lawfare", "date": "2026-05-01", "url": "https://www.lawfaremedia.org/article/executive-branch-ai-and-the-rule-of-law--an-emerging-research-agenda", "quote": "Sooner or later, in this administration or a future one, AI will come for the federal workforce.", "note": "Frames the constitutional problem beneath agency AI adoption: automating the executive branch removes the human friction that currently checks presidential power, and proposes rule-of-law safeguards before that happens."}, {"kind": "news", "title": "Nearly 3.4M users across government can use AI through OneGov, GSA official says", "author": "Edward Graham", "venue": "Nextgov/FCW", "date": "2026-05-15", "url": "https://www.nextgov.com/artificial-intelligence/2026/05/nearly-34m-users-across-government-can-leverage-ai-through-onegov-gsa-official-says/413588/", "quote": "More than 120 orders have been placed against OneGov's AI offerings", "note": "The best single measurement of how far frontier chatbots have diffused into the US federal workforce — 3.4 million users — showing adoption running far ahead of governance frameworks."}, {"kind": "essay", "title": "When governments use AI, citizens want it to be accurate, accountable and fair", "author": "Guimin Zheng", "venue": "LSE USAPP", "date": "2026-07-03", "url": "https://blogs.lse.ac.uk/usappblog/2026/07/03/government-ai-accuracy-accountability-fairness/", "quote": "Accuracy mattered more than anything else we tested", "note": "Survey evidence on public preferences over government AI: citizens' tolerance varies sharply by use case, with policing and courts demanding the most accuracy, explainability, and human oversight — empirical grounding for use-case-tiered rules."}], "ledger": [{"title": "AI in Global Majority Judicial Systems", "author": "Ibrahim Sabra", "venue": "Stimson Center", "date": "2026-01-08", "url": "https://www.stimson.org/2026/ai-in-global-majority-judicial-systems/"}, {"title": "Compliance Is Not Protection: Why Federal AI in Benefits Administration Needs Civil Rights Audits", "author": "Albert Nii Noi Okwei", "venue": "PA Times", "date": "2026-06-19", "url": "https://patimes.org/compliance-is-not-protection-why-federal-ai-in-benefits-administration-needs-civil-rights-audits/"}], "reviewed": "August 3, 2026", "window": "January–August 2026"}, "4.2.3": {"tier": "slow", "moved": "Sovereign compute got a price tag and a ceiling: the EU opened tenders for up to seven publicly financed AI gigafactories targeting operation by 2028, while the sharpest analyses argue sovereignty programs cannot insulate against the real dependency — a US ability to switch off allies' access and reach their data — and that full-stack autonomy is unaffordable for most states anyway.", "items": [{"kind": "essay", "title": "The Kill Switch and the Long Arm", "author": "Pablo Chavez", "venue": "Lawfare", "date": "2026-07-09", "url": "https://www.lawfaremedia.org/article/the-kill-switch-and-the-long-arm", "quote": "Washington can't promise allies it will never cut off their access to American AI or reach their data—but it can set, and eventually codify, clear rules for both.", "note": "Sharpens the dependency worry behind sovereign-AI programs: EU sovereignty initiatives cannot fully insulate against US cut-off and data-reach powers — only US self-binding rules can. Reframes what sovereign compute can and cannot buy."}, {"kind": "news", "title": "EU opens call for seven 'gigafactories' to train next-generation AI technologies", "author": "Luca Bertuzzi", "venue": "Euronews", "date": "2026-07-30", "url": "https://www.euronews.com/my-europe/2026/07/30/eu-opens-call-for-seven-gigafactories-to-train-next-generation-ai-technologies", "quote": "The European Commission has launched a call for tenders to publicly finance up to seven AI gigafactories in Europe", "note": "The concrete milestone in Europe's sovereign-compute bet: the formal tender for up to seven publicly financed AI gigafactories targeting mid-2028 — the cost-realism question now has a price tag and a timeline."}, {"kind": "essay", "title": "Rethinking Sovereign AI as Strategy", "author": "Swarnim Shrivastava", "venue": "TechPolicy.Press", "date": "2026-03-03", "url": "https://www.techpolicy.press/rethinking-sovereign-ai-as-strategy/", "quote": "AI sovereignty poses a tougher question: how much control is economically and institutionally feasible?", "note": "The cost-realism counterargument: full-stack AI autonomy is unaffordable for most states, so sovereignty should be reframed as selective control over strategically chosen layers rather than national replication of the frontier."}, {"kind": "essay", "title": "Public AI: Policies for democratic and sustainable AI infrastructures", "author": "Tarkowski, Cañigueral, Sieker & Cominassi", "venue": "OECD.AI", "date": "2025-12-05", "url": "https://oecd.ai/en/wonk/public-ai-policies-for-democratic-and-sustainable-ai-infrastructures", "quote": "Public compute initiatives are the first step, aimed at securing the AI development capacity needed.", "note": "Articulates the public-AI agenda beyond compute subsidies: public compute, datasets, and models as democratic infrastructure rather than entries in a national AI race."}], "ledger": [], "reviewed": "August 3, 2026", "window": "December 2025–August 2026"}, "4.2.4": {"tier": "high", "moved": "A live incident response turned this question from hypothetical to litigated: the government reached for export-control authorities never designed for AI to force frontier models offline worldwide, and Congress answered with the Kill Switch Act — mandated shutdown capability, twenty-million-dollar-a-day fines, and an unsolved open-weights exemption problem. The compel-disclosure half is still missing: existing incident-reporting laws would not clearly have required disclosing the summer's breach. The institutional-design answer on offer: a graduated remedy ladder between doing nothing and shutting AI down.", "items": [{"kind": "essay", "title": "A Kill Switch for Frontier AI", "author": "Alan Z. Rozenshtein", "venue": "Lawfare", "date": "2026-06-15", "url": "https://www.lawfaremedia.org/article/a-kill-switch-for-frontier-ai", "quote": "a global kill switch: Within hours, the company pulled both of its newest and most powerful models for everyone.", "note": "The key legal analysis of the June incident response: the government used export-control authorities never designed for AI to force two frontier models offline worldwide — mid-incident authority currently rests on improvised, untested legal theories."}, {"kind": "essay", "title": "AI #179 Part 2: Hearing The Fire Alarm", "author": "Zvi Mowshowitz", "venue": "Don't Worry About the Vase", "date": "2026-07-31", "url": "https://thezvi.substack.com/p/ai-179-part-2-hearing-the-fire-alarm", "quote": "Open weight models, very obviously, cannot have a kill switch. Open models are effectively getting special treatment by virtue of being inherently unsafe in this way.", "note": "The fullest analytic walkthrough of the Lieu–Moran AI Kill Switch Act and the surrounding discourse: shutdown-capability mandates, the affordability of the $20M/day fine, and the open-weights exemption problem."}, {"kind": "essay", "title": "America Needs an Off-Ramp Between Doing Nothing and Shutting AI Down", "author": "Martijn Rasser", "venue": "War on the Rocks", "date": "2026-07-23", "url": "https://warontherocks.com/cogs-of-war/america-needs-an-off-ramp-between-doing-nothing-and-shutting-ai-down/", "quote": "An independent AI security agency — armed with real legal authority, designed against capture, and resourced for its mission — would make American AI governance a competitive advantage.", "note": "Argues the June incident exposed a binary choice between inaction and global shutdown, and proposes a graduated remedy ladder run by an independent AI security agency — the clearest institutional design for proportionate emergency powers."}, {"kind": "essay", "title": "When Reporting an AI Security Incident Is Not Mandatory", "author": "Mackenzie Arnold & Stephan Llerena", "venue": "Lawfare", "date": "2026-07-24", "url": "https://www.lawfaremedia.org/article/when-reporting-an-ai-security-incident-is-not-mandatory", "quote": "it is unclear that these existing state laws cover this event. At the very least, it won't cover all events like it.", "note": "Shows the compel-disclosure half of emergency authority is missing: existing incident-reporting laws would not clearly have required disclosure of the Hugging Face breach, with thresholds like 50 deaths before obligations trigger."}, {"kind": "news", "title": "New AI Executive Order Calls for Frontier Model Security, Early Government Access and AI-Enabled Cyber Defense", "author": "Skadden, Arps, Slate, Meagher & Flom", "venue": "Skadden Insights", "date": "2026-06-09", "url": "https://www.skadden.com/insights/publications/2026/06/new-ai-executive-order", "quote": "design a voluntary framework for engagement with developers of frontier AI models before broader release", "note": "Legal analysis of the June executive order that builds pre-incident emergency architecture: classified cyber benchmarking to designate 'covered frontier models' and up to 30 days of pre-release government access."}], "ledger": [{"title": "'AI Kill Switch Act' Won't Stop Rogue AI, but It Will Slow Down Innovation", "author": "Reem Ibrahim", "venue": "Reason", "date": "2026-07-27", "url": "https://reason.com/2026/07/27/ai-kill-switch-act-wont-stop-rogue-ai-but-it-will-slow-down-innovation/"}, {"title": "What is the AI Kill Switch Act proposed in the US and how will it work?", "author": "Caolán Magee", "venue": "Al Jazeera", "date": "2026-07-26", "url": "https://www.aljazeera.com/news/2026/7/26/what-is-the-ai-kill-switch-act-proposed-in-the-us-and-how-will-it-work"}], "reviewed": "August 3, 2026", "window": "June–August 2026"}, "4.3.1": {"tier": "medium", "moved": "The race narrative itself came under scrutiny: a scholarly analysis of eight years of policy documents finds the AGI-race framing lacks evidentiary support on the Chinese side and functions as self-fulfilling prophecy, and reporting documents how labs instrumentalized China framing to win deregulation. The experimental result cuts deepest: falling behind — not individual risk appetite — drives unsafe development choices, implying structural fixes rather than actor-level norms. The constructive proposal is 'safety in parallel': each side hardening its own practices, with channels between them.", "items": [{"kind": "essay", "title": "A Path Forward on AI Safety for the United States and China", "author": "Matt Sheehan", "venue": "Carnegie Endowment", "date": "2026-07-23", "url": "https://carnegieendowment.org/emissary/2026/07/ai-safety-parallel-us-china", "quote": "AI safety in parallel means creating touchpoints and information channels between the United States and China that strengthen the safety capabilities of each side.", "note": "Proposes 'AI safety in parallel' — each side hardening its own safety practices with information channels between them — as the realistic way to blunt race-driven corner-cutting when binding US-China agreements are out of reach."}, {"kind": "paper", "title": "The Most Dangerous Fiction: The Rhetoric and Reality of the AI Race", "author": "Seán S. ÓhÉigeartaigh", "venue": "Springer", "date": "2026-05-18", "url": "https://link.springer.com/chapter/10.1007/978-3-032-11814-1_3", "quote": "Are the USA and China locked in a race to artificial general intelligence (AGI) and global strategic dominance?", "note": "Scholarly analysis of 2017–2025 policy documents arguing the AGI-race narrative lacks evidentiary support on the Chinese side and functions as a self-fulfilling prophecy used to justify accelerated development and reduced oversight."}, {"kind": "news", "title": "How Silicon Valley sold Washington an AI race", "author": "Yi-Ling Liu", "venue": "Transformer", "date": "2026-05-08", "url": "https://www.transformernews.ai/p/us-china-ai-race-narrative-lobbying-openai-biden-trump", "quote": "There's an open secret in DC: attach the word China to anything and you can get it done", "note": "Reported essay on how US labs and investors instrumentalized the China-race framing to win deregulation, export policy, and military contracts — the manufactured side of race dynamics, and how it forecloses cooperation."}, {"kind": "paper", "title": "Falling Behind Drives Unsafe Development in an Idealised AI Race Experiment", "author": "Elias Fernández Domingos & The Anh Han", "venue": "arXiv", "date": "2026-07-28", "url": "https://arxiv.org/abs/2607.26034", "quote": "being ahead reduces Unsafe play while falling behind increases it", "note": "Experimental test of the Racing to the Precipice logic: relative position, not individual risk appetite, drives unsafe development choices — implying structural interventions on competitive pressure rather than actor-level risk norms."}, {"kind": "essay", "title": "Chinese Audiences Are Reading Western AI Safety Discourse", "author": "Calvin Duff", "venue": "AI Frontiers", "date": "2026-05-18", "url": "https://newsletter.ai-frontiers.org/p/chinese-audiences-are-reading-western", "quote": "Chinese tech commentators are reading Western AI safety essays, taking them seriously, and engaging with their ideas on the merits.", "note": "Evidence that Western safety arguments get serious engagement in Chinese tech media — a datapoint against strong-form race pessimism about safety ideas failing to cross the divide."}], "ledger": [], "reviewed": "August 3, 2026", "window": "May–August 2026"}, "4.3.2": {"tier": "medium", "moved": "The mid-year Chinese-model panic met its measurements: Kimi K3 is very good and below the frontier, and Epoch's index puts the Chinese lag at four to fourteen months. The sharper analyses argue the two countries are running different races — frontier capability versus deployment and diffusion — with China's open-weight strategy creating feedback loops that compute-focused controls don't reach, and electricity the input where China structurally leads.", "items": [{"kind": "news", "title": "Kimi K3 is no reason for China panic", "author": "Hashim, Irwin & Ford", "venue": "Transformer", "date": "2026-07-17", "url": "https://www.transformernews.ai/p/kimi-k3-is-no-reason-for-china-panic-export-controls-xi-jingping", "quote": "While Kimi K3 is certainly a very good model, by the company's own admission, it is not at the frontier.", "note": "Sober read of the mid-2026 Chinese-model-quality panic: K3 is below the frontier, open-weighting it is rational for a lagging country, and China's incentives will converge with America's once its models get genuinely dangerous."}, {"kind": "report", "title": "Chinese AI models have lagged the US frontier by 7 months on average since 2023", "author": "Luke Emberson", "venue": "Epoch AI", "date": "2026-01-02", "url": "https://epoch.ai/data-insights/us-vs-china-eci", "quote": "Since 2023, every model at the frontier of AI capabilities, as measured by the Epoch Capabilities Index, has been developed in the United States.", "note": "The measurement people cite for the US-China model-quality gap: a 4–14 month Chinese lag on the Epoch Capabilities Index, roughly mirroring the open-vs-closed gap."}, {"kind": "report", "title": "Two Loops: How China's Open AI Strategy Reinforces Its Industrial Dominance", "author": "Ngor Luong", "venue": "US-China Economic and Security Review Commission", "date": "2026-03-23", "url": "https://www.uscc.gov/sites/default/files/2026-03/Two_Loops--How_Chinas_Open_AI_Strategy_Reinforces_Its_Industrial_Dominance.pdf", "quote": "If the models that matter most for industrial AI are small, specialized, and open, the current U.S. policy framework could be targeting the wrong layer of the competition.", "note": "A US government commission working paper identifying two compounding feedback loops — open-weight ecosystem diffusion and industrial deployment data — that give China advantages largely outside the reach of compute-focused export controls. Also central to the open-weights fight on 4.5.1."}, {"kind": "report", "title": "Misdiagnosing the U.S.–China AI Race", "author": "Alvin W. Graylin", "venue": "Asia Society Center for China Analysis", "date": "2026-05-01", "url": "https://centerforchinaanalysis.asiasociety.org/p/misdiagnosing-the-uschina-ai-race", "quote": "When the commodity is cheap and abundant, strategic advantage shifts from who builds the best model to who deploys AI most effectively.", "note": "Diffusion-first argument applied to 2026: the US races for frontier capability while China competes on deployment across industry and the Global South — under which lens export-control denial looks counterproductive."}, {"kind": "podcast", "title": "China's Mythos Moment", "author": "Jordan Schneider & Phoebe Chow", "venue": "ChinaTalk", "date": "2026-07-16", "url": "https://www.chinatalk.media/p/chinas-mythos-moment", "quote": "A Chinese Mythos-level model is inevitable and only months off.", "note": "Analysis of how Beijing would manage a frontier-level Chinese model, arguing the CAC's pre-deployment testing regime gives China a more orderly playbook than America's improvised response."}, {"kind": "essay", "title": "How will the United States and China power the AI race?", "author": "Kyle Chan, Samantha Gross, Liza Tobin & David G. Victor", "venue": "Brookings", "date": "2026-01-08", "url": "https://www.brookings.edu/articles/how-will-the-united-states-and-china-power-the-ai-race/", "quote": "This growth in energy demand for AI is unlikely to be a constraint for China, given the country's historically rapid pace of overall energy expansion.", "note": "The 'electron gap' argument: electricity is the input where China structurally leads even while trailing on chips — the reference piece on energy as a decisive competition variable."}], "ledger": [{"title": "DeepSeek Champions China's Bid to Flood the World With Cheap AI", "author": "Saritha Rai & Olivia Poh", "venue": "Bloomberg", "date": "2026-07-16", "url": "https://finance.yahoo.com/technology/ai/articles/deepseek-champions-china-bid-flood-003610561.html"}, {"title": "Red Lines: Understanding the National Security Risks of China's Advanced AI", "author": "Daniel Remler", "venue": "CNAS", "date": "2026-06-12", "url": "https://www.cnas.org/publications/reports/red-lines"}, {"title": "Kimi and Xi", "author": "Schneider, Zakaria, Zhang & Ottinger", "venue": "ChinaTalk", "date": "2026-07-23", "url": "https://www.chinatalk.media/p/kimi-k3-and-xis-ai-speech"}], "reviewed": "August 3, 2026", "window": "January–August 2026"}, "4.3.4": {"tier": "high", "moved": "The central power fight of 2026: Anthropic was banned from federal use and designated a supply-chain risk for refusing to drop its autonomous-weapons and mass-surveillance restrictions — and OpenAI took the classified-network deal within hours, reportedly keeping the same restrictions Anthropic had sought. A DeepMind insider's resignation account argues individual ethics cannot substitute for binding structure; Ball's analysis grants the government's premise about usage limits and argues the retaliation breaks republican principles anyway.", "items": [{"kind": "news", "title": "OpenAI announces Pentagon deal after Trump bans Anthropic", "author": "Shannon Bond & Geoff Brumfiel", "venue": "NPR", "date": "2026-02-27", "url": "https://www.npr.org/2026/02/27/nx-s1-5729118/trump-anthropic-pentagon-openai-ai-weapons-ban", "quote": "President Trump ordered the U.S. government to stop using the artificial intelligence company Anthropic's products and the Pentagon moved to designate the company a national security risk on Friday, in a sharp escalation of a high-stakes fight over the military's use of AI.", "note": "The definitive news account of the year's central military-AI fight: Anthropic banned and designated a supply-chain risk for refusing to drop autonomous-weapons and mass-surveillance restrictions, while OpenAI took the classified-network deal — reportedly with the same restrictions intact."}, {"kind": "essay", "title": "Clawed", "author": "Dean W. Ball", "venue": "Hyperdimensional", "date": "2026-03-02", "url": "https://www.hyperdimensional.co/p/clawed", "quote": "The Trump Administration has a point: it does not sound right that private corporations can impose limitations on the military's use of technology.", "note": "The sharpest analytical treatment of the clash — grants the government's premise about vendor usage limits while arguing the retaliatory designation breaks republican principles and signals instability to the AI industry."}, {"kind": "essay", "title": "I tried to stop Google DeepMind's Pentagon deal. Then I quit.", "author": "Alex Turner", "venue": "Transformer", "date": "2026-07-21", "url": "https://www.transformernews.ai/p/i-tried-to-stop-google-deepmind-pentagon-deal-then-quit", "quote": "Society cannot rely on ethics-motivated people standing firm. They just don't do it reliably.", "note": "Insider account of DeepMind abandoning its no-weapons pledge for a classified Pentagon contract; argues binding structural mechanisms, not individual ethics, must govern lab-military integration."}, {"kind": "essay", "title": "Anthropic vs. DoW #5: Motions Filed", "author": "Zvi Mowshowitz", "venue": "Don't Worry About the Vase", "date": "2026-03-18", "url": "https://thezvi.substack.com/p/anthropic-vs-dow-5-motions-filed", "quote": "the government is clearly retaliating for protected speech, and this is doing harm to Anthropic", "note": "Part of Zvi's running deep-dive series on the litigation; documents the legal arguments and the surrounding discourse over whether vendors may restrict military uses of their models."}, {"kind": "essay", "title": "AI Will Not Start a Nuclear War, but Humans Might", "author": "Peter W. Singer", "venue": "AI Frontiers", "date": "2026-06-09", "url": "https://ai-frontiers.org/articles/ai-will-not-start-a-nuclear-war-but-humans-might", "quote": "AI is not going to start a nuclear war anytime soon. I do, however, also have bad news: AI is making it more likely that humans will start a nuclear war.", "note": "Redirects the nuclear-AI question from autonomous launch scenarios to the real mechanisms — arms-race insecurity, miscalculation, and AI-compressed decision windows for human leaders."}], "ledger": [{"title": "How the U.S. Military Learned to Embrace AI Warfare", "author": "Jakub Kraus", "venue": "Lawfare", "date": "2026-07-17", "url": "https://www.lawfaremedia.org/article/how-the-u.s.-military-learned-to-embrace-ai-warfare"}, {"title": "UN Members Discuss AI in the Military Domain", "author": "Michael T. Klare", "venue": "Arms Control Today", "date": "2026-07", "url": "https://www.armscontrol.org/act/2026-07/news/un-members-discuss-ai-military-domain"}], "reviewed": "August 3, 2026", "window": "February–August 2026"}, "4.3.5": {"tier": "medium", "moved": "The threat model widened beyond weights: RAND's sequel framework covers algorithmic insights — know-how living in code, documents, and people, which conventional cybersecurity cannot protect — and the distillation literature argues capability can be extracted through model outputs without touching the weights at all, making both export controls and secure-the-weights framings insufficient on their own. Capability theft became official policy terrain, with a White House memorandum and congressional hearings.", "items": [{"kind": "report", "title": "Securing AI Algorithmic Insights", "author": "Brass-Gershovich, Steratore, Hurd, Bradley, Friedman & Nevo", "venue": "RAND", "date": "2026-07-20", "url": "https://www.rand.org/pubs/research_reports/RRA4685-1.html", "quote": "The authors identify 44 attack vectors across nine categories and propose five cumulative insight security levels (ISLs).", "note": "The sequel to RAND's canonical weights-security work: extends the tiered-security framework from weights to algorithmic know-how, which lives in code, documents, and people and so cannot be protected by conventional cybersecurity alone."}, {"kind": "report", "title": "AI Distillation Attacks: The Case for Targeted Government Intervention", "author": "Theo Bearman", "venue": "Institute for AI Policy and Strategy", "date": "2026-03-18", "url": "https://www.iaps.ai/research/ai-distillation-attacks-the-case-for-targeted-government-intervention", "quote": "Detection without credible enforcement is unlikely to alter adversary incentive.", "note": "Frames systematic distillation of US frontier models by Chinese companies as a theft problem labs cannot solve alone, proposing Entity List designations, sanctions, and defensive standards — capability extraction without touching the weights."}, {"kind": "essay", "title": "The Pentagon's AI Edge Is Being Distilled Away", "author": "Sebastian Elbaum", "venue": "War on the Rocks", "date": "2026-06-05", "url": "https://warontherocks.com/cogs-of-war/the-pentagons-ai-edge-is-being-distilled-away/", "quote": "Adversaries do not need to breach the Pentagon's systems: They only need to harvest the logic of the publicly released frontier AI models that underpin them.", "note": "Argues strategic AI capability leaks through model outputs via distillation, making both export controls and secure-the-weights framings insufficient; proposes classified fine-tuning ahead of public release."}], "ledger": [{"title": "AI Distillation Attacks: Executive and Congressional Action Can Go Further", "author": "Theo Bearman", "venue": "Institute for AI Policy and Strategy", "date": "2026-05-12", "url": "https://www.iaps.ai/research/ai-distillation-attacks-executive-and-congressional-action-can-go-further"}, {"title": "China's Illicit Campaign to Steal and Subvert American AI Technology", "author": "Yusuf Mahmood", "venue": "US House Select Committee on the CCP (testimony)", "date": "2026-04-16", "url": "https://docs.house.gov/meetings/ZS/ZS00/20260416/119165/HHRG-119-ZS00-Wstate-MahmoodY-20260416.pdf"}], "reviewed": "August 3, 2026", "window": "March–August 2026"}, "4.4.1": {"tier": "medium", "moved": "The two-year freeze ended: the US and China announced an intergovernmental dialogue on AI safety, and April's IDAIS-London statement shows where rival states' scientists still co-sign — near-term AI cyber capability handing non-state actors state-level attack capacity, with biological misuse close behind. The design question is now which cooperation format survives rivalry: standing information-sharing exchanges rather than arms-control bargaining, even as the one existing military commitment (human control of nuclear decisions) loses definition.", "items": [{"kind": "report", "title": "State of AI Safety in China (2026)", "author": "Concordia AI", "venue": "Concordia AI", "date": "2026-07", "url": "https://concordia-ai.com/research/state-of-ai-safety-in-china-2026/", "quote": "China and the US announced an intergovernmental AI dialogue, ending a two-year freeze in official bilateral engagement on AI safety.", "note": "The definitive annual mapping of China's AI safety ecosystem, documenting the resumed US-China intergovernmental dialogue and China's UN and WAICO moves — the evidence base for which risks Beijing treats as shared."}, {"kind": "report", "title": "IDAIS-London Consensus Statement", "author": "International Dialogues on AI Safety participants", "venue": "IDAIS (Royal Society)", "date": "2026-04", "url": "https://idais.ai/dialogues/", "quote": "Societies remain unprepared for this imminent threat, and biological misuse risks are not far behind.", "note": "The April 2026 track-II dialogue where senior US, Chinese, and other scientists jointly warned that near-term AI cyber capabilities will hand non-state actors state-level attack capacity — the red-line zone where rivals' scientists still co-sign."}, {"kind": "essay", "title": "How the US and China can cooperate to reduce urgent AI risks", "author": "Mark MacCarthy & Carl Schonander", "venue": "Brookings", "date": "2026-07-14", "url": "https://www.brookings.edu/articles/how-the-us-and-china-can-cooperate-to-reduce-urgent-ai-risks/", "quote": "it should be a regular process of sharing information, ideas, plans, and research in the area of AI model risk assessment and mitigation.", "note": "Design proposal for the new bilateral channel: standing technical exchanges on model risk assessment modeled on information-sharing rather than arms-control bargaining — an argument about which cooperation format survives geopolitical rivalry."}, {"kind": "essay", "title": "Military AI governance under strain: the US–China dialogue", "author": "IISS", "venue": "International Institute for Strategic Studies", "date": "2026-06", "url": "https://www.iiss.org/online-analysis/online-analysis/2026/06/military-ai-governance-under-strain-the-uschina-dialogue/", "quote": "the single military-AI commitment that the two powers already share – keeping humans in control of nuclear decisions – loses definition.", "note": "Sober assessment of the military side of the shared-risk zone: the one existing US-China commitment is eroding in meaning just as the broader dialogue opens."}], "ledger": [{"title": "AI Safety in China #23", "author": "Concordia AI", "venue": "AI Safety in China (Substack)", "date": "2025-11-10", "url": "https://aisafetychina.substack.com/p/ai-safety-in-china-23"}], "reviewed": "August 3, 2026", "window": "November 2025–August 2026"}, "4.4.2": {"tier": "slow", "moved": "Verification research produced both its most promising primitive and its sharpest doubt: a zero-knowledge architecture that could let a verifier confirm a training run's compute without seeing weights or data; satellite imagery demonstrated as a national-technical-means layer for corroborating data-center claims — and an analysis showing distributed training could move frontier runs outside the registrable facilities all of this assumes.", "items": [{"kind": "paper", "title": "Zero knowledge verification for frontier AI training is possible", "author": "Pierre Peigné, Ky Nguyen & Paul Wang", "venue": "arXiv", "date": "2026-06-03", "url": "https://arxiv.org/abs/2606.05433", "quote": "enforcement rests on self-reporting because no technical verification primitive for training exists.", "note": "Proposes the missing technical primitive for treaty verification: a zkVM-based architecture combining pre-committed training specs, network observations, and Merkle commitments, letting a verifier confirm a training run's compute without seeing weights or data."}, {"kind": "report", "title": "Tracking Hyperscale AI Data Center Growth with Satellite Imagery", "author": "Christina Krawec", "venue": "Federation of American Scientists", "date": "2026-05-12", "url": "https://fas.org/publication/tracking-hyperscale/", "quote": "serve as one complementary layer to independently verify commitments under future AI-related agreements", "note": "Empirical demonstration that compute's physical footprint is observable from orbit: satellite imagery can independently corroborate data-center build-out claims, adding a national-technical-means layer to layered verification schemes."}, {"kind": "paper", "title": "Does Distributed Training Undermine Compute Governance?", "author": "Robi Rahman", "venue": "arXiv", "date": "2026-05-28", "url": "https://arxiv.org/abs/2605.29359", "quote": "Developers who prefer not to be constrained by regulations may structure their hardware in a manner that evades the registration and monitoring requirements associated with compute governance.", "note": "The strongest recent stress test of datacenter-centric verification: algorithmic advances in distributed training could let frontier runs happen on agglomerated hardware outside registrable facilities, eroding the physical-footprint assumption verification schemes rely on."}, {"kind": "paper", "title": "Hardware-Level Governance of AI Compute: A Feasibility Taxonomy", "author": "Samar Ansari", "venue": "arXiv", "date": "2026-04-06", "url": "https://arxiv.org/abs/2604.04712", "quote": "the hardware-level mechanisms invoked by policy proposals remain largely unexamined from an engineering perspective.", "note": "An engineering reality-check on hardware-enabled governance: taxonomizes 20 on-chip mechanisms by feasibility and finds the ones treaty verification most needs — compute metering, proof-of-training — are the least mature, while the fabrication window to deploy them is closing."}], "ledger": [], "reviewed": "August 3, 2026", "window": "April–August 2026"}, "4.4.3": {"tier": "medium", "moved": "The institutional landscape actually changed: 29 countries signed the treaty establishing the World AI Cooperation Organization in Shanghai — expert readings treat it as China's counterweight to Western-led bodies — while the UN's IPCC-analog scientific panel delivered its first report, warning that by the time evidence is clear it may be too late to act on it. The summit series, meanwhile, reoriented from safety toward diffusion and development at New Delhi.", "items": [{"kind": "essay", "title": "Forum: Xi Jinping Headlines World AI Conference", "author": "Arcesati, Sacks, Schaefer & Costigan", "venue": "DigiChina (Stanford)", "date": "2026-07-23", "url": "https://digichina.stanford.edu/work/forum-xi-jinping-headlines-world-ai-conference/", "quote": "The founding of WAICO represents China's bid to compete with the US on global AI governance", "note": "The best expert analysis of the World AI Cooperation Organization's founding — reading Shanghai's new body as a Chinese counterweight to Western-led institutions and probing whether its developing-world framing can hold."}, {"kind": "report", "title": "Preliminary Report of the Independent International Scientific Panel on AI", "author": "Independent International Scientific Panel on AI", "venue": "United Nations", "date": "2026-07-01", "url": "https://www.un.org/independent-international-scientific-panel-ai/en/preliminary-report", "quote": "policymakers need scientific evidence to effectively govern AI, but by the time the evidence is clear, it may be too late to act on it.", "note": "The first output of the UN's IPCC-analog for AI: an independent scientific assessment delivered to the Global Dialogue, testing whether consensus-assessment institutions can work on AI's timescales."}, {"kind": "essay", "title": "What the UN Global Dialogue on AI Governance Reveals About Global Power Shifts", "author": "Laura Caroli & Matt Mande", "venue": "CSIS", "date": "2025-10-07", "url": "https://www.csis.org/analysis/what-un-global-dialogue-ai-governance-reveals-about-global-power-shifts", "quote": "U.S. disengagement and China's growing assertiveness make the dialogue an important barometer of shifting geopolitical dynamics in AI governance.", "note": "The reference analysis of the UN Global Dialogue's founding politics: with Washington rejecting the process and Beijing embracing it, the dialogue's viability becomes a proxy for who writes global AI rules."}, {"kind": "news", "title": "29 countries sign a treaty to establish the World AI Cooperation Organization", "author": "Alina Maria Stan", "venue": "The Next Web", "date": "2026-07-16", "url": "https://thenextweb.com/news/china-world-ai-cooperation-organization-waico-signed", "quote": "Twenty-nine countries signed an agreement on 16 July to establish the World AI Cooperation Organization (WAICO).", "note": "The factual record of the first new intergovernmental AI organization actually established — 29 signatories, Shanghai headquarters — turning the 'new body vs existing institutions' debate from hypothetical to live."}, {"kind": "essay", "title": "Sovereignty, safety, and scale: Takeaways from the India AI Impact Summit", "author": "Cameron F. Kerry & Elham Tabassi", "venue": "Brookings", "date": "2026-03-12", "url": "https://www.brookings.edu/articles/takeaways-from-the-india-ai-impact-summit/", "quote": "the summit signaled a shift in the global agenda from 'AI safety' as the organizing frame toward diffusion, adoption, and development outcomes.", "note": "Documents the summit series — the de facto institution of AI diplomacy — reorienting from safety to diffusion and development at New Delhi, with implications for what any future formal body would be asked to do."}], "ledger": [], "reviewed": "August 3, 2026", "window": "October 2025–August 2026"}, "4.4.4": {"tier": "slow", "moved": "Mutual recognition now has an institution-building effort behind it: Brundage's AVERI aims to make third-party frontier audits rigorous and universal enough for jurisdictions to recognize each other's assurance — against the warning that marketplace auditing recreates credit-rating-agency incentives and could institutionalize a false floor. China entered the standards contest too, proposing agent-interoperability and mutual-trust standards at WAIC.", "items": [{"kind": "essay", "title": "The Launch of AVERI", "author": "Miles Brundage", "venue": "Miles's Substack", "date": "2026-01-15", "url": "https://milesbrundage.substack.com/p/the-launch-of-averi", "quote": "AVERI is a 501(c)(3), US-based non-profit think tank that is trying to figure out how to make third-party auditing of frontier AI effective and universal.", "note": "Announces the institution-building effort at the center of function gmeta(r){

  const via=r.via?` · <a class="via" href="${esc(r.via.u)}" target="_blank" rel="noopener">via ${esc(r.via.t)}</a>`:'';

}

}

        h+=`<details class="gfound"><summary>More from this sweep (${led2.length})</summary>`+
           `<div class="gim" style="margin:6px 0 4px">Met the relevance bar during the sweep; not selected for the reading list above.</div>`;
        led2.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(l=>{
          h+=`<div class="gcp" style="padding:7px 0"><a class="gct" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title)}</a><div class="gim">${esc(l.author)} · ${esc(l.venue)} · ${fmtD(l.date)}</div></div>`;
        });
        h+=`</details>`;
      }
      if(q.links.length){
        h+=`<details class="gfound"><summary>Foundational reading (${q.links.length})</summary>`;
        q.links.forEach(l=>{h+=`<div class="gcp" style="padding:8px 0"><a class="gct" href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.t)}</a><div class="gim">${esc(l.s)}${l.y?' · '+l.y:''}</div></div>`});
        h+=`</details>`;
      }
      const sibs=su.qs.filter(x=>x.id!==q.id).map(x=>`<a data-go="${x.id}">${x.id} ${esc(x.t)}</a>`).join(' · ');
      if(sibs) h+=`<div class="gnear">Nearby: ${sibs}</div>`;
      h+=`</div>`;
    } else if(!rq) {
      h+=`<div class="links">`;
      q.links.forEach(l=>{h+=`<a href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.t)}<span class="lsrc">${esc(l.s)}${l.y?' · '+l.y:''}</span></a>`});
      h+=`</div>`;
    }
  }
  const i=order.indexOf(k);
  const prev=order[i-1], next=order[i+1];
  h+=`<div class="pn">`;
  if(prev) h+=`<button data-go="${prev}"><small>← Previous</small>${esc(label(prev))}</button>`;
  if(next) h+=`<button class="nx" data-go="${next}"><small>Next →</small>${esc(label(next))}</button>`;
  h+=`</div>`;
  return h;
}
function show(k,push){
  if(!nodes[k]) k='root';
  pin.innerHTML=render(k); ctx.innerHTML=renderCtx(k);
  tree.querySelectorAll('.trow').forEach(r=>{const on=r.dataset.k===k;r.classList.toggle('on',on);
    if(on)r.setAttribute('aria-current','page');else r.removeAttribute('aria-current');});
  // expand path
  let p=row(k)&&row(k).dataset.p;
  const chain=[]; let cur=k;
  while(cur){ chain.unshift(cur); const r=row(cur); cur=r?r.dataset.p:null; }
  chain.forEach(c=>setExp(c,true));
  const r=row(k); if(r) r.scrollIntoView({block:'nearest'});
  document.body.classList.add('detail');
  document.getElementById('page').scrollTop=0;
  if(push!==false) history.replaceState(null,'','#'+(k==='root'?'':k.replaceAll('.','-')));
  const tm=document.getElementById('toMap');
  if(tm){const n2=nodes[k]; tm.href = n2.type==='q' ? '../#q'+k.replaceAll('.','-') : (n2.type==='root'?'../':'../#'+k.replaceAll('.','-'));}
}
pin.addEventListener('click',e=>{const b=e.target.closest('[data-go]'); if(b) show(b.dataset.go)});
document.getElementById('back').addEventListener('click',()=>{document.body.classList.remove('detail')});
/* ---------- context rail ---------- */
const ctx=document.getElementById('ctx');
const REFS_OUT={},REFS_IN={};
order.forEach(k=>{const n=nodes[k]; if(n.type!=='q')return;
  const q=n.q;
  const outs=[...new Set((q.n.match(/[1-5]\.\d{1,2}\.\d{1,2}/g)||[]).filter(x=>x!==k&&nodes[x]))];
  REFS_OUT[k]=outs; outs.forEach(t0=>{(REFS_IN[t0]=REFS_IN[t0]||[]).push(k)});
  });
function ctxLink(k,cur){return `<a data-go="${k}"${k===cur?' class="cur"':''}>${esc(label(k))}</a>`}
function renderCtx(k){
  const n=nodes[k]; if(!n||n.type==='root'||n.type==='sec') return '';
  let h='';
  if(n.type==='sub'){
    h+=`<div class="cxb"><h4>In ${n.s.id} ${esc(n.s.name)}</h4>${n.s.subs.map(su=>ctxLink(su.id,k)).join('')}</div>`;
    return h;
  }
  return '';
  const {s,su,q}=n;
  h+=`<div class="cxb"><h4>In ${su.id} ${esc(su.t)}</h4>${su.qs.map(x=>ctxLink(x.id,k)).join('')}</div>`;
  const outs=REFS_OUT[k]||[], ins=REFS_IN[k]||[];
  if(outs.length||ins.length){
    h+=`<div class="cxb"><h4>Mentioned in framings</h4>`;
    if(outs.length) h+=`<div class="dir">This framing mentions</div>`+outs.map(x=>ctxLink(x,k)).join('');
    if(ins.length) h+=`<div class="dir">Mentioned by</div>`+ins.map(x=>ctxLink(x,k)).join('');
    h+=`</div>`;
  }
  return h;
}
ctx.addEventListener('click',e=>{const b=e.target.closest('[data-go]'); if(b) show(b.dataset.go)});

/* ---------- search + lenses ---------- */
const ENTRYSET=new Set(Object.keys(ENTRY));
const QROWS=[]; DATA.forEach(s0=>s0.subs.forEach(su=>su.qs.forEach(q=>QROWS.push({k:q.id,su:su.id,sec:s0.id,
  txt:(q.id+' '+q.t+' '+q.q+' '+q.n+' '+q.links.map(l=>l.t+' '+l.s).join(' ')).toLowerCase(),crux:!!q.crux,entry:ENTRYSET.has(q.id)}))));
let lensC=false,lensE=false;
const qbox=document.getElementById('q');
function applyFilter(){
  const term=qbox.value.trim().toLowerCase();
  const toks=term.split(/\s+/).filter(Boolean);
  const active=toks.length||lensC||lensE;
  if(!active){
    tree.querySelectorAll('.trow').forEach(r=>{r.style.display='';});
    tree.querySelectorAll('.trow.lv1,.trow.lv2').forEach(r=>{
      const pr=row(r.dataset.p); r.classList.toggle('hide',!(pr&&pr.classList.contains('exp')));});
    return;
  }
  const hits=new Set(), parents=new Set();
  QROWS.forEach(x=>{
    if(toks.length&&!toks.every(t0=>x.txt.includes(t0))) return;
    if(lensC&&!x.crux) return;
    if(lensE&&!x.entry) return;
    hits.add(x.k); parents.add(x.su); parents.add(x.sec);
  });
  tree.querySelectorAll('.trow').forEach(r=>{
    const k=r.dataset.k;
    if(k==='root'){r.style.display='none';return;}
    const shown=hits.has(k)||parents.has(k);
    r.style.display=shown?'':'none';
    if(shown) r.classList.remove('hide');
  });
}
qbox.addEventListener('input',applyFilter);
document.getElementById('lensEntry').addEventListener('click',e=>{lensE=!lensE;e.target.classList.toggle('on',lensE);e.target.setAttribute('aria-pressed',lensE);applyFilter();});

const hh=(location.hash||'').replace(/^#q?/,'').replaceAll('-','.');
if(hh&&nodes[hh]) show(hh,false);
else if(window.innerWidth>760) show('root',false);
else { setExp('1',false); }
</script></body></html>
