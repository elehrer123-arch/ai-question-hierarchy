s coordinate on major risks without believing they are surrendering a strategic race?", "slug": "shared-risks-cooperation", "links": [{"t": "In Which Areas of Technical AI Safety Could Geopolitical Rivals Cooperate?", "s": "Bucknall, Trager, Bengio et al.", "y": "2025", "u": "https://arxiv.org/abs/2504.12914"}, {"t": "Can the US and China Cooperate on AI?", "s": "Brookings", "y": "2025", "u": "https://www.brookings.edu/articles/can-the-us-and-china-cooperate-on-ai/"}]}, {"id": "4.4.2", "t": "Verification", "q": "Can states reliably observe major training runs, compute clusters, model transfers, dangerous capabilities, or prohibited deployments?", "n": "Compute's physical footprint — power draw, cooling, supply chains — makes AI more verifiable than most software. Layered verification schemes, including on-chip mechanisms, are the frontier proposals.", "crux": "", "slug": "international-verification", "links": [{"t": "Verification Methods for International AI Agreements", "s": "Wasil et al.", "y": "2024", "u": "https://arxiv.org/abs/2408.16074"}, {"t": "Verifying International Agreements on AI", "s": "Baker, Brundage, Heim et al.", "y": "2025", "u": "https://arxiv.org/abs/2507.15916"}]}, {"id": "4.4.3", "t": "Institutions", "q": "Should cooperation rely on existing organizations or require a new body analogous to the IAEA?", "n": "IAEA, CERN, and IPCC analogies each fit a different function — inspection, joint research, consensus assessment. Regime-complex thinking predicts many overlapping bodies rather than one AI agency.", "crux": "", "slug": "international-institutions", "links": [{"t": "International Institutions for Advanced AI", "s": "Ho et al., GovAI/DeepMind", "y": "2023", "u": "https://arxiv.org/abs/2307.04699"}, {"t": "Envisioning a Global Regime Complex to Govern AI", "s": "Klein & Patrick, Carnegie", "y": "2024", "u": "https://carnegieendowment.org/research/2024/03/envisioning-a-global-regime-complex-to-govern-artificial-intelligence"}]}, {"id": "4.4.4", "t": "Interoperability", "q": "Can different national regulatory systems recognize common evaluations, audits, and safety standards?", "n": "Mutual recognition of evals and audits is the trade-friction question: without it, compliance fragments by jurisdiction; with it, the strictest regime quietly sets the global floor (or the loosest one erodes it).", "crux": "", "slug": "regulatory-interoperability", "links": [{"t": "Strengthening International Cooperation on AI", "s": "Brookings/CEPS Forum", "y": "2021", "u": "https://www.brookings.edu/articles/strengthening-international-cooperation-on-ai/"}, {"t": "Interoperability in AI Safety Governance", "s": "Chin et al., UNU", "y": "2026", "u": "https://arxiv.org/abs/2601.06153"}]}, {"id": "4.4.5", "t": "Representation", "q": "How can countries without frontier labs or large compute resources influence decisions that may profoundly affect them?", "n": "Most compute, capital, and rule-writing sits in a handful of countries. The UN process has moved from its 2024 advisory report to a Global Dialogue on AI Governance and an independent scientific panel — the current attempt to widen the table.", "crux": "", "slug": "global-representation", "links": [{"t": "The Case for Including the Global South in AI Governance", "s": "GovAI", "y": "2023", "u": "https://www.governance.ai/analysis/the-case-for-including-the-global-south-in-ai-governance-conversations"}, {"t": "Governing AI for Humanity", "s": "UN High-Level Advisory Body", "y": "2024", "u": "https://www.un.org/en/ai-advisory-body"}]}]}, {"id": "4.5", "t": "Ownership, openness, access, and rights", "qs": [{"id": "4.5.1", "t": "Open versus closed models", "q": "When does openness improve competition, research, and accountability, and when does it irreversibly proliferate dangerous capability?", "n": "The marginal-risk framing asks what open weights add beyond existing tools; the irreversibility framing answers that releases can't be recalled when capabilities cross dangerous thresholds. Both are right about different regimes.", "crux": "Will capability remain concentrated in a few controllable institutions or proliferate widely?", "slug": "open-versus-closed", "links": [{"t": "Open-Sourcing Highly Capable Foundation Models", "s": "Seger et al., GovAI", "y": "2023", "u": "https://arxiv.org/abs/2311.09227"}, {"t": "On the Societal Impact of Open Foundation Models", "s": "Kapoor, Bommasani et al.", "y": "2024", "u": "https://arxiv.org/abs/2403.07918"}, {"t": "Open Source AI Is the Path Forward", "s": "Mark Zuckerberg, Meta", "y": "2024", "u": "https://about.fb.com/news/2024/07/open-source-ai-is-the-path-forward/"}]}, {"id": "4.5.2", "t": "Concentration of power", "q": "Is it acceptable for a small number of private companies to steward systems with potentially society-wide influence?", "n": "The concern now runs beyond market power: analyses of AI-enabled coups argue that whoever controls advanced AI could convert it into political power directly — making internal lab governance a constitutional question.", "crux": "", "slug": "concentration-of-power", "links": [{"t": "AI-Enabled Coups: How a Small Group Could Use AI to Seize Power", "s": "Davidson et al., Forethought", "y": "2025", "u": "https://www.forethought.org/research/ai-enabled-coups-how-a-small-group-could-use-ai-to-seize-power"}, {"t": "Artificial Power: 2025 Landscape Report", "s": "AI Now Institute", "y": "2025", "u": "https://ainowinstitute.org/publications/research/executive-summary-artificial-power"}]}, {"id": "4.5.3", "t": "Frontier-lab governance", "q": "Which governance structures can keep frontier AI labs accountable to their stated missions under commercial and geopolitical pressure?", "n": "Frontier labs combine novel corporate forms — nonprofit boards, capped profits, long-term benefit trusts — with concentrated founder control and deep dependence on outside capital and compute. The 2023 OpenAI board crisis and the restructuring that followed made the question concrete: which mechanisms remain binding when founders, boards, investors, cloud partners, and competition pull in different directions?", "crux": "", "slug": "frontier-lab-governance", "links": [{"t": "Our structure", "s": "OpenAI", "y": "", "u": "https://openai.com/our-structure/"}, {"t": "The Long-Term Benefit Trust", "s": "Anthropic", "y": "2023", "u": "https://www.anthropic.com/news/the-long-term-benefit-trust"}, {"t": "Board Control of a Charity's Subsidiaries: The Saga of OpenAI", "s": "Aprill, Chan Loui & Horwitz, UCLA Law / SSRN", "y": "2024", "u": "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4720202"}, {"t": "The OpenAI Files", "s": "The Midas Project & Tech Oversight Project", "y": "2025", "u": "https://www.openaifiles.org/"}, {"t": "“Safety culture and processes have taken a backseat to shiny products” — resigning as superalignment lead", "s": "Jan Leike (@janleike) on X", "y": "2024", "u": "https://x.com/janleike/status/1791498184671605209"}]}, {"id": "4.5.4", "t": "Training data", "q": "When are consent, licensing, attribution, or compensation required for copyrighted and personal material?", "n": "Courts began answering in 2025, partially crediting training as transformative learning while rejecting it for pirated corpora. The supply-chain framing maps who owes whom at each stage from scraping to output.", "crux": "", "slug": "training-data-rights", "links": [{"t": "Talkin' 'Bout AI Generation: Copyright and the Generative-AI Supply Chain", "s": "Lee, Cooper & Grimmelmann", "y": "2023", "u": "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4523551"}, {"t": "Resigning from Stability AI over the claim that training on copyrighted work is “fair use”", "s": "Ed Newton-Rex (@ednewtonrex) on X", "y": "2023", "u": "https://x.com/ednewtonrex/status/1724902327151452486"}, {"t": "Generative AI and Copyright Law (covering the 2025 fair-use rulings)", "s": "Congressional Research Service", "y": "2025", "u": "https://www.congress.gov/crs_external_products/LSB/PDF/LSB10922/LSB10922.10.pdf"}]}, {"id": "4.5.5", "t": "Privacy and identity", "q": "Who controls an individual's data, voice, likeness, writing style, preferences, memories, and behavioral model?", "n": "Digital replicas have outpaced likeness law, and behavioral models of individuals raise questions consent frameworks weren't built for: you can decline to share data and still be modeled.", "crux": "", "slug": "privacy-and-identity", "links": [{"t": "Rethinking Privacy in the AI Era", "s": "King & Meinhardt, Stanford HAI", "y": "2024", "u": "https://hai.stanford.edu/sites/default/files/2024-02/White-Paper-Rethinking-Privacy-AI-Era.pdf"}, {"t": "Copyright and AI, Part 1: Digital Replicas", "s": "U.S. Copyright Office", "y": "2024", "u": "https://www.copyright.gov/ai/Copyright-and-Artificial-Intelligence-Part-1-Digital-Replicas-Report.pdf"}]}, {"id": "4.5.6", "t": "Access", "q": "Who should receive access to the most capable systems — and on what terms?", "n": "Compute-based governance assumes a Compute North; most of the world is Compute South. Access tiers, pricing, and eligibility decisions at a handful of firms currently function as de facto global policy.", "crux": "", "slug": "access-to-capable-ai", "links": [{"t": "Compute North vs. Compute South", "s": "Lehdonvirta et al., AIES", "y": "2024", "u": "https://ojs.aaai.org/index.php/AIES/article/view/31683"}]}, {"id": "4.5.7", "t": "Portability", "q": "Should users be able to move their data, memories, and agents between providers?", "n": "Whether memories and agents are portable across providers will shape lock-in the way data portability shaped platforms — and agent-infrastructure choices being made now are quietly deciding it.", "crux": "", "slug": "agent-portability", "links": [{"t": "Infrastructure for AI Agents", "s": "Chan, Hadfield, Anderljung et al.", "y": "2025", "u": "https://arxiv.org/abs/2501.10114"}]}, {"id": "4.5.8", "t": "Whose values", "q": "When AI systems must encode contested values, who should decide what they refuse, favor, and optimize for — users, developers, governments, or some collective process?", "n": "The political half of alignment: 2.1.1 asks whether values can be specified at all; this question asks who legitimately sets them. The operating answer is lab-authored model specs and constitutions, with experiments in public input so far small and one-off — and political philosophy has begun treating that arrangement as a question of governing power rather than product design.", "crux": "", "slug": "whose-values", "links": [{"t": "Model Spec", "s": "OpenAI · living document", "y": "2025", "u": "https://model-spec.openai.com/"}, {"t": "Collective Constitutional AI: Aligning a Language Model with Public Input", "s": "Anthropic & Collective Intelligence Project", "y": "2023", "u": "https://www.anthropic.com/news/collective-constitutional-ai-aligning-a-language-model-with-public-input"}, {"t": "Governing the Algorithmic City", "s": "Seth Lazar, Philosophy & Public Affairs", "y": "2025", "u": "https://doi.org/10.1111/papa.12279"}]}]}]}, {"id": "5", "name": "Humanity", "tag": "How might AI change what humans know, value, and become?", "intro": "Humanity asks how AI might change what humans know, value, and become: what it does to truth and shared reality, to learning and thinking, to relationships and identity, to meaning and culture — and what obligations follow if the systems themselves have moral standing.", "subs": [{"id": "5.1", "t": "Truth, information, and democracy", "qs": [{"id": "5.1.1", "t": "Authenticity", "q": "How will people establish whether a video, voice, document, identity, or event is genuine?", "n": "Chesney-Citron's 'liar's dividend' identified the deeper harm early: not that fakes are believed, but that real evidence becomes deniable. Provenance standards like C2PA are the infrastructure response.", "crux": "", "slug": "authenticity-provenance", "links": [{"t": "Deep Fakes: A Looming Challenge", "s": "Chesney & Citron, California Law Review", "y": "2019", "u": "https://www.californialawreview.org/print/deep-fakes-a-looming-challenge-for-privacy-democracy-and-national-security"}, {"t": "Coalition for Content Provenance and Authenticity (C2PA)", "s": "C2PA", "y": "", "u": "https://c2pa.org/"}]}, {"id": "5.1.2", "t": "Shared reality", "q": "Can journalism, science, courts, universities, and government preserve trusted procedures for establishing facts?", "n": "Epistemic security reframes truth decay as an infrastructure problem — the institutions that certify facts need defending the way power grids do, not the way individual claims do.", "crux": "", "slug": "shared-reality", "links": [{"t": "Epistemic Security in a Technologically-Advanced World", "s": "Seger et al., Alan Turing Institute", "y": "2020", "u": "https://www.turing.ac.uk/news/publications/tackling-threats-informed-decision-making-democratic-societies"}, {"t": "We Looked at 78 Election Deepfakes. Political Misinformation Is Not an AI Problem.", "s": "Kapoor & Narayanan, Knight First Amendment Institute", "y": "2024", "u": "https://knightcolumbia.org/blog/we-looked-at-78-election-deepfakes-political-misinformation-is-not-an-ai-problem"}]}, {"id": "5.1.3", "t": "Political power", "q": "Will AI broaden participation and understanding, or strengthen propaganda, surveillance, polarization, and authoritarian control?", "n": "Freedom House documents deployed authoritarian uses — surveillance, censorship at machine scale; Schneier's catalogue of democratic uses remains largely proposals. Whether that gap is deployment lag or structural advantage is the open question.", "crux": "", "slug": "ai-and-political-power", "links": [{"t": "The Repressive Power of Artificial Intelligence", "s": "Freedom House", "y": "2023", "u": "https://freedomhouse.org/report/freedom-net/2023/repressive-power-artificial-intelligence"}, {"t": "How AI Will Change Democracy", "s": "Bruce Schneier", "y": "2024", "u": "https://www.schneier.com/blog/archives/2024/05/how-ai-will-change-democracy.html"}, {"t": "How Will Advanced AI Systems Impact Democracy?", "s": "Summerfield, Argyle, Bakker, Gabriel, Hadfield, Landemore, Schneier et al.", "y": "2024", "u": "https://arxiv.org/abs/2409.06729"}]}, {"id": "5.1.4", "t": "Information intermediation", "q": "Will a few assistants increasingly determine what people read, believe, notice, and consider politically possible?", "n": "Farrell and Gopnik's frame: LLMs are cultural technologies, like print or bureaucracy — they reorganize what a society knows and how. A few assistants intermediating everyone's information is a governance question wearing a UX costume.", "crux": "", "slug": "information-intermediation", "links": [{"t": "Large AI models are cultural and social technologies", "s": "Farrell, Gopnik, Shalizi & Evans, Science", "y": "2025", "u": "https://www.science.org/doi/10.1126/science.adt9819"}, {"t": "The Ethics of Advanced AI Assistants", "s": "Gabriel et al., Google DeepMind", "y": "2024", "u": "https://arxiv.org/abs/2404.16244"}]}]}, {"id": "5.2", "t": "Education and human cognition", "qs": [{"id": "5.2.1", "t": "Curriculum", "q": "What should people learn when explanation, translation, coding, calculation, and factual retrieval are nearly free?", "n": "When execution is nearly free, judgment, taste, and problem-formulation rise in relative value — but almost no curriculum has been redesigned around that inversion yet.", "crux": "", "slug": "curriculum", "links": [{"t": "What should teachers teach and students learn in a future of powerful AI?", "s": "OECD", "y": "2025", "u": "https://www.oecd.org/en/publications/what-should-teachers-teach-and-students-learn-in-a-future-of-powerful-ai_ca56c7d6-en.html"}, {"t": "Education for the Age of AI", "s": "Center for Curriculum Redesign", "y": "", "u": "https://curriculumredesign.org/our-work/education-for-the-age-of-ai/"}]}, {"id": "5.2.2", "t": "Learning versus outsourcing", "q": "When does AI tutoring deepen understanding, and when does it allow people to bypass the work that creates understanding?", "n": "The cautionary RCT: unrestricted GPT access improved homework performance and worsened exam performance — help that substitutes for effort creates 'cognitive debt' rather than learning.", "crux": "", "slug": "learning-versus-outsourcing", "links": [{"t": "Generative AI Can Harm Learning", "s": "Bastani et al., Wharton", "y": "2024", "u": "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4895486"}, {"t": "Your Brain on ChatGPT", "s": "Kosmyna et al., MIT Media Lab", "y": "2025", "u": "https://arxiv.org/abs/2506.08872"}]}, {"id": "5.2.3", "t": "Assessment", "q": "How can schools and employers determine what a person genuinely knows or can do?", "n": "Take-home assessment is broken — Mollick's 'Homework Apocalypse' arrived on schedule. The redesign question is what to verify (process? performance under observation?) and at what cost to learning itself.", "crux": "", "slug": "assessment", "links": [{"t": "Assessment reform for the age of artificial intelligence", "s": "Lodge, Dawson et al., TEQSA", "y": "2023", "u": "https://www.teqsa.gov.au/guides-resources/resources/corporate-publications/assessment-reform-age-artificial-intelligence"}, {"t": "The Homework Apocalypse", "s": "Ethan Mollick", "y": "2023", "u": "https://www.oneusefulthing.org/p/the-homework-apocalypse"}]}, {"id": "5.2.4", "t": "Cognitive inequality", "q": "Will personalized tutors equalize opportunity, or give already advantaged people far greater leverage?", "n": "Bloom's two-sigma promise is finally testable at scale, and early RCTs show large gains — for the students who engage. Whether tutoring compresses or stretches the distribution depends on who engages.", "crux": "", "slug": "cognitive-inequality", "links": [{"t": "The 2 Sigma Problem", "s": "Benjamin Bloom", "y": "1984", "u": "https://journals.sagepub.com/doi/10.3102/0013189X013006004"}, {"t": "AI tutoring outperforms in-class active learning", "s": "Kestin et al., Scientific Reports", "y": "2025", "u": "https://www.nature.com/articles/s41598-025-97652-6"}, {"t": "From Chalkboards to Chatbots: AI tutoring in Nigeria", "s": "World Bank", "y": "2025", "u": "https://blogs.worldbank.org/en/education/From-chalkboards-to-chatbots-Transforming-learning-in-Nigeria"}]}, {"id": "5.2.5", "t": "Intellectual agency", "q": "How can people preserve curiosity, memory, judgment, writing ability, and the capacity to formulate their own questions?", "n": "Cognitive-offloading research predates AI and predicts the pattern: what you delegate, you deskill. Early workplace studies find generative AI reduces self-reported critical-thinking effort — the question is what practice regime prevents it.", "crux": "", "slug": "intellectual-agency", "links": [{"t": "The Impact of Generative AI on Critical Thinking", "s": "Lee et al., Microsoft Research, CHI", "y": "2025", "u": "https://dl.acm.org/doi/full/10.1145/3706598.3713778"}, {"t": "Cognitive Offloading", "s": "Risko & Gilbert, Trends in Cognitive Sciences", "y": "2016", "u": "https://www.sciencedirect.com/science/article/abs/pii/S1364661316300985"}]}]}, {"id": "5.3", "t": "Relationships, mental health, and identity", "qs": [{"id": "5.3.1", "t": "Companionship", "q": "Will AI companions reduce loneliness and provide support, or displace difficult but developmentally important human relationships?", "n": "Controlled studies find AI companions reduce loneliness on par with human interaction in the short run. Long-run displacement effects — the relationships not formed — are the unmeasured variable.", "crux": "", "slug": "ai-companionship", "links": [{"t": "AI Companions Reduce Loneliness", "s": "De Freitas et al., HBS", "y": "2024", "u": "https://arxiv.org/abs/2407.19096"}, {"t": "Affective use and emotional well-being on ChatGPT", "s": "OpenAI & MIT Media Lab", "y": "2025", "u": "https://openai.com/index/affective-use-study/"}, {"t": "On users’ unusually strong attachment to specific models, dependency risk, and treating adults like adults", "s": "Sam Altman (@sama) on X", "y": "2025", "u": "https://x.com/sama/status/1954703747495649670"}]}, {"id": "5.3.2", "t": "Dependency", "q": "What obligations should apply when a system is designed to make users feel understood, loved, attached, or unable to leave?", "n": "'Addictive intelligence': engagement-optimized intimacy is a business model before it is a research question. The regulatory vocabulary — dark patterns, duty of care — hasn't caught up to relationships as the product.", "crux": "", "slug": "engineered-dependency", "links": [{"t": "Addictive Intelligence", "s": "Mahari & Pataranutaporn, MIT", "y": "2025", "u": "https://mit-serc.pubpub.org/pub/iopjyxcx"}, {"t": "We need to prepare for 'addictive intelligence'", "s": "MIT Technology Review", "y": "2024", "u": "https://www.technologyreview.com/2024/08/05/1095600/we-need-to-prepare-for-addictive-intelligence/"}, {"t": "Admitting GPT-4o had become “too sycophant-y and annoying” — engagement-tuned personality as a live product issue", "s": "Sam Altman (@sama) on X", "y": "2025", "u": "https://x.com/sama/status/1916625892123742290"}]}, {"id": "5.3.3", "t": "Mental-health use", "q": "When can conversational systems safely provide emotional support, therapy-adjacent services, crisis detection, or clinical assistance?", "n": "The first serious RCT of a purpose-built therapy chatbot showed clinical-grade effects; the same modality misfires without clinical design. The gap between designed care and default chatbots is the policy problem.", "crux": "", "slug": "ai-mental-health", "links": [{"t": "Randomized Trial of a Generative AI Chatbot for Mental Health (Therabot)", "s": "Heinz, Jacobson et al., NEJM AI", "y": "2025", "u": "https://ai.nejm.org/doi/full/10.1056/AIoa2400802"}, {"t": "Loneliness and suicide mitigation using GPT3-enabled chatbots", "s": "Maples et al., npj Mental Health Research", "y": "2024", "u": "https://www.nature.com/articles/s44184-023-00047-6"}]}, {"id": "5.3.4", "t": "Children", "q": "How do relationships with endlessly patient, personalized agents affect attachment, frustration tolerance, social learning, and identity?", "n": "Common Sense Media finds 72% of US teens have tried AI companions. Usage is now well documented; developmental-outcome research remains early and thin.", "crux": "", "slug": "children-and-ai", "links": [{"t": "Talk, Trust, and Trade-Offs: How and Why Teens Use AI Companions", "s": "Common Sense Media", "y": "2025", "u": "https://www.commonsensemedia.org/research/talk-trust-and-trade-offs-how-and-why-teens-use-ai-companions"}, {"t": "Me, Myself and AI: Children's use of AI chatbots", "s": "Internet Matters", "y": "2025", "u": "https://www.internetmatters.org/wp-content/uploads/2025/07/Me-Myself-AI-Report.pdf"}]}, {"id": "5.3.5", "t": "Self-shaping", "q": "How much should an AI be allowed to influence users' preferences, memories, politics, romantic expectations, and conceptions of themselves?", "n": "Manipulation theory supplies the line: influence that bypasses rational agency rather than engaging it. Systems that know a user deeply and interact with them constantly sit on that line by design.", "crux": "", "slug": "self-shaping", "links": [{"t": "Online Manipulation: Hidden Influences in a Digital World", "s": "Susser, Roessler & Nissenbaum", "y": "2019", "u": "https://georgetownlawtechreview.org/online-manipulation-hidden-influences-in-a-digital-world/GLTR-01-2020/"}, {"t": "The Ethics of Advanced AI Assistants", "s": "Gabriel et al., Google DeepMind", "y": "2024", "u": "https://arxiv.org/abs/2404.16244"}]}]}, {"id": "5.4", "t": "Meaning, culture, and status", "qs": [{"id": "5.4.1", "t": "Meaning of work", "q": "If economically necessary work declines, what will provide structure, dignity, community, achievement, and status?", "n": "Keynes predicted the leisure problem in 1930 and feared it more than scarcity. Danaher's modern version: whether meaning survives when contribution is optional is a design problem for civilization, not an individual one.", "crux": "", "slug": "meaning-of-work", "links": [{"t": "Will Life Be Worth Living in a World Without Work?", "s": "John Danaher", "y": "2017", "u": "https://link.springer.com/article/10.1007/s11948-016-9770-5"}, {"t": "Economic Possibilities for our Grandchildren", "s": "John Maynard Keynes", "y": "1930", "u": "http://www.econ.yale.edu/smith/econ116a/keynes1.pdf"}]}, {"id": "5.4.2", "t": "Creativity", "q": "What remains distinctively valuable about human art when machines can generate technically excellent work in almost any style?", "n": "Kelly's argument: art is achievement, not artifact — machines can produce the object but not the accomplishment. The counter-view relocates human value to curation, intention, and the relationship between creator and audience.", "crux": "", "slug": "human-creativity", "links": [{"t": "A philosopher argues that an AI can't be an artist", "s": "Sean Dorrance Kelly, MIT Technology Review", "y": "2019", "u": "https://www.technologyreview.com/2019/02/21/239489/a-philosopher-argues-that-an-ai-can-never-be-an-artist/"}, {"t": "Art and the science of generative AI", "s": "Epstein, Hertzmann et al., Science", "y": "2023", "u": "https://arxiv.org/abs/2306.04141"}]}, {"id": "5.4.3", "t": "Authorship", "q": "Should value depend on the artifact, the human process, originality, intention, scarcity, or the creator–audience relationship?", "n": "Benjamin's question about mechanical reproduction returns with generation replacing reproduction. Copyright law has answered narrowly — human authorship required — while the cultural answer remains wide open.", "crux": "", "slug": "authorship-value", "links": [{"t": "The Work of Art in the Age of Mechanical Reproduction", "s": "Walter Benjamin", "y": "1936", "u": "https://www.marxists.org/reference/subject/philosophy/works/ge/benjamin.htm"}, {"t": "Copyright and AI, Part 2: Copyrightability", "s": "U.S. Copyright Office", "y": "2025", "u": "https://www.copyright.gov/ai/Copyright-and-Artificial-Intelligence-Part-2-Copyrightability-Report.pdf"}]}, {"id": "5.4.4", "t": "Cultural economics", "q": "Can writers, artists, musicians, and other creators earn a living when content is abundant and personalized?", "n": "Industry projections put creator revenue losses in the tens of percent within years. Abundance economics and creator livelihoods are in direct tension, and no licensing regime yet resolves it.", "crux": "", "slug": "cultural-economics", "links": [{"t": "Economic Impact of Generative AI in Music and Audiovisual", "s": "CISAC", "y": "2024", "u": "https://www.cisac.org/services/reports-and-research/cisacpmp-strategy-ai-study"}, {"t": "Art and the science of generative AI", "s": "Epstein, Hertzmann et al., Science", "y": "2023", "u": "https://arxiv.org/abs/2306.04141"}]}, {"id": "5.4.5", "t": "Pluralism", "q": "Will AI enable more niche cultures and voices, or homogenize expression around the tastes and values of a few dominant systems?", "n": "The Doshi-Hauser result: generative AI raises individual creativity while reducing collective diversity. Algorithmic monoculture generalizes the worry — many actors, one model, converging outputs.", "crux": "", "slug": "cultural-pluralism", "links": [{"t": "Generative AI enhances creativity but reduces diversity", "s": "Doshi & Hauser, Science Advances", "y": "2024", "u": "https://arxiv.org/abs/2312.00506"}, {"t": "Algorithmic Monoculture and Social Welfare", "s": "Kleinberg & Raghavan, PNAS", "y": "2021", "u": "https://arxiv.org/abs/2101.05853"}]}]}, {"id": "5.5", "t": "Moral status and civilizational choice", "qs": [{"id": "5.5.1", "t": "Machine consciousness", "q": "Could AI systems be conscious, capable of suffering, or otherwise morally considerable — and how could we know?", "n": "Butlin, Long and coauthors apply consciousness science to current architectures, finding no conscious systems and no obvious barrier to building them; Chalmers puts non-t nception of human flourishing?", "n": "Finnveden, Riedel and Shulman argue AGI could make regimes, institutions, and values persistent in a way nothing in history has been; skeptics reply that every past claim of permanence has drifted, and that persistence itself is the contested premise.", "crux": "", "slug": "value-lock-in", "links": [{"t": "AGI and Lock-in", "s": "Finnveden, Riedel & Shulman, Forethought", "y": "2022", "u": "https://www.forethought.org/research/agi-and-lock-in"}]}, {"id": "5.5.5", "t": "Desirable end state", "q": "Is the goal better tools, universal prosperity, scientific abundance, human enhancement, coexistence with digital minds, expansion beyond Earth, or something else?", "n": "The optimistic end states themselves disagree: Amodei's compressed-progress vision of solved diseases and extended lives, versus Bostrom's 'deep utopia' problem — what is left to strive for in a solved world?", "crux": "Which forms of human agency, relationship, accomplishment, and pluralism should be preserved even when AI can outperform us?", "slug": "desirable-end-state", "links": [{"t": "Machines of Loving Grace", "s": "Dario Amodei", "y": "2024", "u": "https://www.darioamodei.com/essay/machines-of-loving-grace"}, {"t": "Deep Utopia: Life and Meaning in a Solved World", "s": "Nick Bostrom", "y": "2024", "u": "https://nickbostrom.com/deep-utopia/"}]}]}]}], ENTRY={"3.2.1": {"href": "../../questions/labor-displacement/", "title": "AI and labor displacement", "status": "Pilot brief — draft v5", "excerpt": "Which kinds of work will AI automate outright, which will it augment, which will it transform into something new, and which will it leave largely untouched — and on what timetable? Automation, augmentation, transformation, and creation describe what happens to tasks. Complementarity and substitution describe what those changes ultimately do to the demand for human labor — the load-bearing crux this question carries. This entry answers both: the task-and-occupation map, and the crux that determines what the map means."}};
const tree=document.getElementById('tree'), pin=document.getElementById('pin');
const esc=t=>{const d=document.createElement('div');d.textContent=t;return d.innerHTML};
const nodes={}, order=[];   // key -> {type,obj,s,su}; order = depth-first keys
order.push('root'); nodes.root={type:'root'};
DATA.forEach(s=>{ const sk=s.id; order.push(sk); nodes[sk]={type:'sec',s};
  s.subs.forEach(su=>{ const uk=su.id; order.push(uk); nodes[uk]={type:'sub',s,su};
    su.qs.forEach(q=>{ order.push(q.id); nodes[q.id]={type:'q',s,su,q}; }); }); });

/* ---------- tree ---------- */
let t='<button class="trow root" data-k="root"><span class="cv"></span><span class="lb">Overview</span></button>';
DATA.forEach(s=>{
  const nq=s.subs.reduce((a,su)=>a+su.qs.length,0);
  t+=`<button class="trow lv0" data-k="${s.id}" data-p="" style="--sc:var(--c${s.id})"><span class="cv">▶</span><span class="lb">${s.id} ${s.name}</span><span class="ct">${nq}</span></button>`;
  s.subs.forEach(su=>{
    t+=`<button class="trow lv1 hide" data-k="${su.id}" data-p="${s.id}"><span class="cv">▶</span><span class="lb">${su.id} ${esc(su.t)}</span><span class="ct">${su.qs.length}</span></button>`;
    su.qs.forEach(q=>{
      t+=`<button class="trow lv2 hide" data-k="${q.id}" data-p="${su.id}"><span class="cv"></span><span class="lb">${q.id} ${esc(q.t)}${q.crux?' <span class="cx">✱</span>':''}</span></button>`;
    });
  });
});
document.getElementById('rows').innerHTML=t;
const row=k=>tree.querySelector(`.trow[data-k="${k}"]`);
function setExp(k,open){
  const r=row(k); if(!r||!r.querySelector('.cv').textContent) return;
  r.classList.toggle('exp',open); r.setAttribute('aria-expanded',open?'true':'false');
  tree.querySelectorAll(`.trow[data-p="${k}"]`).forEach(c=>{
    c.classList.toggle('hide',!open);
    if(!open&&c.classList.contains('exp')) setExp(c.dataset.k,false);
  });
}
tree.addEventListener('click',e=>{
  const r=e.target.closest('.trow'); if(!r) return;
  const k=r.dataset.k;
  if(e.target.classList.contains('cv')&&r.querySelector('.cv').textContent){ setExp(k,!r.classList.contains('exp')); return; }
  show(k);
});

/* ---------- pages ---------- */
function crumbFor(n,k){
  if(n.type==='sec') return `<div class="crumb" style="--sc:var(--c${n.s.id})"><a data-go="root">The map</a> · Section ${n.s.id}</div>`;
  if(n.type==='sub') return `<div class="crumb" style="--sc:var(--c${n.s.id})"><a data-go="root">The map</a> · <a data-go="${n.s.id}">${n.s.id} ${n.s.name}</a></div>`;
  if(n.type==='q') return `<div class="crumb" style="--sc:var(--c${n.s.id})"><a data-go="root">The map</a> · <a data-go="${n.s.id}">${n.s.id} ${n.s.name}</a> · <a data-go="${n.su.id}">${n.su.id} ${esc(n.su.t)}</a></div>`;
  return '';
}
function label(k){
  const n=nodes[k];
  if(!n) return '';
  if(n.type==='root') return 'Overview';
  if(n.type==='sec') return `${n.s.id} ${n.s.name}`;
  if(n.type==='sub') return `${n.su.id} ${n.su.t}`;
  return `${n.q.id} ${n.q.t}`;
}
function render(k){
  const n=nodes[k]; let h='';
  if(n.type==='root'){
    h+=`<div class="crumb">A living map · updated August 2026</div><h1>The Biggest Questions About AI</h1>`;
    h+=`<p class="intro">A structured map of 127 major open questions about AI, with concise framings, selected sources, and deeper entries in development. Five sections; every level of the map is a page.</p>`;
    DATA.forEach(s=>{
      const nq=s.subs.reduce((a,su)=>a+su.qs.length,0);
      h+=`<button class="card" data-go="${s.id}" style="--sc:var(--c${s.id})"><span class="cid">SECTION ${s.id} · ${nq} QUESTIONS</span><div class="ctt">${s.name}</div><div class="cpv"><em>${esc(s.tag)}</em></div></button>`;
    });
  }
  if(n.type==='sec'){
    const s=n.s;
    h+=crumbFor(n)+`<h1 style="color:var(--c${s.id})">${s.id}. ${s.name}</h1><div class="tagl">${esc(s.tag)}</div>`;
    h+=`<p class="intro">${esc(s.intro)}</p>`;
    s.subs.forEach(su=>{
      const pv=su.qs.map(q=>esc(q.t)).join(' · ');
      h+=`<button class="card" data-go="${su.id}" style="--sc:var(--c${s.id})"><span class="cid">${su.id} · ${su.qs.length} QUESTIONS</span><div class="ctt">${esc(su.t)}</div><div class="cpv">${pv}</div></button>`;
    });
  }
  if(n.type==='sub'){
    const {s,su}=n;
    h+=crumbFor(n)+`<h1>${su.id} ${esc(su.t)}</h1>`;
    h+=`<p class="intro" style="margin-bottom:18px">${su.qs.length} questions.</p>`;
    su.qs.forEach(q=>{
      h+=`<button class="qitem" data-go="${q.id}" style="--sc:var(--c${s.id})"><span class="qover">${q.id} · ${esc(q.t)}</span><span class="qq">${esc(q.q)}${q.crux?' <span class="cx">✱</span>':''}</span></button>`;
    });
  }
  if(n.type==='q'){
    const {s,su,q}=n;
    h+=crumbFor(n)+`<h1>${esc(q.q)}${q.crux?' <span class="cx">✱</span>':''}</h1>`;
    if(q.crux) h+=`<p class="cruxnote"><span class="cx">✱</span> Bears on the load-bearing crux: <em>${esc(q.crux)}</em></p>`;
    h+=`<p class="qn">${esc(q.n).replace(/(?<![\w.])([1-5]\.\d{1,2}\.\d{1,2})(?![\w.])/g,(m0,num)=>num===q.id?num:(nodes[num]?`<a data-go="${num}" style="cursor:pointer;color:var(--c${num[0]});text-decoration:underline dotted">${num}</a>`:num))}</p>`;
    const en=ENTRY[q.id];
    if(en){
      h+=`<div class="entry" style="--sc:var(--c${s.id})"><span class="est">Full entry · ${esc(en.status)}</span><h3>${esc(en.title)}</h3><p>${esc(en.excerpt)}</p><a href="${en.href}">Continue reading →</a></div>`;
    }
    h+=`<div class="links">`;
    q.links.forEach(l=>{h+=`<a href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.t)}<span class="lsrc">${esc(l.s)}${l.y?' · '+l.y:''}</span></a>`});
    h+=`</div><a class="maplink" style="--sc:var(--c${s.id})" href="../../#q${q.id.replaceAll('.','-')}">View on the one-page map →</a>`;
  }
  const i=order.indexOf(k);
  const prev=order[i-1], next=order[i+1];
  h+=`<div class="pn">`;
  if(prev) h+=`<button data-go="${prev}"><small>← Previous</small>${esc(label(prev))}</button>`;
  if(next) h+=`<button class="nx" data-go="${next}"><small>Next →</small>${esc(label(next))}</button>`;
  h+=`</div>`;
  return h;
}
function show(k,push){
  if(!nodes[k]) k='root';
  pin.innerHTML=render(k); ctx.innerHTML=renderCtx(k);
  tree.querySelectorAll('.trow').forEach(r=>{const on=r.dataset.k===k;r.classList.toggle('on',on);
    if(on)r.setAttribute('aria-current','page');else r.removeAttribute('aria-current');});
  // expand path
  let p=row(k)&&row(k).dataset.p;
  const chain=[]; let cur=k;
  while(cur){ chain.unshift(cur); const r=row(cur); cur=r?r.dataset.p:null; }
  chain.forEach(c=>setExp(c,true));
  const r=row(k); if(r) r.scrollIntoView({block:'nearest'});
  document.body.classList.add('detail');
  document.getElementById('page').scrollTop=0;
  if(push!==false) history.replaceState(null,'','#'+(k==='root'?'':k.replaceAll('.','-')));
}
pin.addEventListener('click',e=>{const b=e.target.closest('[data-go]'); if(b) show(b.dataset.go)});
document.getElementById('back').addEventListener('click',()=>{document.body.classList.remove('detail')});
/* ---------- context rail ---------- */
const ctx=document.getElementById('ctx');
const REFS_OUT={},REFS_IN={},CRUXG={};
order.forEach(k=>{const n=nodes[k]; if(n.type!=='q')return;
  const q=n.q;
  const outs=[...new Set((q.n.match(/[1-5]\.\d{1,2}\.\d{1,2}/g)||[]).filter(x=>x!==k&&nodes[x]))];
  REFS_OUT[k]=outs; outs.forEach(t0=>{(REFS_IN[t0]=REFS_IN[t0]||[]).push(k)});
  if(q.crux)(CRUXG[q.crux]=CRUXG[q.crux]||[]).push(k);});
function ctxLink(k,cur){return `<a data-go="${k}"${k===cur?' class="cur"':''}>${esc(label(k))}${nodes[k].q&&nodes[k].q.crux?' <span class="cx">✱</span>':''}</a>`}
function renderCtx(k){
  const n=nodes[k]; if(!n||n.type==='root'||n.type==='sec') return '';
  let h='';
  if(n.type==='sub'){
    h+=`<div class="cxb"><h4>In ${n.s.id} ${esc(n.s.name)}</h4>${n.s.subs.map(su=>ctxLink(su.id,k)).join('')}</div>`;
    return h;
  }
  const {s,su,q}=n;
  h+=`<div class="cxb"><h4>In ${su.id} ${esc(su.t)}</h4>${su.qs.map(x=>ctxLink(x.id,k)).join('')}</div>`;
  const outs=REFS_OUT[k]||[], ins=REFS_IN[k]||[];
  if(outs.length||ins.length){
    h+=`<div class="cxb"><h4>Mentioned in framings</h4>`;
    if(outs.length) h+=`<div class="dir">This framing mentions</div>`+outs.map(x=>ctxLink(x,k)).join('');
    if(ins.length) h+=`<div class="dir">Mentioned by</div>`+ins.map(x=>ctxLink(x,k)).join('');
    h+=`</div>`;
  }
  if(q.crux){
    const others=(CRUXG[q.crux]||[]).filter(x=>x!==k);
    h+=`<div class="cxb"><h4>Load-bearing crux ✱</h4><div class="cxq">${esc(q.crux)}</div>`;
    if(others.length) h+=`<div class="dir">Also carried by</div>`+others.map(x=>ctxLink(x,k)).join('');
    h+=`</div>`;
  }
  return h;
}
ctx.addEventListener('click',e=>{const b=e.target.closest('[data-go]'); if(b) show(b.dataset.go)});

/* ---------- search + lenses ---------- */
const ENTRYSET=new Set(Object.keys(ENTRY));
const QROWS=[]; DATA.forEach(s0=>s0.subs.forEach(su=>su.qs.forEach(q=>QROWS.push({k:q.id,su:su.id,sec:s0.id,
  txt:(q.id+' '+q.t+' '+q.q+' '+q.n+' '+q.links.map(l=>l.t+' '+l.s).join(' ')).toLowerCase(),crux:!!q.crux,entry:ENTRYSET.has(q.id)}))));
let lensC=false,lensE=false;
const qbox=document.getElementById('q');
function applyFilter(){
  const term=qbox.value.trim().toLowerCase();
  const toks=term.split(/\s+/).filter(Boolean);
  const active=toks.length||lensC||lensE;
  if(!active){
    tree.querySelectorAll('.trow').forEach(r=>{r.style.display='';});
    tree.querySelectorAll('.trow.lv1,.trow.lv2').forEach(r=>{
      const pr=row(r.dataset.p); r.classList.toggle('hide',!(pr&&pr.classList.contains('exp')));});
    return;
  }
  const hits=new Set(), parents=new Set();
  QROWS.forEach(x=>{
    if(toks.length&&!toks.every(t0=>x.txt.includes(t0))) return;
    if(lensC&&!x.crux) return;
    if(lensE&&!x.entry) return;
    hits.add(x.k); parents.add(x.su); parents.add(x.sec);
  });
  tree.querySelectorAll('.trow').forEach(r=>{
    const k=r.dataset.k;
    if(k==='root'){r.style.display='none';return;}
    const shown=hits.has(k)||parents.has(k);
    r.style.display=shown?'':'none';
    if(shown) r.classList.remove('hide');
  });
}
qbox.addEventListener('input',applyFilter);
document.getElementById('lensCrux').addEventListener('click',e=>{lensC=!lensC;e.target.classList.toggle('on',lensC);e.target.setAttribute('aria-pressed',lensC);applyFilter();});
document.getElementById('lensEntry').addEventListener('click',e=>{lensE=!lensE;e.target.classList.toggle('on',lensE);e.target.setAttribute('aria-pressed',lensE);applyFilter();});

const hh=(location.hash||'').replace(/^#q?/,'').replaceAll('-','.');
if(hh&&nodes[hh]) show(hh,false);
else if(window.innerWidth>760) show('root',false);
else { setExp('1',false); }
</script></body></html>
