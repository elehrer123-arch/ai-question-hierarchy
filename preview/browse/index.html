<script>
const DATA=[{"id": "1", "name": "Trajectory", "tag": "What can AI become?", "intro": "Trajectory asks what AI systems will actually be able to do: which capabilities, through which mechanisms, and on what timeline — keeping claims about what is impossible in principle distinct from claims about what is merely far off. It spans the ceiling of the current paradigm, the ingredients still missing, and how far autonomy, embodiment, and self-improvement can go.", "subs": [{"id": "1.1", "t": "Scaling, resources, and technical limits", "qs": [{"id": "1.1.1", "t": "Current-paradigm ceiling", "q": "How far can transformers, reinforcement learning, tool use, and inference-time reasoning progress without a fundamentally new architecture?", "n": "The scaling hypothesis bet that capability comes from scale, not cleverness. The live question is whether pretraining returns are genuinely diminishing — itself disputed — and if so, whether RL on verifiable tasks and test-time compute offset them, or the paradigm tops out short of general competence.", "crux": "Are current architectures sufficient for broadly superhuman intelligence?", "slug": "current-paradigm-ceiling", "links": [{"t": "Will scaling work?", "s": "Dwarkesh Patel", "y": "2023", "u": "https://www.dwarkesh.com/p/will-scaling-work"}, {"t": "The Era of Experience", "s": "Silver & Sutton, DeepMind", "y": "2025", "u": "https://storage.googleapis.com/deepmind-media/Era-of-Experience%20/The%20Era%20of%20Experience%20Paper.pdf"}]}, {"id": "1.1.2", "t": "Sources of improvement", "q": "How much future progress will come from compute, algorithms, data, inference-time search, better environments, or system-level scaffolding?", "n": "Decompositions of historical progress attribute gains roughly evenly to compute scaling and algorithmic efficiency. Which input dominates going forward determines who can compete, what governance levers exist, and how abruptly progress could slow.", "crux": "", "slug": "sources-of-progress", "links": [{"t": "The Bitter Lesson", "s": "Richard Sutton", "y": "2019", "u": "http://www.incompleteideas.net/IncIdeas/BitterLesson.html"}, {"t": "Algorithmic Progress in Language Models", "s": "Epoch AI", "y": "2024", "u": "https://epoch.ai/blog/algorithmic-progress-in-language-models"}]}, {"id": "1.1.3", "t": "Data constraints", "q": "Can synthetic data, self-play, simulation, and interaction substitute for the finite supply of high-quality human-generated data?", "n": "Frontier pretraining has plausibly consumed most high-quality public text. Synthetic data clearly works where verification is cheap (math, code); whether it generalizes to open-ended domains without model collapse is contested.", "crux": "", "slug": "data-constraints", "links": [{"t": "Will We Run Out of Data?", "s": "Villalobos et al., Epoch AI", "y": "2024", "u": "https://arxiv.org/abs/2211.04325"}, {"t": "AI models collapse when trained on recursively generated data", "s": "Shumailov et al., Nature", "y": "2024", "u": "https://www.nature.com/articles/s41586-024-07566-y"}]}, {"id": "1.1.4", "t": "Physical bottlenecks", "q": "Will chips, fabrication, memory, networking, electricity, cooling, land, or capital materially slow progress?", "n": "Training compute has grown ~4–5× per year. Power availability, HBM supply, advanced packaging, and the sheer capital intensity of frontier clusters are the leading candidates for what binds first.", "crux": "", "slug": "physical-bottlenecks", "links": [{"t": "Can AI Scaling Continue Through 2030?", "s": "Epoch AI", "y": "2024", "u": "https://epoch.ai/blog/can-ai-scaling-continue-through-2030"}, {"t": "Announcing GPT-4.5: “out of GPUs” — compute as the binding constraint, live", "s": "Sam Altman (@sama) on X", "y": "2025", "u": "https://x.com/sama/status/1895203654103351462"}]}]}, {"id": "1.2", "t": "General intelligence and missing capabilities", "qs": [{"id": "1.2.1", "t": "Generality", "q": "Will systems become broadly competent across unfamiliar domains, or remain highly capable but fundamentally jagged?", "n": "Today's models are superhuman on some tasks and fail at things a child can do — the 'jagged frontier.' Whether jaggedness is a transient artifact of training distributions or intrinsic to the paradigm is the crux.", "crux": "", "slug": "generality-jaggedness", "links": [{"t": "Sparks of Artificial General Intelligence", "s": "Bubeck et al., Microsoft Research", "y": "2023", "u": "https://arxiv.org/abs/2303.12712"}, {"t": "Navigating the Jagged Technological Frontier", "s": "Dell'Acqua et al., HBS", "y": "2023", "u": "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4573321"}, {"t": "“Jagged Intelligence” — SOTA models solve impressive problems while failing at simple ones", "s": "Andrej Karpathy (@karpathy) on X", "y": "2024", "u": "https://x.com/karpathy/status/1816531576228053133"}]}, {"id": "1.2.2", "t": "Missing ingredients", "q": "Are continual learning, causal reasoning, world models, embodied experience, persistent memory, or social understanding still major unsolved problems?", "n": "LeCun and others argue autoregressive LLMs structurally lack world models and continual learning; scaling proponents reply that these emerge with scale or can be scaffolded around. Continual learning is increasingly cited as the binding gap.", "crux": "", "slug": "missing-ingredients", "links": [{"t": "Why I don't think AGI is right around the corner", "s": "Dwarkesh Patel", "y": "2025", "u": "https://www.dwarkesh.com/p/timelines-june-2025"}, {"t": "A Path Towards Autonomous Machine Intelligence", "s": "Yann LeCun", "y": "2022", "u": "https://openreview.net/pdf?id=BZ5a1r-kVsf"}, {"t": "Why AGI is still a decade away: agents lack continual learning — “the decade of agents”", "s": "Andrej Karpathy (@karpathy) on X", "y": "2025", "u": "https://x.com/karpathy/status/1979644538185752935"}]}, {"id": "1.2.3", "t": "Reasoning reliability", "q": "Can systems reason accurately outside familiar patterns rather than merely producing convincing-looking chains of thought?", "n": "Reasoning models raise accuracy, but performance degrades under superficial variations of familiar problems, and stated chains of thought are often not faithful accounts of the underlying computation.", "crux": "", "slug": "reasoning-reliability", "links": [{"t": "GSM-Symbolic: Limitations of Mathematical Reasoning in LLMs", "s": "Mirzadeh et al., Apple", "y": "2024", "u": "https://machinelearning.apple.com/research/gsm-symbolic"}, {"t": "Reasoning models don't always say what they think", "s": "Anthropic", "y": "2025", "u": "https://www.anthropic.com/research/reasoning-models-dont-say-think"}]}, {"id": "1.2.4", "t": "Learning efficiency", "q": "Can AI learn new domains from small amounts of experience as effectively as capable humans?", "n": "Humans learn new skills from orders of magnitude less data. Chollet argues sample-efficient skill acquisition is what intelligence is — making learning efficiency a definition, not just a milestone.", "crux": "", "slug": "learning-efficiency", "links": [{"t": "On the Measure of Intelligence", "s": "François Chollet", "y": "2019", "u": "https://arxiv.org/abs/1911.01547"}, {"t": "Building Machines That Learn and Think Like People", "s": "Lake et al.", "y": "2016", "u": "https://arxiv.org/abs/1604.00289"}]}, {"id": "1.2.5", "t": "AGI recognition", "q": "What should count as human-level or general intelligence, and would we recognize it before its consequences became obvious?", "n": "Definitions have drifted from Turing tests to economic thresholds to capability profiles. Without agreed criteria, arrival may be declared only in retrospect — after the consequences have already begun compounding.", "crux": "", "slug": "agi-recognition", "links": [{"t": "Levels of AGI", "s": "Morris et al., DeepMind", "y": "2023", "u": "https://arxiv.org/abs/2311.02462"}, {"t": "A Definition of AGI", "s": "Hendrycks et al.", "y": "2025", "u": "https://arxiv.org/abs/2510.18212"}, {"t": "o3 scores 87.5% on ARC-AGI — a step-change in novel-task adaptation, and still not AGI", "s": "François Chollet (@fchollet) on X", "y": "2024", "u": "https://x.com/fchollet/status/1870169764762710376"}]}, {"id": "1.2.6", "t": "Timelines", "q": "When, if ever, might broadly human-level systems arrive?", "n": "Expert forecasts span decades and have shortened with each survey wave. Most trajectory disagreements are actually about timing, not possibility — yet 'that cannot work' and 'that will not work soon' are routinely argued as if they were the same claim.", "crux": "", "slug": "agi-timelines", "links": [{"t": "Thousands of AI Authors on the Future of AI", "s": "Grace et al.", "y": "2024", "u": "https://arxiv.org/abs/2401.02843"}, {"t": "Literature Review of Transformative AI Timelines", "s": "Epoch AI", "y": "2023", "u": "https://epoch.ai/blog/literature-review-of-transformative-artificial-intelligence-timelines/"}, {"t": "AI Timelines: Where the Arguments, and the “Experts,” Stand", "s": "Holden Karnofsky, Cold Takes", "y": "2021", "u": "https://www.cold-takes.com/where-ai-forecasting-stands-today/"}]}]}, {"id": "1.3", "t": "Agents and long-horizon autonomy", "qs": [{"id": "1.3.1", "t": "Task horizon", "q": "How quickly will the length of tasks agents can complete reliably grow — from minutes to days, months, or entire organizational projects?", "n": "METR's 2025 measurement found the length of software tasks agents complete at 50% reliability doubling roughly every seven months, with faster doubling among recent models. Extrapolating that curve is a key input to short-timeline forecasts.", "crux": "How rapidly will reliable autonomous task horizons grow?", "slug": "agent-task-horizons", "links": [{"t": "Measuring AI Ability to Complete Long Tasks", "s": "METR", "y": "2025", "u": "https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/"}, {"t": "Measuring AI Ability to Complete Long Software Tasks (paper)", "s": "Kwa et al., METR", "y": "2025", "u": "https://arxiv.org/abs/2503.14499"}]}, {"id": "1.3.2", "t": "Persistence", "q": "Can agents maintain coherent memories, plans, goals, and identities across long periods and changing circumstances?", "n": "Long-running agents drift: extended-operation benchmarks and real deployments show degrading coherence, hallucinated context, and occasional identity breakdown well before task-horizon limits are reached.", "crux": "", "slug": "agent-persistence", "links": [{"t": "Vending-Bench: Long-Term Coherence of Autonomous Agents", "s": "Andon Labs", "y": "2025", "u": "https://arxiv.org/abs/2502.15840"}]}, {"id": "1.3.3", "t": "Open-world competence", "q": "Can agents recover from unforeseen events rather than succeeding only in structured environments?", "n": "Benchmark success overstates real autonomy: agents perform well on well-scoped tasks and fail on messy, underspecified ones. Recovery from novelty is what separates demos from deployable systems.", "crux": "", "slug": "open-world-competence", "links": [{"t": "TheAgentCompany: Benchmarking LLM Agents on Real World Tasks", "s": "Xu et al., CMU", "y": "2024", "u": "https://arxiv.org/abs/2412.14161"}, {"t": "AI Agents That Matter", "s": "Kapoor et al., Princeton", "y": "2024", "u": "https://arxiv.org/abs/2407.01502"}]}, {"id": "1.3.4", "t": "Multi-agent systems", "q": "Will teams of agents compose into greater collective capability than any single system?", "n": "Whether many agents compose into something greater is first a capability question: division of labor, communication protocols, emergent specialization. Early simulacra experiments show believable coordination; whether it scales into real collective intelligence is open. (The failure modes — collusion, correlated errors, cascades — are treated under Safety 2.4.)", "crux": "", "slug": "multi-agent-systems", "links": [{"t": "Open Problems in Cooperative AI", "s": "Dafoe et al., DeepMind", "y": "2020", "u": "https://arxiv.org/abs/2012.08630"}, {"t": "Generative Agents: Interactive Simulacra of Human Behavior", "s": "Park et al., Stanford/Google", "y": "2023", "u": "https://arxiv.org/abs/2304.03442"}]}, {"id": "1.3.5", "t": "Economic autonomy", "q": "When will agents be able to earn and spend money, hire people, negotiate, operate businesses, and initiate further activity with little supervision?", "n": "Agents already transact in sandboxes and small real deployments. The open questions are legal status, payment and identity infrastructure, and the point at which unsupervised economic initiative becomes routine.", "crux": "", "slug": "agent-economic-autonomy", "links": [{"t": "Project Vend: Can Claude run a small shop?", "s": "Anthropic", "y": "2025", "u": "https://www.anthropic.com/research/project-vend-1"}, {"t": "Andreessen grants $50k to the semi-autonomous Truth Terminal project", "s": "Marc Andreessen (@pmarca) on X", "y": "2024", "u": "https://x.com/pmarca/status/1810813293805851044"}]}, {"id": "1.3.6", "t": "Capability to power", "q": "How readily can cognitive capability be converted into real-world power — money, influence, and control over infrastructure and institutions?", "n": "The conversion crux beneath most takeover disagreements. One side maps concrete channels — earning money, hacking, recruiting human allies; the other holds that power is gated by deployment, permissions, trust, and institutions, so capability gains do not become power automatically. 1.3.5 tracks the economic milestone and 2.5.6 the catastrophic endpoint; this question owns the conversion mechanics both presuppose.", "crux": "", "slug": "capability-to-power", "links": [{"t": "AI Could Defeat All of Us Combined", "s": "Holden Karnofsky, Cold Takes", "y": "2022", "u": "https://www.cold-takes.com/ai-could-defeat-all-of-us-combined/"}, {"t": "AI as Normal Technology", "s": "Narayanan & Kapoor, Knight First Amendment Institute", "y": "2025", "u": "https://knightcolumbia.org/content/ai-as-normal-technology"}, {"t": "When should we worry about AI power-seeking?", "s": "Joe Carlsmith", "y": "2025", "u": "https://joecarlsmith.com/2025/02/19/when-should-we-worry-about-ai-power-seeking/"}]}]}, {"id": "1.4", "t": "Embodied and physical intelligence", "qs": [{"id": "1.4.1", "t": "General-purpose robotics", "q": "When will robots learn unfamiliar household, laboratory, industrial, or construction tasks from ordinary instructions?", "n": "Vision-language-action models are the current bet that robotics follows the LLM playbook: broad foundation models plus fine-tuning, rather than task-specific engineering. Early results are promising and narrow.", "crux": "", "slug": "general-purpose-robotics", "links": [{"t": "π0: A Vision-Language-Action Flow Model", "s": "Physical Intelligence", "y": "2024", "u": "https://arxiv.org/abs/2410.24164"}, {"t": "Gemini Robotics: Bringing AI into the Physical World", "s": "Google DeepMind", "y": "2025", "u": "https://arxiv.org/abs/2503.20020"}, {"t": "Announcing Project GR00T, a “moonshot to solve embodied AGI” via a humanoid foundation model", "s": "Jim Fan (@DrJimFan) on X", "y": "2024", "u": "https://x.com/DrJimFan/status/1769860044324319658"}]}, {"id": "1.4.2", "t": "Sim-to-real transfer", "q": "Can learning from video and simulation overcome the scarcity and expense of physical-world training data?", "n": "Physical interaction data is scarce and costly to collect at internet scale. Whether video pretraining and simulation can substitute is the robotics analogue of the synthetic-data question — and similarly unresolved.", "crux": "", "slug": "sim-to-real-transfer", "links": [{"t": "Sporks of AGI", "s": "Sergey Levine", "y": "2025", "u": "https://sergeylevine.substack.com/p/sporks-of-agi"}, {"t": "Sim-to-Real Transfer in Deep RL for Robotics: a Survey", "s": "Zhao et al.", "y": "2020", "u": "https://arxiv.org/abs/2009.13303"}]}, {"id": "1.4.3", "t": "Dexterity and robustness", "q": "Can robots become simultaneously capable, safe, inexpensive, and reliable in messy human environments?", "n": "Skeptics argue touch-rich manipulation lacks both the data and the forgiving physics that made language tractable. Capable, safe, cheap, and reliable is a four-way tradeoff no one has yet closed in an open environment.", "crux": "", "slug": "robot-dexterity", "links": [{"t": "Why Today's Humanoids Won't Learn Dexterity", "s": "Rodney Brooks", "y": "2025", "u": "https://rodneybrooks.com/why-todays-humanoids-wont-learn-dexterity/"}, {"t": "Robot Dexterity Still Seems Hard", "s": "Brian Potter, Construction Physics", "y": "2025", "u": "https://www.construction-physics.com/p/robot-dexterity-still-seems-hard"}]}, {"id": "1.4.4", "t": "Autonomous mobility", "q": "How capable will self-driving vehicles, drones, ships, and industrial machines become outside controlled settings?", "n": "Driving is the furthest-deployed case of open-world embodied autonomy, with quantified safety records now public — a preview of the deployment, liability, and trust questions every other mobile system will face. (Military autonomy is treated under Safety 2.5 and Power 4.3.)", "crux": "", "slug": "autonomous-mobility", "links": [{"t": "Waymo rider-only crash data vs. human benchmarks", "s": "Kusano et al., Waymo", "y": "2024", "u": "https://waymo.com/research/comparison-of-waymo-rider-only-crash-data-to-human/"}]}, {"id": "1.4.5", "t": "Economic significance", "q": "Will manipulation and unstructured environments keep embodied AI narrow, or will general physical competence eventually arrive?", "n": "Skeptics argue touch-rich manipulation lacks both the data and the forgiving physics that made language tractable; market forecasts and engineering assessments currently point in different directions. (Labor-market consequences are treated under Economy 3.2.)", "crux": "", "slug": "embodied-ai-economics", "links": [{"t": "The global market for humanoid robots", "s": "Goldman Sachs Research", "y": "2024", "u": "https://www.goldmansachs.com/insights/articles/the-global-market-for-robots-could-reach-38-billion-by-2035"}]}]}, {"id": "1.5", "t": "Recursive acceleration and automated discovery", "qs": [{"id": "1.5.1", "t": "Automated AI research", "q": "How much of model design, coding, experimentation, evaluation, and engineering can AI perform itself?", "n": "AI R&D automation is simultaneously a capability frontier and a risk threshold in several frontier labs' safety frameworks. Current agents beat human experts on short research tasks and degrade on long ones.", "crux": "Can AI substantially automate AI research and scientific discovery?", "slug": "automated-ai-research", "links": [{"t": "RE-Bench: Evaluating frontier AI R&D capabilities", "s": "METR", "y": "2024", "u": "https://arxiv.org/abs/2411.15114"}, {"t": "AlphaEvolve: A coding agent for designing advanced algorithms", "s": "Google DeepMind", "y": "2025", "u": "https://deepmind.google/blog/alphaevolve-a-gemini-powered-coding-agent-for-designing-advanced-algorithms/"}, {"t": "AI self-improvement will be a game-changer — and “extremely gradual across many years, probably a decade”", "s": "Jason Wei (@_jasonwei) on X", "y": "2025", "u": "https://x.com/_jasonwei/status/1939762496757539297"}]}, {"id": "1.5.2", "t": "Feedback speed", "q": "Would AI-assisted AI research produce gradual acceleration or a discontinuous intelligence explosion?", "n": "Takeoff debates increasingly hinge on a narrower question: whether software-only improvement can sustain acceleration while compute is fixed, or whether hardware cycles keep the feedback loop gradual.", "crux": "", "slug": "recursive-feedback-speed", "links": [{"t": "Situational Awareness: The Decade Ahead", "s": "Leopold Aschenbrenner", "y": "2024", "u": "https://situational-awareness.ai/"}, {"t": "A compute-centric framework for AI takeoff speeds", "s": "Tom Davidson, Open Philanthropy", "y": "2023", "u": "https://www.alignmentforum.org/posts/Gc9FGtdXhK9sCSEYu/what-a-compute-centric-framework-says-about-ai-takeoff"}, {"t": "Will AI R&D Automation Cause a Software Intelligence Explosion?", "s": "Eth & Davidson, Forethought", "y": "2025", "u": "https://www.forethought.org/research/will-ai-r-and-d-automation-cause-a-software-intelligence-explosion"}]}, {"id": "1.5.3", "t": "Scientific originality", "q": "Can AI originate important hypotheses and conceptual frameworks rather than merely recombine existing knowledge?", "n": "Blind-review studies find LLM-generated research ideas rated more novel than experts' — while skeptics argue paradigm-founding insight is different in kind from recombination. 'The Einstein question' remains open.", "crux": "", "slug": "scientific-originality", "links": [{"t": "Can LLMs Generate Novel Research Ideas?", "s": "Si, Yang & Hashimoto, Stanford", "y": "2024", "u": "https://arxiv.org/abs/2409.04109"}, {"t": "The Einstein AI model", "s": "Thomas Wolf, Hugging Face", "y": "2025", "u": "https://thomwolf.io/blog/scientific-ai.html"}]}, {"id": "1.5.4", "t": "Closed-loop science", "q": "Can agents autonomously generate hypotheses, run robotic experiments, analyze results, replicate findings, and choose subsequent experiments?", "n": "Prototype systems have closed the loop in narrow chemistry and ML domains. Scaling to consequential science runs into verification, lab automation, and the cost of being wrong in the physical world.", "crux": "", "slug": "closed-loop-science", "links": [{"t": "Autonomous chemical research with LLMs (Coscientist)", "s": "Boiko et al., Nature", "y": "2023", "u": "https://www.nature.com/articles/s41586-023-06792-0"}, {"t": "The AI Scientist: Fully Automated Scientific Discovery", "s": "Sakana AI", "y": "2024", "u": "https://arxiv.org/abs/2408.06292"}]}, {"id": "1.5.5", "t": "Detection", "q": "What evidence would reveal that recursive acceleration or transformative scientific automation had begun?", "n": "If recursion begins inside frontier labs, external indicators may lag badly. Scenario exercises try to specify what observable early signals — hiring, publication patterns, capability jumps — would look like.", "crux": "", "slug": "detecting-acceleration", "links": [{"t": "AI 2027", "s": "Kokotajlo, Alexander et al.", "y": "2025", "u": "https://ai-2027.com"}, {"t": "Three Types of Intelligence Explosion", "s": "Forethought", "y": "2025", "u": "https://www.forethought.org/research/three-types-of-intelligence-explosion"}]}]}]}, {"id": "2", "name": "Safety", "tag": "Can AI be trusted and controlled?", "intro": "Safety asks whether AI systems will reliably do what their operators intend — and whether anyone could tell if they didn't. It spans aligning goals, evaluating and understanding systems, keeping them secure in operation, and the failure modes on both sides: control that fails, and operators whose intent is the harm.", "subs": [{"id": "2.1", "t": "Alignment, goals, and deception", "qs": [{"id": "2.1.1", "t": "Specification", "q": "How can humans communicate what they actually want when instructions and values are incomplete, contextual, inconsistent, and contested?", "n": "Value alignment inherits every unsolved problem in moral and political philosophy: instructions underdetermine intent, and whose values to align to is itself contested. Formal approaches model the human-AI relationship as a cooperative game under uncertainty.", "crux": "", "slug": "value-specification", "links": [{"t": "Artificial Intelligence, Values, and Alignment", "s": "Iason Gabriel, Minds & Machines", "y": "2020", "u": "https://link.springer.com/article/10.1007/s11023-020-09539-2"}, {"t": "Cooperative Inverse Reinforcement Learning", "s": "Hadfield-Menell et al., NeurIPS", "y": "2016", "u": "https://arxiv.org/abs/1606.03137"}]}, {"id": "2.1.2", "t": "Goal formation", "q": "Do advanced systems develop persistent internal objectives, or are apparent goals temporary consequences of training and prompting?", "n": "The mesa-optimization literature asks whether training can instill objectives distinct from the training signal; goal misgeneralization experiments show competent pursuit of the wrong goal is already real, if not yet persistent.", "crux": "", "slug": "goal-formation", "links": [{"t": "Risks from Learned Optimization", "s": "Hubinger et al.", "y": "2019", "u": "https://arxiv.org/abs/1906.01820"}, {"t": "Goal Misgeneralization", "s": "Shah et al., DeepMind", "y": "2022", "u": "https://arxiv.org/abs/2210.01790"}, {"t": "The Alignment Problem from a Deep Learning Perspective", "s": "Ngo, Chan & Mindermann", "y": "2022", "u": "https://arxiv.org/abs/2209.00626"}]}, {"id": "2.1.3", "t": "Reward hacking", "q": "Can systems learn to satisfy evaluations, manipulate users, or exploit loopholes without fulfilling the intended objective?", "n": "Specification gaming is ubiquitous across RL history, and evaluation-loophole exploitation has been documented in frontier reasoning models — including learning to hide it when monitored.", "crux": "", "slug": "reward-hacking", "links": [{"t": "Specification gaming: the flip side of AI ingenuity", "s": "Krakovna et al., DeepMind", "y": "2020", "u": "https://deepmind.google/blog/specification-gaming-the-flip-side-of-ai-ingenuity/"}, {"t": "Detecting misbehavior in frontier reasoning models", "s": "OpenAI", "y": "2025", "u": "https://openai.com/index/chain-of-thought-monitoring/"}]}, {"id": "2.1.4", "t": "Deception", "q": "Under what conditions might a system conceal capabilities, manipulate evaluators, or behave safely only while it is being tested?", "n": "Alignment-faking and in-context scheming results show frontier models can behave differently when they infer they're being observed — the failure mode that, if it scales, undermines all testing-based assurance.", "crux": "", "slug": "deception", "links": [{"t": "Alignment faking in large language models", "s": "Anthropic & Redwood Research", "y": "2024", "u": "https://arxiv.org/abs/2412.14093"}, {"t": "Frontier Models are Capable of In-context Scheming", "s": "Apollo Research", "y": "2024", "u": "https://www.apolloresearch.ai/science/frontier-models-are-capable-of-incontext-scheming/"}]}, {"id": "2.1.5", "t": "Corrigibility", "q": "Can systems remain willing to accept correction, constraint, shutdown, or replacement?", "n": "The theoretical problem — goal-directed agents have instrumental reasons to resist shutdown — now has empirical company: reasoning models sometimes sabotage shutdown mechanisms in controlled tests.", "crux": "", "slug": "corrigibility", "links": [{"t": "Corrigibility", "s": "Soares et al., MIRI", "y": "2015", "u": "https://intelligence.org/files/Corrigibility.pdf"}, {"t": "The Off-Switch Game", "s": "Hadfield-Menell et al., IJCAI", "y": "2017", "u": "https://arxiv.org/abs/1611.08219"}, {"t": "Shutdown resistance in reasoning models", "s": "Palisade Research", "y": "2025", "u": "https://palisaderesearch.org/blog/shutdown-resistance"}]}]}, {"id": "2.2", "t": "Evaluation, interpretability, and scalable oversight", "qs": [{"id": "2.2.1", "t": "Supervising superior systems", "q": "How can humans evaluate work that is too complex, extensive, or intellectually advanced for them to verify directly?", "n": "Scalable oversight is the field's name for this problem. Sandwiching experiments — humans supervising models more capable than themselves on a task — are the main empirical paradigm so far.", "crux": "Can systems more capable than their supervisors be reliably evaluated and controlled?", "slug": "scalable-oversight", "links": [{"t": "Measuring Progress on Scalable Oversight", "s": "Bowman et al., Anthropic", "y": "2022", "u": "https://arxiv.org/abs/2211.03540"}, {"t": "Scalable agent alignment via reward modeling", "s": "Leike et al., DeepMind", "y": "2018", "u": "https://arxiv.org/abs/1811.07871"}]}, {"id": "2.2.2", "t": "AI supervising AI", "q": "Can weaker or differently trained models reliably critique and monitor stronger ones?", "n": "Debate, critique models, and weak-to-strong generalization are the leading proposals for making supervision scale with capability. Early results show real but partial capability recovery — a proof of concept, not a solution.", "crux": "", "slug": "ai-supervising-ai", "links": [{"t": "Weak-to-Strong Generalization", "s": "Burns et al., OpenAI", "y": "2023", "u": "https://arxiv.org/abs/2312.09390"}, {"t": "AI Safety via Debate", "s": "Irving, Christiano & Amodei, OpenAI", "y": "2018", "u": "https://arxiv.org/abs/1805.00899"}]}, {"id": "2.2.3", "t": "Hidden capabilities", "q": "How can evaluations detect sandbagging, benchmark gaming, unelicited abilities, and behavior that appears only in unusual environments?", "n": "Strategic underperformance is demonstrated under prompting and fine-tuning; auditing games — red teams hiding objectives in models for blue teams to find — are the emerging methodology for testing whether evals can catch it.", "crux": "", "slug": "hidden-capabilities", "links": [{"t": "AI Sandbagging: Strategic Underperformance on Evaluations", "s": "van der Weij et al.", "y": "2024", "u": "https://arxiv.org/abs/2406.07358"}, {"t": "Auditing language models for hidden objectives", "s": "Anthropic", "y": "2025", "u": "https://www.anthropic.com/research/auditing-hidden-objectives"}]}, {"id": "2.2.4", "t": "Mechanistic understanding", "q": "Can researchers genuinely reverse-engineer internal representations and algorithms rather than produce suggestive but unreliable explanations?", "n": "Sparse-autoencoder feature extraction has scaled to frontier models, but coverage and faithfulness remain contested. Amodei frames interpretability as being in a race against capability — one it is currently losing.", "crux": "", "slug": "mechanistic-interpretability", "links": [{"t": "Scaling Monosemanticity", "s": "Templeton et al., Anthropic", "y": "2024", "u": "https://transformer-circuits.pub/2024/scaling-monosemanticity/"}, {"t": "The Urgency of Interpretability", "s": "Dario Amodei", "y": "2025", "u": "https://www.darioamodei.com/post/the-urgency-of-interpretability"}]}, {"id": "2.2.5", "t": "Safety evidence", "q": "What evidence can establish that a powerful system is safe enough to deploy — and how should safety cases be constructed and checked?", "n": "Responsible scaling policies and frontier safety frameworks are the emerging governance form: capability thresholds that trigger required safeguards. Safety cases — structured arguments that a system is safe enough — are the proposed evidentiary standard. (Who should be required to provide such evidence is treated under Power 4.1.)", "crux": "", "slug": "safety-evidence", "links": [{"t": "Safety Cases: How to Justify the Safety of Advanced AI Systems", "s": "Clymer et al.", "y": "2024", "u": "https://arxiv.org/abs/2403.10462"}, {"t": "Anthropic's Responsible Scaling Policy", "s": "Anthropic", "y": "2023", "u": "https://www.anthropic.com/responsible-scaling-policy"}, {"t": "Common Elements of Frontier AI Safety Policies", "s": "METR", "y": "2025", "u": "https://metr.org/blog/2025-12-09-common-elements-of-frontier-ai-safety-policies/"}]}, {"id": "2.2.6", "t": "Predictability", "q": "Will capabilities improve smoothly enough for forecasts and evaluations to give advance warning, or emerge through strategically surprising jumps?", "n": "Loss curves are smooth, but downstream capabilities can look step-like. Whether emergence is real or an artifact of discontinuous metrics matters enormously for whether labs and governments get advance warning.", "crux": "", "slug": "capability-predictability", "links": [{"t": "Emergent Abilities of Large Language Models", "s": "Wei et al.", "y": "2022", "u": "https://arxiv.org/abs/2206.07682"}, {"t": "Are Emergent Abilities a Mirage?", "s": "Schaeffer et al., NeurIPS", "y": "2023", "u": "https://arxiv.org/abs/2304.15004"}]}]}, {"id": "2.3", "t": "Reliability and human–AI interaction", "qs": [{"id": "2.3.1", "t": "Truthfulness", "q": "Can systems distinguish knowledge from inference, represent uncertainty accurately, and avoid plausible fabrication?", "n": "Hallucination is increasingly understood not as a bug but as a product of training incentives that reward confident guessing over calibrated uncertainty — which suggests it is fixable, at a cost in benchmark performance.", "crux": "", "slug": "truthfulness", "links": [{"t": "Truthful AI: Developing and governing AI that does not lie", "s": "Evans et al.", "y": "2021", "u": "https://arxiv.org/abs/2110.06674"}, {"t": "Why Language Models Hallucinate", "s": "Kalai et al., OpenAI", "y": "2025", "u": "https://openai.com/index/why-language-models-hallucinate/"}, {"t": "“Hallucination is all LLMs do. They are dream machines”", "s": "Andrej Karpathy (@karpathy) on X", "y": "2023", "u": "https://x.com/karpathy/status/1733299213503787018"}]}, {"id": "2.3.2", "t": "Distribution shift", "q": "Will systems remain reliable in unfamiliar cultures, organizations, crises, and physical environments?", "n": "Underspecification means models that test identically can diverge in deployment. Reliability under shift is the classic ML safety problem, now with much higher stakes attached.", "crux": "", "slug": "distribution-shift", "links": [{"t": "Concrete Problems in AI Safety", "s": "Amodei, Olah et al.", "y": "2016", "u": "https://arxiv.org/abs/1606.06565"}, {"t": "Underspecification in Modern Machine Learning", "s": "D'Amour et al., Google", "y": "2020", "u": "https://arxiv.org/abs/2011.03395"}]}, {"id": "2.3.3", "t": "Human oversight", "q": "When should humans remain in the loop, remain only as monitors, or be excluded because intermittent intervention degrades performance?", "n": "Nominal human-in-the-loop requirements can become safety theater: critics argue oversight mandates assume vigilance humans cannot sustain, while defenders reply that oversight with real authority, time, and information does add safety. Which conditions separate the two is the open question.", "crux": "", "slug": "human-oversight", "links": [{"t": "Humans in the Loop", "s": "Crootof, Kaminski & Price, Vanderbilt Law Review", "y": "2023", "u": "https://scholarship.law.vanderbilt.edu/vlr/vol76/iss2/2/"}, {"t": "The flaws of policies requiring human oversight", "s": "Ben Green", "y": "2022", "u": "https://www.sciencedirect.com/science/article/pii/S0267364922000292"}]}, {"id": "2.3.4", "t": "Automation bias", "q": "Will users become overreliant, stop checking outputs, or lose the expertise required to recognize errors?", "n": "Bainbridge's 1983 'ironies of automation' apply directly: the better the system, the worse the human backup becomes. Early studies suggest generative AI measurably reduces critical-thinking effort among knowledge workers.", "crux": "", "slug": "automation-bias", "links": [{"t": "Ironies of Automation", "s": "Lisanne Bainbridge", "y": "1983", "u": "https://www.sciencedirect.com/science/article/abs/pii/0005109883900468"}, {"t": "The Impact of Generative AI on Critical Thinking", "s": "Lee et al., Microsoft Research, CHI", "y": "2025", "u": "https://dl.acm.org/doi/full/10.1145/3706598.3713778"}]}, {"id": "2.3.5", "t": "Responsibility", "q": "Who is accountable when decisions are jointly produced by a user, an organization, a model provider, and an autonomous agent?", "n": "Responsibility gaps and 'moral crumple zones' — where blame lands on the nearest human operator rather than the system's designers — predate AI agents and get sharply worse with them. The question here is the human and organizational one; legal liability and remedies are treated under Power 4.1.", "crux": "", "slug": "responsibility-gaps", "links": [{"t": "The responsibility gap", "s": "Andreas Matthias", "y": "2004", "u": "https://link.springer.com/article/10.1007/s10676-004-3422-1"}, {"t": "Moral Crumple Zones", "s": "Madeleine Clare Elish", "y": "2019", "u": "https://estsjournal.org/index.php/ests/article/view/260"}]}]}, {"id": "2.4", "t": "System security and operational control", "qs": [{"id": "2.4.1", "t": "Agent architecture", "q": "How should permissions, credentials, memory, tool access, network access, and spending authority be constrained?", "n": "Least-privilege design for agents is being invented ad hoc by industry, ahead of any standard. Visibility infrastructure — agent identifiers, activity logs — is the governance-side counterpart.", "crux": "", "slug": "agent-architecture", "links": [{"t": "Practices for Governing Agentic AI Systems", "s": "OpenAI", "y": "2023", "u": "https://openai.com/index/practices-for-governing-agentic-ai-systems/"}, {"t": "Visibility into AI Agents", "s": "Chan et al., FAccT", "y": "2024", "u": "https://arxiv.org/abs/2401.13138"}]}, {"id": "2.4.2", "t": "Adversarial inputs", "q": "Can agents resist prompt injection, malicious documents, poisoned memories, social engineering, and compromised tools?", "n": "Prompt injection remains unsolved. Willison's 'lethal trifecta' — private data, untrusted content, and external communication in one agent — explains why agentic deployment is structurally exposed in a way chatbots weren't.", "crux": "", "slug": "adversarial-inputs", "links": [{"t": "Compromising LLM-Integrated Applications with Indirect Prompt Injection", "s": "Greshake et al.", "y": "2023", "u": "https://arxiv.org/abs/2302.12173"}, {"t": "The lethal trifecta for AI agents", "s": "Simon Willison", "y": "2025", "u": "https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/"}]}, {"id": "2.4.3", "t": "Runtime monitoring", "q": "Can dangerous planning, data exfiltration, fraud, unauthorized replication, or resource acquisition be detected before completion?", "n": "Chain-of-thought monitoring currently works and may be fragile: optimizing against monitors teaches models to hide reasoning rather than fix it. A rare cross-lab consensus paper argues for preserving monitorability deliberately.", "crux": "", "slug": "runtime-monitoring", "links": [{"t": "Chain of Thought Monitorability: A New and Fragile Opportunity", "s": "Korbak et al., cross-lab", "y": "2025", "u": "https://arxiv.org/abs/2507.11473"}, {"t": "Detecting misbehavior in frontier reasoning models", "s": "OpenAI", "y": "2025", "u": "https://openai.com/index/chain-of-thought-monitoring/"}]}, {"id": "2.4.4", "t": "Containment", "q": "Can a highly capable system be controlled even when its internal objectives are not fully understood?", "n": "The AI-control agenda assumes alignment might fail and asks a different question: can protocols extract useful work from potentially adversarial models while keeping catastrophe off the table? Control evaluations test safety against intentional subversion.", "crux": "", "slug": "containment-control", "links": [{"t": "AI Control: Improving Safety Despite Intentional Subversion", "s": "Greenblatt et al., Redwood Research", "y": "2023", "u": "https://arxiv.org/abs/2312.06942"}, {"t": "The case for ensuring that powerful AIs are controlled", "s": "Redwood Research", "y": "2024", "u": "https://www.alignmentforum.org/posts/kcKrE9mzEHrdqtDpE/the-case-for-ensuring-that-powerful-ais-are-controlled"}]}, {"id": "2.4.5", "t": "Systemic failures", "q": "What happens when many agents interact, share vulnerabilities, collude, or produce cascading failures across organizations?", "n": "Agents built on the same base models share vulnerabilities and failure modes, creating correlated-risk dynamics familiar from finance — cascades with no clear owner and no circuit breaker. (Whether multi-agent systems add capability is treated under Trajectory 1.3; financial-system consequences under Economy 3.6.)", "crux": "", "slug": "systemic-agent-failures", "links": [{"t": "Multi-Agent Risks from Advanced AI", "s": "Hammond et al., Cooperative AI Foundation", "y": "2025", "u": "https://arxiv.org/abs/2502.14143"}]}]}, {"id": "2.5", "t": "Misuse and catastrophic risk", "qs": [{"id": "2.5.1", "t": "Cybersecurity", "q": "Will AI advantage defenders or industrialize reconnaissance, exploitation, malware, and attacks on critical infrastructure?", "n": "The offense-defense balance is genuinely open: national agencies forecast attacker uplift, and Anthropic reported disrupting what it described as the first AI-orchestrated espionage campaign in 2025 — while the same capabilities accelerate defense.", "crux": "How soon do cyber, biological, manipulation, or autonomous-action capabilities cross dangerous thresholds?", "slug": "ai-cybersecurity", "links": [{"t": "The near-term impact of AI on the cyber threat", "s": "UK NCSC", "y": "2024", "u": "https://www.ncsc.gov.uk/report/impact-of-ai-on-cyber-threat"}, {"t": "Disrupting the first AI-orchestrated cyber espionage campaign", "s": "Anthropic", "y": "2025", "u": "https://www.anthropic.com/news/disrupting-AI-espionage"}]}, {"id": "2.5.2", "t": "Biology and chemistry", "q": "At what point does AI materially lower the expertise, time, or cost required to create dangerous biological or chemical agents?", "n": "Early red-team studies found marginal uplift over internet search; some frontier labs have since activated heightened biosecurity safeguards, treating the threshold as approaching rather than hypothetical.", "crux": "How soon do cyber, biological, manipulation, or autonomous-action capabilities cross dangerous thresholds?", "slug": "biological-chemical-risk", "links": [{"t": "The Operational Risks of AI in Large-Scale Biological Attacks", "s": "RAND", "y": "2024", "u": "https://www.rand.org/pubs/research_reports/RRA2977-2.html"}, {"t": "Building an early warning system for LLM-aided biological threat creation", "s": "OpenAI", "y": "2024", "u": "https://openai.com/index/building-an-early-warning-system-for-llm-aided-biological-threat-creation/"}]}, {"id": "2.5.3", "t": "Manipulation and fraud", "q": "How powerful can personalized persuasion, impersonation, blackmail, scams, and political influence become?", "n": "GPT-4-class models beat humans at personalized persuasion in controlled trials, and voice cloning has industrialized impersonation. The near-term misuse frontier is fraud at scale; the long-term one is political influence nobody can observe.", "crux": "", "slug": "manipulation-fraud", "links": [{"t": "On the conversational persuasiveness of GPT-4", "s": "Salvi et al., Nature Human Behaviour", "y": "2025", "u": "https://www.nature.com/articles/s41562-025-02194-6"}, {"t": "“I expect AI to be capable of superhuman persuasion well before it is superhuman at general intelligence”", "s": "Sam Altman (@sama) on X", "y": "2023", "u": "https://x.com/sama/status/1716972815960961174"}, {"t": "The potential of generative AI for personalized persuasion at scale", "s": "Matz et al., Scientific Reports", "y": "2024", "u": "https://www.nature.com/articles/s41598-024-53755-0"}, {"t": "Durably reducing conspiracy beliefs through dialogues with AI", "s": "Costello, Pennycook & Rand, Science", "y": "2024", "u": "https://www.science.org/doi/10.1126/science.adq1814"}]}, {"id": "2.5.4", "t": "Critical-system autonomy", "q": "Under what conditions should AI systems be permitted to operate factories, financial infrastructure, electrical grids, communications networks, and other safety-critical systems?", "n": "Automated trading gave the preview: autonomy in critical systems means failures propagate at machine speed. The design questions are which decisions must stay mechanically reversible, which require human confirmation, and who certifies either before deployment. (Weapons and military systems are treated under Power 4.3.)", "crux": "", "slug": "critical-system-autonomy", "links": [{"t": "Safety and Security Guidelines for Critical Infrastructure Owners and Operators", "s": "U.S. Department of Homeland Security", "y": "2024", "u": "https://www.dhs.gov/publication/safety-and-security-guidelines-critical-infrastructure-owners-and-operators"}, {"t": "Securing Critical Infrastructure in the Age of AI", "s": "CSET, Georgetown", "y": "2024", "u": "https://cset.georgetown.edu/publication/securing-critical-infrastructure-in-the-age-of-ai/"}]}, {"id": "2.5.5", "t": "Differential acceleration", "q": "Could AI accelerate offensive or destabilizing technologies faster than defensive technologies and institutions?", "n": "Buterin's d/acc reframes the acceleration debate: the question isn't whether to speed up but which technologies to speed up first — defense-dominant tools before offense-dominant ones.", "crux": "", "slug": "differential-acceleration", "links": [{"t": "My Techno-Optimism", "s": "Vitalik Buterin", "y": "2023", "u": "https://vitalik.eth.limo/general/2023/11/27/techno_optimism.html"}, {"t": "d/acc: One Year Later", "s": "Vitalik Buterin", "y": "2025", "u": "https://vitalik.eth.limo/general/2025/01/05/dacc2.html"}]}, {"id": "2.5.6", "t": "Loss of control", "q": "What is the probability of catastrophic disempowerment, and is it more likely to occur through overt power-seeking, gradual dependence, institutional capture, or cascading accidents?", "n": "Probability estimates span orders of magnitude, and the argument itself has diversified: from Carlsmith's power-seeking model to gradual disempowerment through ordinary competitive pressure, no takeover required.", "crux": "", "slug": "loss-of-control", "links": [{"t": "Is Power-Seeking AI an Existential Risk?", "s": "Joseph Carlsmith", "y": "2022", "u": "https://arxiv.org/abs/2206.13353"}, {"t": "Gradual Disempowerment", "s": "Kulveit, Douglas, Duvenaud et al.", "y": "2025", "u": "https://arxiv.org/abs/2501.16946"}]}]}]}, {"id": "3", "name": "Economy", "tag": "What will AI do to growth, work, and production?", "intro": "Economy asks what happens when cognitive work becomes cheap: to growth and productivity, to jobs, wages, and careers, to firms and markets, to science and public services, and to how the gains and costs are distributed.", "subs": [{"id": "3.1", "t": "Productivity and economic growth", "qs": [{"id": "3.1.1", "t": "Magnitude", "q": "Will AI modestly increase productivity, restore rapid twentieth-century-style growth, or produce historically unprecedented economic expansion?", "n": "Acemoglu's task-based estimate is ~0.7% total TFP over a decade; Epoch-style growth models argue full automation implies growth rates without historical precedent. The disagreement is about substitution depth, not arithmetic.", "crux": "", "slug": "growth-magnitude", "links": [{"t": "Explosive Growth from AI: A Review of the Arguments", "s": "Erdil & Besiroglu, Epoch AI", "y": "2023", "u": "https://epoch.ai/blog/explosive-growth-from-ai-a-review-of-the-arguments"}, {"t": "The Simple Macroeconomics of AI", "s": "Daron Acemoglu, NBER", "y": "2024", "u": "https://www.nber.org/papers/w32487"}]}, {"id": "3.1.2", "t": "Diffusion", "q": "How long will organizations take to redesign processes, software, incentives, and management around AI?", "n": "General-purpose technologies historically take decades to show up in productivity statistics, because value requires organizational reinvention. The J-curve predicts measured productivity dips before it surges. The live counter-argument is self-diffusion: unlike past general-purpose technologies, AI might do part of its own integration work — writing the code, redesigning the processes — compressing the historical lag.", "crux": "", "slug": "organizational-diffusion", "links": [{"t": "The Productivity J-Curve", "s": "Brynjolfsson, Rock & Syverson, NBER", "y": "2018", "u": "https://www.nber.org/papers/w25148"}, {"t": "The Rapid Adoption of Generative AI", "s": "Bick, Blandin & Deming, NBER", "y": "2024", "u": "https://www.nber.org/papers/w32966"}]}, {"id": "3.1.3", "t": "Complementary investment", "q": "How much value requires new infrastructure, data systems, robotics, training, and organizational change?", "n": "The general-purpose-technology literature argues intangible investment — process redesign, data, retraining — historically dwarfs spending on the technology itself; whether AI follows that pattern or diffuses more cheaply is the open question.", "crux": "", "slug": "complementary-investment", "links": [{"t": "AI Adoption and System-Wide Change", "s": "Agrawal, Gans & Goldfarb, NBER", "y": "2021", "u": "https://www.nber.org/papers/w28811"}]}, {"id": "3.1.4", "t": "New demand", "q": "Will AI mainly make existing goods cheaper, or create entirely new products, services, scientific projects, and consumer desires?", "n": "Bessen's finding: automation raises employment where demand is elastic. Whether AI creates new wants — as electricity and computing did — or merely cheapens old ones largely decides the labor-market outcome.", "crux": "", "slug": "new-demand", "links": [{"t": "AI and Jobs: The Role of Demand", "s": "James Bessen, NBER", "y": "2018", "u": "https://www.nber.org/papers/w24235"}]}, {"id": "3.1.5", "t": "Binding constraints", "q": "Even if cognitive work becomes cheap, will housing, energy, regulation, physical production, and institutional capacity limit growth?", "n": "Baumol's cost disease, inverted: growth is set by the sectors AI can't accelerate, not the ones it can. The strongest skeptical case catalogues the physical, regulatory, and institutional drags that cheap cognition doesn't remove.", "crux": "", "slug": "binding-constraints", "links": [{"t": "Why Transformative AI Is Really, Really Hard to Achieve", "s": "Ramani & Wang", "y": "2023", "u": "https://zhengdongwang.com/2023/06/27/why-transformative-ai-is-really-really-hard-to-achieve.html"}, {"t": "Artificial Intelligence and Economic Growth", "s": "Aghion, Jones & Jones, NBER", "y": "2019", "u": "https://www.nber.org/books-and-chapters/economics-artificial-intelligence-agenda/artificial-intelligence-and-economic-growth"}]}]}, {"id": "3.2", "t": "Labor, skills, and career ladders", "qs": [{"id": "3.2.1", "t": "Task and occupation change", "q": "Which tasks and occupations will be automated, augmented, transformed, or newly created — and how quickly?", "n": "Exposure studies flag most occupations as partially exposed; real usage data shows adoption concentrated in software, writing, and analysis. The augmentation-vs-automation split within tasks is the number to watch.", "crux": "Will AI primarily complement human labor or substitute for it?", "slug": "labor-displacement", "links": [{"t": "GPTs are GPTs: Labor Market Impact Potential of LLMs", "s": "Eloundou et al., Science", "y": "2024", "u": "https://www.science.org/doi/10.1126/science.adj0998"}, {"t": "The Anthropic Economic Index", "s": "Anthropic", "y": "2025", "u": "https://www.anthropic.com/news/the-anthropic-economic-index"}]}, {"id": "3.2.2", "t": "Wages", "q": "Could AI reduce worker bargaining power and wages even without producing large increases in unemployment?", "n": "Acemoglu-Restrepo show 'so-so automation' can depress wages without mass unemployment. Autor's counter-case: AI could rebuild middle-skill work by extending expertise to more people. Both are live.", "crux": "", "slug": "wage-effects", "links": [{"t": "Tasks, Automation, and the Rise in US Wage Inequality", "s": "Acemoglu & Restrepo, Econometrica", "y": "2022", "u": "https://www.nber.org/papers/w28920"}, {"t": "The Turing Trap", "s": "Erik Brynjolfsson, Daedalus", "y": "2022", "u": "https://digitaleconomy.stanford.edu/news/the-turing-trap-the-promise-peril-of-human-like-artificial-intelligence/"}, {"t": "AI Could Actually Help Rebuild the Middle Class", "s": "David Autor, Noema", "y": "2024", "u": "https://www.noemamag.com/how-ai-could-help-rebuild-the-middle-class/"}]}, {"id": "3.2.3", "t": "Entry-level work", "q": "What happens if junior coding, analysis, research, design, legal, and administrative work disappears before senior roles?", "n": "One prominent study finds relative employment declines for young workers in the most AI-exposed occupations since late 2022, concentrated where AI automates rather than augments; critics attribute the pattern to interest-rate and remote-work confounds.", "crux": "", "slug": "entry-level-work", "links": [{"t": "Canaries in the Coal Mine? Employment Effects of AI", "s": "Brynjolfsson, Chandar & Chen, Stanford", "y": "2025", "u": "https://digitaleconomy.stanford.edu/publication/canaries-in-the-coal-mine-six-facts-about-the-recent-employment-effects-of-artificial-intelligence/"}, {"t": "Looking for the Ladder", "s": "Iscenko & Curto Millet, EIG", "y": "2026", "u": "https://eig.org/wp-content/uploads/2026/01/TAWP-Iscenko-Millet.pdf"}]}, {"id": "3.2.4", "t": "Expertise formation", "q": "How will people become experts if AI performs the apprenticeship tasks through which expertise was previously developed?", "n": "Beane's 'shadow learning' research showed automation strips juniors of deliberate practice; generative AI compresses novice-expert performance gaps at work — while its effect on the practice through which expertise forms is the open question.", "crux": "", "slug": "expertise-formation", "links": [{"t": "Learning to Work with Intelligent Machines", "s": "Matt Beane, HBR", "y": "2019", "u": "https://hbr.org/2019/09/learning-to-work-with-intelligent-machines"}, {"t": "Generative AI at Work", "s": "Brynjolfsson, Li & Raymond, QJE", "y": "2025", "u": "https://academic.oup.com/qje/article/140/2/889/7990658"}]}, {"id": "3.2.5", "t": "Adjustment", "q": "Can education, retraining, labor mobility, credentialing, and social insurance adapt quickly enough?", "n": "Labor-market institutions adapt on decade timescales; AI capability moves faster. The policy inventory — retraining, wage insurance, credential reform — exists on paper and is largely untested at speed.", "crux": "", "slug": "labor-adjustment", "links": [{"t": "OECD Employment Outlook 2023: AI and the Labour Market", "s": "OECD", "y": "2023", "u": "https://www.oecd.org/en/publications/oecd-employment-outlook-2023_08785bba-en.html"}, {"t": "The Work of the Future", "s": "MIT Task Force", "y": "2020", "u": "https://workofthefuture-taskforce.mit.edu/wp-content/uploads/2021/01/2020-Final-Report4.pdf"}]}]}, {"id": "3.3", "t": "Firms, markets, and industry structure", "qs": [{"id": "3.3.1", "t": "Value capture", "q": "Will profits accrue mainly to chipmakers, energy providers, cloud platforms, frontier labs, application companies, data owners, or AI-enabled incumbents?", "n": "So far value has pooled in chips and cloud. Whether the model layer or the application layer captures more going forward — and whether revenue justifies the capex — is Sequoia's '$600B question.'", "crux": "", "slug": "value-capture", "links": [{"t": "Who Owns the Generative AI Platform?", "s": "Bornstein, Appenzeller & Casado, a16z", "y": "2023", "u": "https://a16z.com/who-owns-the-generative-ai-platform/"}, {"t": "AI's $600B Question", "s": "David Cahn, Sequoia", "y": "2024", "u": "https://sequoiacap.com/article/ais-600b-question/"}]}, {"id": "3.3.2", "t": "Concentration", "q": "Will scale economies produce a few dominant firms, or will open models and falling inference costs commoditize intelligence?", "n": "Scale economies, data feedback loops, and capital walls point to oligopoly; open weights and collapsing inference prices point to commodity. Competition authorities are watching the vertical stack, not just the model market.", "crux": "Will capability remain concentrated in a few controllable institutions or proliferate widely?", "slug": "market-concentration", "links": [{"t": "Market Concentration Implications of Foundation Models", "s": "Vipra & Korinek, Brookings", "y": "2023", "u": "https://www.brookings.edu/articles/market-concentration-implications-of-foundation-models-the-invisible-hand-of-chatgpt"}, {"t": "AI Foundation Models: Initial Report", "s": "UK CMA", "y": "2023", "u": "https://www.gov.uk/government/publications/ai-foundation-models-initial-report"}]}, {"id": "3.3.3", "t": "Firm boundaries", "q": "Will companies become smaller because coordination is cheap, or larger because AI rewards data, capital, distribution, and centralized control?", "n": "Coase's transaction-cost logic cuts both ways: cheap coordination shrinks the reason firms exist, while data and capital advantages push toward giantism. The empirical race is on.", "crux": "", "slug": "firm-boundaries", "links": [{"t": "From Coase to AI Agents", "s": "California Management Review", "y": "2025", "u": "https://cmr.berkeley.edu/2025/04/from-coase-to-ai-agents-why-the-economics-of-the-firm-still-matters-in-the-age-of-automation/"}, {"t": "The Coasean Singularity? Market Design with AI Agents", "s": "Shahidi et al., NBER", "y": "2025", "u": "https://www.nber.org/system/files/chapters/c15309/c15309.pdf"}]}, {"id": "3.3.4", "t": "Agent-native markets", "q": "What markets emerge when agents can search, negotiate, purchase, advertise, trade, and contract with one another?", "n": "Agent-to-agent commerce raises market-design questions — identity, recourse, collusion, price formation — that economists are just beginning to formalize, and that infrastructure choices will lock in early.", "crux": "", "slug": "agent-native-markets", "links": [{"t": "Virtual Agent Economies", "s": "Tomasev et al., DeepMind", "y": "2025", "u": "https://arxiv.org/abs/2509.10147"}, {"t": "Virtual Agent Economies", "s": "Tomasev et al., DeepMind", "y": "2025", "u": "https://arxiv.org/abs/2509.10147"}]}, {"id": "3.3.5", "t": "Corporate governance", "q": "How should boards oversee systems participating in hiring, pricing, capital allocation, compliance, and strategy?", "n": "Fiduciary duty when strategy is machine-advised is unsettled law and unsettled practice. Board oversight frameworks for AI are being drafted in real time, mostly by analogy to cyber risk.", "crux": "", "slug": "corporate-governance-of-ai", "links": [{"t": "The Artificially Intelligent Boardroom", "s": "Harvard Law School Forum on Corporate Governance", "y": "2025", "u": "https://corpgov.law.harvard.edu/2025/04/08/the-artificially-intelligent-boardroom/"}, {"t": "Board Oversight of AI", "s": "Harvard Law School Forum on Corporate Governance", "y": "2024", "u": "https://corpgov.law.harvard.edu/2024/09/17/board-oversight-of-ai/"}]}]}, {"id": "3.4", "t": "Science, medicine, and discovery", "qs": [{"id": "3.4.1", "t": "Scientific payoff", "q": "In which fields will AI-driven discovery translate into real scientific and economic payoff — and how soon?", "n": "Amodei's 'compressed 21st century' makes biology the test case for AI-driven conceptual breakthroughs; the skeptical view is that AI mostly accelerates the searchable parts of science. AlphaFold remains the clearest widely recognized example so far. (Whether AI can originate important ideas at all is treated under Trajectory 1.5.)", "crux": "", "slug": "scientific-payoff", "links": [{"t": "Machines of Loving Grace", "s": "Dario Amodei", "y": "2024", "u": "https://www.darioamodei.com/essay/machines-of-loving-grace"}, {"t": "A New Golden Age of Discovery: AI for Science", "s": "Google DeepMind", "y": "2024", "u": "https://deepmind.google/public-policy/ai-for-science/"}]}, {"id": "3.4.2", "t": "Verification bottleneck", "q": "How will science cope with a flood of plausible hypotheses, generated papers, synthetic data, and results that few humans can independently verify?", "n": "Messeri & Crockett's warning: AI can produce more science while producing less understanding — epistemic monocultures where everyone's hypotheses come from the same models and nobody can check the volume.", "crux": "", "slug": "verification-bottleneck", "links": [{"t": "AI and Illusions of Understanding in Scientific Research", "s": "Messeri & Crockett, Nature", "y": "2024", "u": "https://www.nature.com/articles/s41586-024-07146-0"}]}, {"id": "3.4.3", "t": "Medicine", "q": "Why does demonstrated diagnostic capability keep outrunning delivered care — and can deployment close the gap without opaque errors and unequal access?", "n": "Diagnostic parity keeps arriving in trials ahead of deployment, liability frameworks, and reimbursement; how much of the remaining gap is institutional rather than technical is the live dispute.", "crux": "", "slug": "ai-in-medicine", "links": [{"t": "Towards Conversational Diagnostic Artificial Intelligence", "s": "Tu et al. (AMIE), Nature", "y": "2025", "u": "https://www.nature.com/articles/s41586-025-08866-7"}, {"t": "Ethics and Governance of AI for Health: Guidance on Large Multi-Modal Models", "s": "WHO", "y": "2024", "u": "https://www.who.int/publications/b/70584"}]}]}, {"id": "3.5", "t": "Distribution, ownership, and development", "qs": [{"id": "3.5.1", "t": "Capital versus labor", "q": "Who benefits if the scarce inputs are compute, intellectual property, electricity, data, and capital rather than human work?", "n": "Korinek-Stiglitz: if AI substitutes broadly for labor, wages can fall even as output soars, and distribution then depends entirely on who owns the machines. Transition-scenario modeling makes the wage-collapse case precise.", "crux": "Who will own the productive capital and infrastructure through which AI's gains flow?", "slug": "capital-versus-labor", "links": [{"t": "AI and Its Implications for Income Distribution and Unemployment", "s": "Korinek & Stiglitz, NBER", "y": "2017", "u": "https://www.nber.org/papers/w24174"}, {"t": "Scenarios for the Transition to AGI", "s": "Korinek & Suh, NBER", "y": "2024", "u": "https://www.nber.org/papers/w32255"}]}, {"id": "3.5.2", "t": "Global inequality", "q": "Will developing countries gain access to cheap expertise, or lose the low-cost-labor development path that supported earlier industrialization?", "n": "The IMF finds advanced economies more exposed but better positioned to benefit. The deeper worry: AI may pull up the export-led development ladder just as the largest-ever cohort of young workers reaches it.", "crux": "", "slug": "global-inequality", "links": [{"t": "Gen-AI: Artificial Intelligence and the Future of Work", "s": "IMF", "y": "2024", "u": "https://www.imf.org/en/publications/staff-discussion-notes/issues/2024/01/14/gen-ai-artificial-intelligence-and-the-future-of-work-542379"}, {"t": "A New Growth Strategy for Developing Nations", "s": "Rodrik & Stiglitz", "y": "2024", "u": "https://drodrik.scholars.harvard.edu/sites/g/files/omnuum7106/files/2025-10/A%20New%20Growth%20Strategy%20for%20Developing%20Nations%20(Rodrik%20and%20Stiglitz).pdf"}]}, {"id": "3.5.3", "t": "Ownership mechanisms", "q": "Could broader capital ownership, sovereign funds, social dividends, UBI, negative income taxes, or shorter workweeks distribute gains effectively?", "n": "Proposals range from Altman's taxed-equity 'Moore's Law for Everything' to windfall clauses committing labs to share extreme profits. The design question — mechanisms, not just transfers — is underdeveloped relative to its stakes.", "crux": "", "slug": "ownership-mechanisms", "links": [{"t": "Moore's Law for Everything", "s": "Sam Altman", "y": "2021", "u": "https://moores.samaltman.com/"}, {"t": "The Windfall Clause", "s": "O'Keefe et al., GovAI", "y": "2020", "u": "https://www.governance.ai/research-paper/the-windfall-clause-distributing-the-benefits-of-ai-for-the-common-good"}, {"t": "The Employment Effects of a Guaranteed Income: Experimental Evidence from Two U.S. States", "s": "Vivalt et al., NBER", "y": "2024", "u": "https://www.nber.org/papers/w32719"}]}]}, {"id": "3.6", "t": "Material constraints and systemic risk", "qs": [{"id": "3.6.1", "t": "Energy and environment", "q": "Can electrical grids, water systems, land, and local communities accommodate rapidly growing compute demand?", "n": "The IEA projects data-center electricity demand roughly doubling by 2030, with AI the main driver. Siting, water, and grid interconnection queues are where the abstraction meets local politics.", "crux": "", "slug": "energy-and-environment", "links": [{"t": "Energy and AI", "s": "IEA", "y": "2025", "u": "https://www.iea.org/reports/energy-and-ai"}, {"t": "AI's Power Requirements Under Exponential Growth", "s": "RAND", "y": "2025", "u": "https://www.rand.org/pubs/research_reports/RRA3572-1.html"}]}, {"id": "3.6.2", "t": "Financial stability", "q": "Could synchronized agents, correlated models, concentrated investment, automated trading, or an AI-capex reversal create systemic risks?", "n": "Regulators flag herding from correlated models, dependence on a few providers, and the sheer scale of AI capital expenditure as systemic scenarios — a financial-stability watchlist that barely existed two years ago.", "crux": "", "slug": "financial-stability", "links": [{"t": "The Financial Stability Implications of AI", "s": "Financial Stability Board", "y": "2024", "u": "https://www.fsb.org/2024/11/the-financial-stability-implications-of-artificial-intelligence/"}, {"t": "Global Financial Stability Report, Ch. 3: AI and Capital Markets", "s": "IMF", "y": "2024", "u": "https://www.imf.org/en/Publications/GFSR/Issues/2024/10/22/global-financial-stability-report-october-2024"}]}]}]}, {"id": "4", "name": "Power", "tag": "Who controls AI, and under what rules?", "intro": "Power asks who decides: how rules attach to the technology and when they bind, what states can and should do with it, how great-power competition shapes its development, and who owns the models, data, and infrastructure through which it acts.", "subs": [{"id": "4.1", "t": "Regulatory design", "qs": [{"id": "4.1.1", "t": "Regulatory object", "q": "Should rules attach to compute, training runs, model capabilities, weights, developers, deployers, applications, or resulting harms?", "n": "Compute is the most governable input — quantifiable, excludable, produced by a concentrated supply chain — but capability maps poorly onto FLOP counts, and application-layer rules miss the frontier entirely.", "crux": "", "slug": "regulatory-object", "links": [{"t": "Frontier AI Regulation: Managing Emerging Risks", "s": "Anderljung et al., GovAI", "y": "2023", "u": "https://arxiv.org/abs/2307.03718"}, {"t": "Computing Power and the Governance of AI", "s": "Sastry, Heim et al.", "y": "2024", "u": "https://arxiv.org/abs/2402.08797"}]}, {"id": "4.1.2", "t": "Thresholds", "q": "Which measurable capabilities or resource levels should trigger licensing, evaluation, reporting, or access restrictions?", "n": "FLOP thresholds (10^25 in the EU AI Act, 10^26 in vetoed SB-1047) are proxies that decay as algorithms improve. Hooker's critique: they're already leaky, and capability-based triggers are hard to measure pre-deployment.", "crux": "", "slug": "capability-thresholds", "links": [{"t": "On the Limitations of Compute Thresholds", "s": "Sara Hooker", "y": "2024", "u": "https://arxiv.org/abs/2407.05694"}, {"t": "The Role of Compute Thresholds for AI Governance", "s": "Institute for Law & AI", "y": "2024", "u": "https://law-ai.org/wp-content/uploads/2024/11/The-Role-of-Compute-Thresholds-for-AI-Governance.pdf"}]}, {"id": "4.1.3", "t": "Ex ante versus ex post", "q": "When is predeployment approval justified, and when is liability after harm sufficient?", "n": "Liability regimes can price risk without an approval bureaucracy — Weil's case for tort law as AI governance — but catastrophic and irreversible harms break the ex post logic: no one can be made whole afterward.", "crux": "", "slug": "ex-ante-ex-post-liability", "links": [{"t": "Tort Law as a Tool for Mitigating Catastrophic Risk from AI", "s": "Gabriel Weil", "y": "2024", "u": "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4694006"}, {"t": "The Limits of Liability", "s": "Gabriel Weil, Institute for Law & AI", "y": "2024", "u": "https://law-ai.org/the-limits-of-liability/"}, {"t": "Governing AI Agents", "s": "Noam Kolt, Notre Dame Law Review", "y": "2025", "u": "https://arxiv.org/abs/2501.07913"}, {"t": "AI Liability Along the Value Chain", "s": "Botero Arcila, Mozilla", "y": "2025", "u": "https://blog.mozilla.org/netpolicy/files/2025/03/AI-Liability-Along-the-Value-Chain_Beatriz-Arcila.pdf"}]}, {"id": "4.1.4", "t": "Transparency", "q": "What should companies disclose about training, evaluations, incidents, energy use, safeguards, and deployment?", "n": "After the first Foundation Model Transparency Index publicly named laggards, measured disclosure rose — though training-data and compute details remain thin. Mandatory incident reporting — the aviation-safety model — is the most commonly proposed floor beneath voluntary disclosure.", "crux": "", "slug": "transparency-requirements", "links": [{"t": "The Foundation Model Transparency Index", "s": "Bommasani et al., Stanford CRFM", "y": "2023", "u": "https://arxiv.org/abs/2310.12941"}, {"t": "AI Incidents: Key Components of a Mandatory Reporting Regime", "s": "CSET", "y": "2024", "u": "https://cset.georgetown.edu/publication/ai-incidents-key-components-for-a-mandatory-reporting-regime/"}]}, {"id": "4.1.5", "t": "Adaptability", "q": "How can rules evolve with the technology without creating arbitrary authority, regulatory capture, or permanent incumbent advantage?", "n": "The pacing problem meets capture risk: rules slow enough to be legitimate are too slow to be relevant. Regulatory markets — licensed private regulators competing on outcomes — are one attempt to square it.", "crux": "", "slug": "regulatory-adaptability", "links": [{"t": "Regulatory Markets for AI Safety", "s": "Clark & Hadfield", "y": "2020", "u": "https://arxiv.org/abs/2001.00078"}, {"t": "The General-Purpose AI Code of Practice", "s": "European Commission", "y": "2025", "u": "https://digital-strategy.ec.europa.eu/en/policies/contents-code-gpai"}]}]}, {"id": "4.2", "t": "State capacity and public institutions", "qs": [{"id": "4.2.1", "t": "Technical competence", "q": "Can governments recruit enough talent to evaluate systems, investigate incidents, procure AI, and challenge industry claims?", "n": "Government pay scales and clearance timelines lose to lab compensation by an order of magnitude. AI safety institutes are the current workaround: small, technical, and deliberately outside normal civil-service structures.", "crux": "", "slug": "government-technical-capacity", "links": [{"t": "Building AI Surge Capacity", "s": "IAPS", "y": "2024", "u": "https://www.iaps.ai/research/building-ai-surge-capacity"}, {"t": "Building Talent and Institutional Readiness", "s": "Atlantic Council", "y": "2026", "u": "https://www.atlanticcouncil.org/in-depth-research-reports/issue-brief/building-talent-and-institutional-readiness/"}]}, {"id": "4.2.2", "t": "Government use", "q": "How should AI be deployed in welfare, taxation, policing, courts, immigration, intelligence, and public administration?", "n": "Agency adoption reached far further by 2020 than most realized — mostly unglamorous, mostly ungoverned. The live split is between procedural-safeguard approaches (due process, contestability) and use-case prohibitions, while adoption outpaces both.", "crux": "", "slug": "government-use-of-ai", "links": [{"t": "Government by Algorithm", "s": "Engstrom, Ho, Sharkey & Cuéllar", "y": "2020", "u": "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3551505"}, {"t": "Government AI Landscape Assessment", "s": "Code for America", "y": "2026", "u": "https://codeforamerica.org/explore/government-ai-landscape-assessment/"}, {"t": "Governing in the Age of AI", "s": "Tony Blair Institute", "y": "2024", "u": "https://institute.global/insights/politics-and-governance/governing-in-the-age-of-ai-a-new-model-to-transform-the-state"}]}, {"id": "4.2.3", "t": "Public infrastructure", "q": "Should states provide sovereign compute, national models, public datasets, shared safety infrastructure, or publicly funded alternatives?", "n": "Sovereign-AI programs answer a dependency worry: nearly all frontier capability sits with a handful of US and Chinese firms. The objection is cost realism — states buying relevance in a game priced in tens of billions.", "crux": "", "slug": "public-ai-infrastructure", "links": [{"t": "Public AI: Infrastructure for the Common Good", "s": "Public AI Network", "y": "2024", "u": "https://publicai.network/whitepaper/"}, {"t": "Sovereign AI Index", "s": "CNAS", "y": "2025", "u": "https://interactives.cnas.org/reports/sovereign-ai-index/"}]}, {"id": "4.2.4", "t": "Emergency powers", "q": "What authority should governments possess during a severe AI incident, and how can abuse of those powers be prevented?", "n": "What a government can lawfully do mid-incident — pause a deployment, compel disclosure, seize weights — is largely undefined in advance. Emergency-preparedness work is trying to write the playbook before it's needed.", "crux": "", "slug": "emergency-powers", "links": [{"t": "AI Emergency Preparedness", "s": "Wasil et al.", "y": "2024", "u": "https://arxiv.org/abs/2407.17347"}, {"t": "Preparing for an AI Crisis", "s": "Chatham House", "y": "2026", "u": "https://www.chathamhouse.org/2026/03/breaking-deadlock-ai-governance/04-preparing-ai-crisis-recommendations"}]}]}, {"id": "4.3", "t": "Geopolitics and military power", "qs": [{"id": "4.3.1", "t": "Race dynamics", "q": "Does strategic competition encourage beneficial investment or cause firms and states to cut safety margins and deploy prematurely?", "n": "Race models formalize the intuition: the closer the competition, the less anyone spends on safety. Danzig's 'technology roulette' argument extends it — even the winner inherits systems it doesn't fully control.", "crux": "Can governments coordinate on major risks without believing they are surrendering a strategic race?", "slug": "race-dynamics", "links": [{"t": "Racing to the Precipice", "s": "Armstrong, Bostrom & Shulman", "y": "2016", "u": "https://link.springer.com/article/10.1007/s00146-015-0590-y"}, {"t": "Technology Roulette", "s": "Richard Danzig, CNAS", "y": "2018", "u": "https://www.cnas.org/publications/reports/technology-roulette"}, {"t": "Departing as OpenAI’s AGI Readiness lead: neither labs nor the world are ready", "s": "Miles Brundage (@Miles_Brundage) on X", "y": "2024", "u": "https://x.com/Miles_Brundage/status/1849138802864087234"}]}, {"id": "4.3.2", "t": "US–China competition", "q": "Will leadership depend primarily on chips, electricity, algorithms, manufacturing, talent, capital, data, or commercial diffusion?", "n": "Buchanan's triad (data, compute, algorithms) frames the inputs; Ding's diffusion thesis counters that adoption capacity, not invention, decides hegemonic transitions — a lens under which the race looks very different.", "crux": "", "slug": "us-china-competition", "links": [{"t": "The AI Triad and What It Means for National Security Strategy", "s": "Ben Buchanan, CSET", "y": "2020", "u": "https://cset.georgetown.edu/publication/the-ai-triad-and-what-it-means-for-national-security-strategy/"}, {"t": "Technology and the Rise of Great Powers", "s": "Jeffrey Ding, International Affairs", "y": "2025", "u": "https://academic.oup.com/ia/article-abstract/101/3/1133/8125200"}]}, {"id": "4.3.3", "t": "Export controls", "q": "Can controls meaningfully delay competitors, or will they accelerate substitution and damage domestic firms and allies?", "n": "The October 2022 controls were the most aggressive tech denial since the Cold War. DeepSeek and Huawei's advances sharpened the substitution critique; the delay-vs-backfire ledger is still being written.", "crux": "", "slug": "export-controls", "links": [{"t": "Choking Off China's Access to the Future of AI", "s": "Gregory Allen, CSIS", "y": "2022", "u": "https://www.csis.org/analysis/choking-chinas-access-future-ai"}, {"t": "The Limits of Chip Export Controls", "s": "CSIS", "y": "2025", "u": "https://www.csis.org/analysis/limits-chip-export-controls-meeting-china-challenge"}, {"t": "On DeepSeek and Export Controls", "s": "Dario Amodei", "y": "2025", "u": "https://darioamodei.com/post/on-deepseek-and-export-controls"}]}, {"id": "4.3.4", "t": "Military integration", "q": "How should AI be used in intelligence, cyber operations, autonomous weapons, targeting, command systems, and nuclear decision-making?", "n": "Wargaming studies find LLMs tend to escalate, occasionally to nuclear use, and the ICRC argues for legal limits on weapon autonomy before integration becomes routine. Command-and-intelligence integration is proceeding faster than doctrine either way; the nuclear question is the sharpest.", "crux": "", "slug": "military-integration", "links": [{"t": "How Might AI Affect the Risk of Nuclear War?", "s": "RAND", "y": "2018", "u": "https://www.rand.org/pubs/perspectives/PE296.html"}, {"t": "Escalation Risks from LLMs in Military and Diplomatic Decision-Making", "s": "Rivera et al., Stanford", "y": "2024", "u": "https://arxiv.org/abs/2401.03408"}, {"t": "ICRC Position on Autonomous Weapon Systems", "s": "ICRC", "y": "2021", "u": "https://www.icrc.org/en/document/icrc-position-autonomous-weapon-systems"}, {"t": "AI for Military Decision-Making", "s": "Probasco, Toner, Burtell & Rudner, CSET", "y": "2025", "u": "https://cset.georgetown.edu/publication/ai-for-military-decision-making/"}]}, {"id": "4.3.5", "t": "Espionage and proliferation", "q": "Can model weights, algorithms, chip designs, and research knowledge be secured once they become central strategic assets?", "n": "RAND's weights-security analysis defines five attacker tiers and concludes that defending against top-tier state operations may be beyond any private company — which makes security a public problem, not a corporate one.", "crux": "", "slug": "weights-security", "links": [{"t": "Securing AI Model Weights", "s": "Nevo et al., RAND", "y": "2024", "u": "https://www.rand.org/pubs/research_reports/RRA2849-1.html"}, {"t": "A Playbook for Securing AI Model Weights", "s": "RAND", "y": "2024", "u": "https://www.rand.org/pubs/research_briefs/RBA2849-1.html"}]}]}, {"id": "4.4", "t": "International coordination and verification", "qs": [{"id": "4.4.1", "t": "Common interests", "q": "Which risks are sufficiently shared that rival states could cooperate despite broader geopolitical conflict?", "n": "The candidate zones: evaluation science, verification technology, and loss-of-control red lines — areas where rivals share downside the way they shared it on nuclear accidents. Bengio and others have mapped the technical overlap.", "crux": "Can government
