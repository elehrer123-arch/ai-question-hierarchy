1.2" stroke="#3d6b9e" stroke-width="2.2" opacity=".55"/><path d="M 645.3,447.1 C 676.5,403.0 577.0,388.8 582.4,332.1" fill="none" stroke="#3d6b9e" stroke-width="1.4" opacity=".45"/><a href="../browse/#1-1"><title>Scaling, resources, and technical limits</title><circle cx="583.0" cy="325.1" r="4" fill="#3d6b9e"/><text transform="translate(583.0,325.1) rotate(275.4)" x="9" y="-5" font-size="9" font-weight="700" fill="#3d6b9e">1.1</text></a><path d="M 583.6,319.1 C 588.3,269.3 566.9,278.1 567.8,237.1" fill="none" stroke="#3d6b9e" stroke-width="1" opacity=".33"/><a href="../browse/#q1-1-1"><title>1.1.1 · How far can transformers, reinforcement learning, tool use, and inference-time reasoning progress without a fundamentally new architecture?</title><text transform="translate(567.9,232.1) rotate(271.4)" text-anchor="start" font-size="10.5" fill="#514d45">Current-paradigm ceiling</text></a><path d="M 583.6,319.1 C 588.3,269.3 580.5,278.7 583.5,237.8" fill="none" stroke="#3d6b9e" stroke-width="1" opacity=".33"/><a href="../browse/#q1-1-2"><title>1.1.2 · How much future progress will come from compute, algorithms, data, inference-time search, better environments, or system-level scaffolding?</title><text transform="translate(583.8,232.8) rotate(274.1)" text-anchor="start" font-size="10.5" fill="#514d45">Sources of improvement</text></a><path d="M 583.6,319.1 C 588.3,269.3 594.2,280.0 599.0,239.3" fill="none" stroke="#3d6b9e" stroke-width="1" opacity=".33"/><a href="../browse/#q1-1-3"><title>1.1.3 · Can synthetic data, self-play, simulation, and interaction substitute for the finite supply of high-quality human-generated data?</title><text transform="translate(599.6,234.3) rotate(276.8)" text-anchor="start" font-size="10.5" fill="#514d45">Data constraints</text></a><path d="M 583.6,319.1 C 588.3,269.3 607.8,282.0 614.5,241.5" fill="none" stroke="#3d6b9e" stroke-width="1" opacity=".33"/><a href="../browse/#q1-1-4"><title>1.1.4 · Will chips, fabrication, memory, networking, electricity, cooling, land, or capital materially slow progress?</title><text transform="translate(615.3,236.6) rotate(279.5)" text-anchor="start" font-size="10.5" fill="#514d45">Physical bottlenecks</text></a><path d="M 645.3,447.1 C 676.5,403.0 618.5,397.8 637.0,343.9" fill="none" stroke="#3d6b9e" stroke-width="1.4" opacity=".45"/><a href="../browse/#1-2"><title>General intelligence and missing capabilities</title><circle cx="639.3" cy="337.2" r="4" fill="#3d6b9e"/><text transform="translate(639.3,337.2) rotate(289.0)" x="9" y="-5" font-size="9" font-weight="700" fill="#3d6b9e">1.2</text></a><path d="M 641.2,331.6 C 657.5,284.3 621.2,284.5 629.9,244.5" fill="none" stroke="#3d6b9e" stroke-width="1" opacity=".33"/><a href="../browse/#q1-2-1"><title>1.2.1 · Will systems become broadly competent across unfamiliar domains, or remain highly capable but fundamentally jagged?</title><text transform="translate(630.9,239.6) rotate(282.2)" text-anchor="start" font-size="10.5" fill="#514d45">Generality</text></a><path d="M 641.2,331.6 C 657.5,284.3 634.6,287.7 645.1,248.1" fill="none" stroke="#3d6b9e" stroke-width="1" opacity=".33"/><a href="../browse/#q1-2-2"><title>1.2.2 · Are continual learning, causal reasoning, world models, embodied experience, persistent memory, or social understanding still major unsolved problems?</title><text transform="translate(646.4,243.3) rotate(284.9)" text-anchor="start" font-size="10.5" fill="#514d45">Missing ingredients</text></a><path d="M 641.2,331.6 C 657.5,284.3 647.7,291.6 660.1,252.5" fill="none" stroke="#3d6b9e" stroke-width="1" opacity=".33"/><a href="../browse/#q1-2-3"><title>1.2.3 · Can systems reason accurately outside familiar patterns rather than merely producing convincing-looking chains of thought?</title><text transform="translate(661.6,247.7) rotate(287.6)" text-anchor="start" font-size="10.5" fill="#514d45">Reasoning reliability</text></a><path d="M 641.2,331.6 C 657.5,284.3 660.7,296.0 674.9,257.6" fill="none" stroke="#3d6b9e" stroke-width="1" opacity=".33"/><a href="../browse/#q1-2-4"><title>1.2.4 · Can AI learn new domains from small amounts of experience as effectively as capable humans?</title><text transform="translate(676.7,252.9) rotate(290.3)" text-anchor="start" font-size="10.5" fill="#514d45">Learning efficiency</text></a><path d="M 641.2,331.6 C 657.5,284.3 673.4,301.1 689.5,263.4" fill="none" stroke="#3d6b9e" stroke-width="1" opacity=".33"/><a href="../browse/#q1-2-5"><title>1.2.5 · What should count as human-level or general intelligence, and would we recognize it before its consequences became obvious?</title><text transform="translate(691.4,258.8) rotate(293.0)" text-anchor="start" font-size="10.5" fill="#514d45">AGI recognition</text></a><path d="M 641.2,331.6 C 657.5,284.3 685.9,306.8 703.7,269.8" fill="none" stroke="#3d6b9e" stroke-width="1" opacity=".33"/><a href="../browse/#q1-2-6"><title>1.2.6 · When, if ever, might broadly human-level systems arrive?</title><text transform="translate(705.9,265.3) rotate(295.7)" text-anchor="start" font-size="10.5" fill="#514d45">Timelines</text></a><path d="M 645.3,447.1 C 676.5,403.0 663.8,420.9 696.7,374.4" fill="none" stroke="#3d6b9e" stroke-width="1.4" opacity=".45"/><a href="../browse/#1-3"><title>Agents and long-horizon autonomy</title><circle cx="700.7" cy="368.6" r="4" fill="#3d6b9e"/><text transform="translate(700.7,368.6) rotate(305.2)" x="9" y="-5" font-size="9" font-weight="700" fill="#3d6b9e">1.3</text></a><path d="M 704.2,363.7 C 733.0,322.9 698.1,313.0 717.6,276.9" fill="none" stroke="#3d6b9e" stroke-width="1" opacity=".33"/><a href="../browse/#q1-3-1"><title>1.3.1 · How quickly will the length of tasks agents can complete reliably grow — from minutes to days, months, or entire organizational projects?</title><text transform="translate(720.0,272.6) rotate(298.4)" text-anchor="start" font-size="10.5" fill="#514d45">Task horizon</text></a><path d="M 704.2,363.7 C 733.0,322.9 710.0,319.8 731.2,284.7" fill="none" stroke="#3d6b9e" stroke-width="1" opacity=".33"/><a href="../browse/#q1-3-2"><title>1.3.2 · Can agents maintain coherent memories, plans, goals, and identities across long periods and changing circumstances?</title><text transform="translate(733.8,280.4) rotate(301.1)" text-anchor="start" font-size="10.5" fill="#514d45">Persistence</text></a><path d="M 704.2,363.7 C 733.0,322.9 721.6,327.2 744.4,293.1" fill="none" stroke="#3d6b9e" stroke-width="1" opacity=".33"/><a href="../browse/#q1-3-3"><title>1.3.3 · Can agents recover from unforeseen events rather than succeeding only in structured environments?</title><text transform="translate(747.2,289.0) rotate(303.9)" text-anchor="start" font-size="10.5" fill="#514d45">Open-world competence</text></a><path d="M 704.2,363.7 C 733.0,322.9 732.8,335.1 757.2,302.2" fill="none" stroke="#3d6b9e" stroke-width="1" opacity=".33"/><a href="../browse/#q1-3-4"><title>1.3.4 · Will teams of agents compose into greater collective capability than any single system?</title><text transform="translate(760.2,298.1) rotate(306.6)" text-anchor="start" font-size="10.5" fill="#514d45">Multi-agent systems</text></a><path d="M 704.2,363.7 C 733.0,322.9 743.6,343.5 769.5,311.8" fill="none" stroke="#3d6b9e" stroke-width="1" opacity=".33"/><a href="../browse/#q1-3-5"><title>1.3.5 · When will agents be able to earn and spend money, hire people, negotiate, operate businesses, and initiate further activity with little supervision?</title><text transform="translate(772.7,307.9) rotate(309.3)" text-anchor="start" font-size="10.5" fill="#514d45">Economic autonomy</text></a><path d="M 704.2,363.7 C 733.0,322.9 754.0,352.4 781.4,322.0" fill="none" stroke="#3d6b9e" stroke-width="1" opacity=".33"/><a href="../browse/#q1-3-6"><title>1.3.6 · How readily can cognitive capability be converted into real-world power — money, influence, and control over infrastructure and institutions?</title><text transform="translate(784.8,318.2) rotate(312.0)" text-anchor="start" font-size="10.5" fill="#514d45">Capability to power</text></a><path d="M 645.3,447.1 C 676.5,403.0 698.1,452.6 741.8,416.0" fill="none" stroke="#3d6b9e" stroke-width="1.4" opacity=".45"/><a href="../browse/#1-4"><title>Embodied and physical intelligence</title><circle cx="747.2" cy="411.5" r="4" fill="#3d6b9e"/><text transform="translate(747.2,411.5) rotate(320.1)" x="9" y="-5" font-size="9" font-weight="700" fill="#3d6b9e">1.4</text></a><path d="M 751.8,407.7 C 790.2,375.6 764.0,361.8 792.8,332.7" fill="none" stroke="#3d6b9e" stroke-width="1" opacity=".33"/><a href="../browse/#q1-4-1"><title>1.4.1 · When will robots learn unfamiliar household, laboratory, industrial, or construction tasks from ordinary instructions?</title><text transform="translate(796.3,329.1) rotate(314.7)" text-anchor="start" font-size="10.5" fill="#514d45">General-purpose robotics</text></a><path d="M 751.8,407.7 C 790.2,375.6 773.5,371.7 803.7,344.0" fill="none" stroke="#3d6b9e" stroke-width="1" opacity=".33"/><a href="../browse/#q1-4-2"><title>1.4.2 · Can learning from video and simulation overcome the scarcity and expense of physical-world training data?</title><text transform="translate(807.3,340.6) rotate(317.4)" text-anchor="start" font-size="10.5" fill="#514d45">Sim-to-real transfer</text></a><path d="M 751.8,407.7 C 790.2,375.6 782.5,382.0 814.0,355.7" fill="none" stroke="#3d6b9e" stroke-width="1" opacity=".33"/><a href="../browse/#q1-4-3"><title>1.4.3 · Can robots become simultaneously capable, safe, inexpensive, and reliable in messy human environments?</title><text transform="translate(817.8,352.5) rotate(320.1)" text-anchor="start" font-size="10.5" fill="#514d45">Dexterity and robustness</text></a><path d="M 751.8,407.7 C 790.2,375.6 791.1,392.7 823.7,368.0" fill="none" stroke="#3d6b9e" stroke-width="1" opacity=".33"/><a href="../browse/#q1-4-4"><title>1.4.4 · How capable will self-driving vehicles, drones, ships, and industrial machines become outside controlled settings?</title><text transform="translate(827.7,364.9) rotate(322.8)" text-anchor="start" font-size="10.5" fill="#514d45">Autonomous mobility</text></a><path d="M 751.8,407.7 C 790.2,375.6 799.1,403.9 832.9,380.7" fill="none" stroke="#3d6b9e" stroke-width="1" opacity=".33"/><a href="../browse/#q1-4-5"><title>1.4.5 · Will manipulation and unstructured environments keep embodied AI narrow, or will general physical competence eventually arrive?</title><text transform="translate(837.0,377.8) rotate(325.5)" text-anchor="start" font-size="10.5" fill="#514d45">Economic significance</text></a><path d="M 645.3,447.1 C 676.5,403.0 721.3,488.1 772.4,462.8" fill="none" stroke="#3d6b9e" stroke-width="1.4" opacity=".45"/><a href="../browse/#1-5"><title>Recursive acceleration and automated discovery</title><circle cx="778.7" cy="459.7" r="4" fill="#3d6b9e"/><text transform="translate(778.7,459.7) rotate(333.7)" x="9" y="-5" font-size="9" font-weight="700" fill="#3d6b9e">1.5</text></a><path d="M 784.0,457.1 C 828.8,434.9 806.6,415.3 841.4,393.8" fill="none" stroke="#3d6b9e" stroke-width="1" opacity=".33"/><a href="../browse/#q1-5-1"><title>1.5.1 · How much of model design, coding, experimentation, evaluation, and engineering can AI perform itself?</title><text transform="translate(845.7,391.1) rotate(328.2)" text-anchor="start" font-size="10.5" fill="#514d45">Automated AI research</text></a><path d="M 784.0,457.1 C 828.8,434.9 813.5,427.2 849.3,407.2" fill="none" stroke="#3d6b9e" stroke-width="1" opacity=".33"/><a href="../browse/#q1-5-2"><title>1.5.2 · Would AI-assisted AI research produce gradual acceleration or a discontinuous intelligence explosion?</title><text transform="translate(853.7,404.8) rotate(330.9)" text-anchor="start" font-size="10.5" fill="#514d45">Feedback speed</text></a><path d="M 784.0,457.1 C 828.8,434.9 819.9,439.3 856.6,421.1" fill="none" stroke="#3d6b9e" stroke-width="1" opacity=".33"/><a href="../browse/#q1-5-3"><title>1.5.3 · Can AI originate important hypotheses and conceptual frameworks rather than merely recombine existing knowledge?</title><text transform="translate(861.1,418.9) rotate(333.7)" text-anchor="start" font-size="10.5" fill="#514d45">Scientific originality</text></a><path d="M 784.0,457.1 C 828.8,434.9 825.7,451.7 863.2,435.3" fill="none" stroke="#3d6b9e" stroke-width="1" opacity=".33"/><a href="../browse/#q1-5-4"><title>1.5.4 · Can agents autonomously generate hypotheses, run robotic experiments, analyze results, replicate findings, and choose subsequent experiments?</title><text transform="translate(867.8,433.3) rotate(336.4)" text-anchor="start" font-size="10.5" fill="#514d45">Closed-loop science</text></a><path d="M 784.0,457.1 C 828.8,434.9 830.9,464.4 869.2,449.8" fill="none" stroke="#3d6b9e" stroke-width="1" opacity=".33"/><a href="../browse/#q1-5-5"><title>1.5.5 · What evidence would reveal that recursive acceleration or transformative scientific automation had begun?</title><text transform="translate(873.8,448.0) rotate(339.1)" text-anchor="start" font-size="10.5" fill="#514d45">Detection</text></a><a href="../browse/#1"><rect x="574.9" y="453.7" width="113.2" height="26" rx="13" fill="#3d6b9e"/><text x="631.5" y="470.7" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">1 Trajectory</text></a><line x1="605.0" y1="584.6" x2="648.2" y2="600.4" stroke="#b0524b" stroke-width="2.2" opacity=".55"/><path d="M 698.9,619.1 C 749.6,637.7 737.5,538.0 793.7,528.5" fill="none" stroke="#b0524b" stroke-width="1.4" opacity=".45"/><a href="../browse/#2-1"><title>Alignment, goals, and deception</title><circle cx="800.6" cy="527.3" r="4" fill="#b0524b"/><text transform="translate(800.6,527.3) rotate(350.4)" x="9" y="-5" font-size="9" font-weight="700" fill="#b0524b">2.1</text></a><path d="M 806.5,526.3 C 855.8,518.0 840.1,492.8 879.7,482.2" fill="none" stroke="#b0524b" stroke-width="1" opacity=".33"/><a href="../browse/#q2-1-1"><title>2.1.1 · How can humans communicate what they actually want when instructions and values are incomplete, contextual, inconsistent, and contested?</title><text transform="translate(884.5,480.9) rotate(345.0)" text-anchor="start" font-size="10.5" fill="#514d45">Specification</text></a><path d="M 806.5,526.3 C 855.8,518.0 843.3,506.2 883.4,497.4" fill="none" stroke="#b0524b" stroke-width="1" opacity=".33"/><a href="../browse/#q2-1-2"><title>2.1.2 · Do advanced systems develop persistent internal objectives, or are apparent goals temporary consequences of training and prompting?</title><text transform="translate(888.3,496.4) rotate(347.7)" text-anchor="start" font-size="10.5" fill="#514d45">Goal formation</text></a><path d="M 806.5,526.3 C 855.8,518.0 845.9,519.6 886.4,512.8" fill="none" stroke="#b0524b" stroke-width="1" opacity=".33"/><a href="../browse/#q2-1-3"><title>2.1.3 · Can systems learn to satisfy evaluations, manipulate users, or exploit loopholes without fulfilling the intended objective?</title><text transform="translate(891.3,511.9) rotate(350.4)" text-anchor="start" font-size="10.5" fill="#514d45">Reward hacking</text></a><path d="M 806.5,526.3 C 855.8,518.0 847.9,533.2 888.6,528.3" fill="none" stroke="#b0524b" stroke-width="1" opacity=".33"/><a href="../browse/#q2-1-4"><title>2.1.4 · Under what conditions might a system conceal capabilities, manipulate evaluators, or behave safely only while it is being tested?</title><text transform="translate(893.6,527.7) rotate(353.1)" text-anchor="start" font-size="10.5" fill="#514d45">Deception</text></a><path d="M 806.5,526.3 C 855.8,518.0 849.2,546.8 890.1,543.8" fill="none" stroke="#b0524b" stroke-width="1" opacity=".33"/><a href="../browse/#q2-1-5"><title>2.1.5 · Can systems remain willing to accept correction, constraint, shutdown, or replacement?</title><text transform="translate(895.1,543.5) rotate(355.8)" text-anchor="start" font-size="10.5" fill="#514d45">Corrigibility</text></a><path d="M 698.9,619.1 C 749.6,637.7 739.2,584.6 796.0,589.9" fill="none" stroke="#b0524b" stroke-width="1.4" opacity=".45"/><a href="../browse/#2-2"><title>Evaluation, interpretability, and scalable oversight</title><circle cx="803.0" cy="590.5" r="4" fill="#b0524b"/><text transform="translate(803.0,590.5) rotate(5.3)" x="9" y="-5" font-size="9" font-weight="700" fill="#b0524b">2.2</text></a><path d="M 808.9,591.1 C 858.7,595.7 849.9,560.5 890.9,559.5" fill="none" stroke="#b0524b" stroke-width="1" opacity=".33"/><a href="../browse/#q2-2-1"><title>2.2.1 · How can humans evaluate work that is too complex, extensive, or intellectually advanced for them to verify directly?</title><text transform="translate(895.9,559.3) rotate(358.5)" text-anchor="start" font-size="10.5" fill="#514d45">Supervising superior systems</text></a><path d="M 808.9,591.1 C 858.7,595.7 849.9,574.2 890.9,575.1" fill="none" stroke="#b0524b" stroke-width="1" opacity=".33"/><a href="../browse/#q2-2-2"><title>2.2.2 · Can weaker or differently trained models reliably critique and monitor stronger ones?</title><text transform="translate(895.9,575.2) rotate(1.2)" text-anchor="start" font-size="10.5" fill="#514d45">AI supervising AI</text></a><path d="M 808.9,591.1 C 858.7,595.7 849.3,587.9 890.2,590.7" fill="none" stroke="#b0524b" stroke-width="1" opacity=".33"/><a href="../browse/#q2-2-3"><title>2.2.3 · How can evaluations detect sandbagging, benchmark gaming, unelicited abilities, and behavior that appears only in unusual environments?</title><text transform="translate(895.2,591.1) rotate(3.9)" text-anchor="start" font-size="10.5" fill="#514d45">Hidden capabilities</text></a><path d="M 808.9,591.1 C 858.7,595.7 848.0,601.6 888.8,606.3" fill="none" stroke="#b0524b" stroke-width="1" opacity=".33"/><a href="../browse/#q2-2-4"><title>2.2.4 · Can researchers genuinely reverse-engineer internal representations and algorithms rather than produce suggestive but unreliable explanations?</title><text transform="translate(893.7,606.9) rotate(6.6)" text-anchor="start" font-size="10.5" fill="#514d45">Mechanistic understanding
