</style></head><body>
<header><a class="home" href="../">The Biggest Questions About&nbsp;AI</a><nav class="switch" style="margin-left:auto;font-size:13px;color:var(--ink3)" aria-label="View switch"><a id="toMap" href="../" style="color:var(--ink2);text-decoration:none">Map</a> · <b style="color:var(--ink)">Browse</b> · <a href="../latest/" style="color:var(--ink2);text-decoration:none">Latest</a></nav></header>
<div class="wrap">
<nav id="tree" aria-label="Map"><div id="srch"><input id="q" type="search" placeholder="Search questions…" aria-label="Search questions"></div>
<div class="lens" hidden><button id="lensEntry" aria-pressed="false">Full entries</button></div>
<div id="rows"></div></nav>
<main id="page"><button id="back">← Back to questions</button><div class="cols"><div class="pin" id="pin"></div><aside id="ctx" aria-label="Context"></aside></div></main>
</div>
<script>
const DATA=__DATA__, ENTRY_UNUSED=0;
const ENTRY=__ENTRY__;
const RECENT=__RECENT__, SWEPT=__SWEPT__, DEBATES=__DEBATES__;
const tree=document.getElementById('tree'), pin=document.getElementById('pin');
const esc=t=>{const d=document.createElement('div');d.textContent=t;return d.innerHTML}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function gmeta(r){
  const a=r.author,v=r.venue;
  const core=(a===v||v.startsWith(a.split(',')[0])||a.startsWith(v))?v:`${a} · ${v}`;
  const via=r.via?` · <a class="via" href="${esc(r.via.u)}" target="_blank" rel="noopener">via ${esc(r.via.t)}</a>`:'';
  return `${esc(core)} · ${fmtD(r.date)}${via}`;
}
function gexc(r,cls){
  if(!r.quote) return '';
  return `<details class="gxq ${cls||''}"><summary>Excerpt</summary><p>“${esc(r.quote)}”</p></details>`;
}
function gfeat(r){
  return `<div class="gft"${r.rid?` id="${r.rid}"`:''}><div class="gim">${gmeta(r)}</div>`+
         `<a class="gtt" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>`+
         (r.note?`<p class="gan">${esc(r.note)}</p>`:'')+gexc(r)+`</div>`;
}
function gcpt(r){
  return `<div class="gcp"${r.rid?` id="${r.rid}"`:''}><div class="gim">${gmeta(r)}</div>`+
         `<a class="gct" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>`+
         (r.note?`<p class="gcn">${esc(r.note)}</p>`:'')+gexc(r,'sm')+`</div>`;
}
function pcard(r){
  const via=r.via?` · <a href="${esc(r.via.u)}" target="_blank" rel="noopener" style="color:var(--ink3)">via ${esc(r.via.t)}</a>`:'';
  const kind=r.kind?` · <span class="pk">${esc(r.kind)}</span>`:'';
  return `<div class="pitem"><div class="pa"><b>${esc(r.author)}</b>${kind} · ${esc(r.venue)} · ${fmtD(r.date)}${via}</div>`+
         `<a class="pt" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>`+
         (r.quote?`<p class="pq">“${esc(r.quote)}”</p>`:'')+
         (r.note?`<p class="pnn">${esc(r.note)}</p>`:'')+`</div>`;
}
const fmtD=d=>{const m=(d||'').match(/^(\d{4})-(\d{2})(?:-(\d{2}))?$/);return m?(m[3]?+m[3]+' ':'')+MON[+m[2]-1]+' '+m[1]:esc(d||'')};;
const nodes={}, order=[];   // key -> {type,obj,s,su}; order = depth-first keys
order.push('root'); nodes.root={type:'root'};
DATA.forEach(s=>{ const sk=s.id; order.push(sk); nodes[sk]={type:'sec',s};
  s.subs.forEach(su=>{ const uk=su.id; order.push(uk); nodes[uk]={type:'sub',s,su};
    su.qs.forEach(q=>{ order.push(q.id); nodes[q.id]={type:'q',s,su,q}; }); }); });

/* ---------- tree ---------- */
let t='<button class="trow root" data-k="root"><span class="cv"></span><span class="lb">Overview</span></button>';
DATA.forEach(s=>{
  const nq=s.subs.reduce((a,su)=>a+su.qs.length,0);
  t+=`<button class="trow lv0" data-k="${s.id}" data-p="" style="--sc:var(--c${s.id})"><span class="cv">▶</span><span class="lb">${s.id} ${s.name}</span><span class="ct">${nq}</span></button>`;
  s.subs.forEach(su=>{
    t+=`<button class="trow lv1 hide" data-k="${su.id}" data-p="${s.id}"><span class="cv">▶</span><span class="lb">${su.id} ${esc(su.t)}</span><span class="ct">${su.qs.length}</span></button>`;
    su.qs.forEach(q=>{
      t+=`<button class="trow lv2 hide" data-k="${q.id}" data-p="${su.id}"><span class="cv"></span><span class="lb">${q.id} ${esc(q.t)}</span></button>`;
    });
  });
});
document.getElementById('rows').innerHTML=t;
const row=k=>tree.querySelector(`.trow[data-k="${k}"]`);
function setExp(k,open){
  const r=row(k); if(!r||!r.querySelector('.cv').textContent) return;
  r.classList.toggle('exp',open); r.setAttribute('aria-expanded',open?'true':'false');
  tree.querySelectorAll(`.trow[data-p="${k}"]`).forEach(c=>{
    c.classList.toggle('hide',!open);
    if(!open&&c.classList.contains('exp')) setExp(c.dataset.k,false);
  });
}
tree.addEventListener('click',e=>{
  const r=e.target.closest('.trow'); if(!r) return;
  const k=r.dataset.k;
  if(e.target.classList.contains('cv')&&r.querySelector('.cv').textContent){ setExp(k,!r.classList.contains('exp')); return; }
  show(k);
});

/* ---------- pages ---------- */
function crumbFor(n,k){
  if(n.type==='sec') return `<div class="crumb" style="--sc:var(--c${n.s.id})"><a data-go="root">The map</a> · Section ${n.s.id}</div>`;
  if(n.type==='sub') return `<div class="crumb" style="--sc:var(--c${n.s.id})"><a data-go="root">The map</a> · <a data-go="${n.s.id}">${n.s.id} ${n.s.name}</a></div>`;
  if(n.type==='q') return `<div class="crumb" style="--sc:var(--c${n.s.id})"><a data-go="root">The map</a> · <a data-go="${n.s.id}">${n.s.id} ${n.s.name}</a> · <a data-go="${n.su.id}">${n.su.id} ${esc(n.su.t)}</a></div>`;
  return '';
}
function label(k){
  const n=nodes[k];
  if(!n) return '';
  if(n.type==='root') return 'Overview';
  if(n.type==='sec') return `${n.s.id} ${n.s.name}`;
  if(n.type==='sub') return `${n.su.id} ${n.su.t}`;
  return `${n.q.id} ${n.q.t}`;
}
function render(k){
  const n=nodes[k]; let h='';
  if(n.type==='root'){
    h+=`<div class="crumb">A living map · updated August 2026</div><h1>The Biggest Questions About AI</h1>`;
    h+=`<p class="intro">A structured map of 127 major open questions about AI, with concise framings, selected sources, and deeper entries in development. Five sections; every level of the map is a page.</p>`;
    DATA.forEach(s=>{
      const nq=s.subs.reduce((a,su)=>a+su.qs.length,0);
      h+=`<button class="card" data-go="${s.id}" style="--sc:var(--c${s.id})"><span class="cid">SECTION ${s.id} · ${nq} QUESTIONS</span><div class="ctt">${s.name}</div><div class="cpv"><em>${esc(s.tag)}</em></div></button>`;
    });
  }
  if(n.type==='sec'){
    const s=n.s;
    h+=crumbFor(n)+`<h1 style="color:var(--c${s.id})">${s.id}. ${s.name}</h1><div class="tagl">${esc(s.tag)}</div>`;
    h+=`<p class="intro">${esc(s.intro)}</p>`;
    s.subs.forEach(su=>{
      const pv=su.qs.map(q=>esc(q.t)).join(' · ');
      h+=`<button class="card" data-go="${su.id}" style="--sc:var(--c${s.id})"><span class="cid">${su.id} · ${su.qs.length} QUESTIONS</span><div class="ctt">${esc(su.t)}</div><div class="cpv">${pv}</div></button>`;
    });
  }
  if(n.type==='sub'){
    const {s,su}=n;
    h+=crumbFor(n)+`<h1>${su.id} ${esc(su.t)}</h1>`;
    h+=`<p class="intro" style="margin-bottom:18px">${su.qs.length} questions.</p>`;
    su.qs.forEach(q=>{
      h+=`<button class="qitem" data-go="${q.id}" style="--sc:var(--c${s.id})"><span class="qover">${q.id} · ${esc(q.t)}</span><span class="qq">${esc(q.q)}</span></button>`;
    });
  }
  if(n.type==='q'){
    const {s,su,q}=n;
    const SC=`var(--c${s.id})`;
    h+=crumbFor(n)+`<h1>${esc(q.q)}</h1>`;
    const rq=RECENT[q.id];
    const rc=rq?rq.items:null;
    h+=`<p class="qn">${esc(q.n).replace(/(?<![\w.])([1-5]\.\d{1,2}\.\d{1,2})(?![\w.])/g,(m0,num)=>num===q.id?num:(nodes[num]?`<a data-go="${num}" style="cursor:pointer;color:var(--c${num[0]});text-decoration:underline dotted">${num}</a>`:num))}</p>`;
    const en=ENTRY[q.id];
    h+=`<p class="quiet" style="--sc:${SC}">`+`<a href="../questions/${q.slug}/">Permanent page${en?' & full analysis':''} →</a> &nbsp;·&nbsp; `+`<a href="../#q${q.id.replaceAll('.','-')}">View on the map →</a></p>`;
    if(rq&&rq.moved){
      const mv=Array.isArray(rq.moved)?rq.moved:[rq.moved];
      const anchor2=rq.prev_swept?`since ${esc(rq.prev_swept)}`:(rq.window?esc(rq.window):'');
      h+=`<div class="mvh">What changed</div><div class="mvf">${anchor2?esc(anchor2)+' · ':''}swept ${esc(rq.swept)}${rq.approved?` · <a class="rvlink" href="../methodology/#review">editor-approved ${esc(rq.approved)}</a>`:` · <a class="rvlink rvpend" href="../methodology/#review">editorial review pending</a>`}</div><div class="changed">`;
      mv.forEach((m,i)=>{
        const t0=(typeof m==='object')?m.t:null, b=(typeof m==='object')?m.b:m;
        const rfs=(typeof m==='object'&&m.refs)?m.refs:[];
        const byrid={}; (rq.items||[]).forEach(it=>{byrid[it.rid]=it});
        const sup=rfs.length?`<span class="evd">Evidence: `+rfs.filter(rd=>byrid[rd]).map((rd,j)=>
          `<a href="#${rd}" title="${esc(byrid[rd].author)} — ${esc(byrid[rd].title)}">${j+1}</a>`).join('')+`</span>`:'';
        h+=`<div class="ch"><div class="chn">0${i+1}</div>`+(t0?`<div class="cht">${esc(t0)}</div>`:'')+`<p class="chb">${esc(b)}${sup}</p></div>`;
      });
      h+=`</div>`;
    }
    if(rq&&(!rc||!rc.length)){
      h+=`<div class="core">No contribution since the last review met the inclusion threshold.</div>`;
    }
    if(rc&&rc.length){
      const deb=DEBATES[q.id];
      const led=rq.ledger||[];
      const qual=rc.length+led.length;
      h+=`<div class="rh">Recent thinking</div><div class="rhm">${led.length?`${rc.length} featured from ${qual} tracked`:`${rc.length} piece${rc.length>1?'s':''}`}${rq.window?` · ${esc(rq.window)}`:''} · <a href="../latest/?q=${q.id}" style="color:var(--ink2)">all ${qual} chronologically →</a></div>`;
      let groups=[];
      if(deb){
        const assigned=new Set(deb.poles.map(p=>p.k));
        groups=deb.poles.map(p=>({label:p.label,claim:p.claim,hue:p.hue||SC,
          items:rc.filter(r=>r.pos===p.k)})).filter(g=>g.items.length);
        const cross=rc.filter(r=>!r.pos||!assigned.has(r.pos));
        if(cross.length) groups.push({label:'Cross-cutting',claim:'',hue:SC,items:cross});
      } else {
        groups=[{label:null,claim:'',hue:SC,items:rc.slice()}];
      }
      groups.forEach(g=>{
        h+=`<section class="gsec" style="--kc:${g.hue}">`;
        if(g.label) h+=`<div class="ggut"><div class="ggn">${esc(g.label)}</div>${g.claim?`<div class="ggm">${esc(g.claim)}</div>`:''}</div>`;
        h+=`<div class="gcont">`;
        g.items.forEach((r,i)=>{
          if(i===0){ h+=gfeat(r); if(g.items.length>1) h+=`<div class="ggrid">`; }
          else h+=gcpt(r);
        });
        if(g.items.length>1) h+=`</div>`;
        h+=`</div></section>`;
      });
      h+=`<div class="gtail">`;
      const led2=rq.ledger||[];
      if(led2.length){
        h+=`<details class="gfound"><summary>Additional relevant discussion (${led2.length})</summary>`+
           `<div class="gim" style="margin:6px 0 4px">Met the relevance bar during the sweep; not selected for the reading list above.</div>`;
        led2.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(l=>{
          h+=`<div class="gcp" style="padding:7px 0"><a class="gct" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title)}</a><div class="gim">${esc(l.author)} · ${esc(l.venue)} · ${fmtD(l.date)}</div></div>`;
        });
        h+=`</details>`;
      }
      if(q.links.length){
        h+=`<details class="gfound"><summary>Foundational reading (${q.links.length})</summary>`;
        q.links.forEach(l=>{h+=`<div class="gcp" style="padding:8px 0"><a class="gct" href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.t)}</a><div class="gim">${esc(l.s)}${l.y?' · '+l.y:''}</div></div>`});
        h+=`</details>`;
      }
      const sibs=su.qs.filter(x=>x.id!==q.id).map(x=>`<a data-go="${x.id}">${x.id} ${esc(x.t)}</a>`).join(' · ');
      if(sibs) h+=`<div class="gnear">Nearby: ${sibs}</div>`;
      h+=`</div>`;
    } else if(!rq) {
      h+=`<div class="links">`;
      q.links.forEach(l=>{h+=`<a href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.t)}<span class="lsrc">${esc(l.s)}${l.y?' · '+l.y:''}</span></a>`});
      h+=`</div>`;
    }
  }
  const i=order.indexOf(k);
  const prev=order[i-1], next=order[i+1];
  h+=`<div class="pn">`;
  if(prev) h+=`<button data-go="${prev}"><small>← Previous</small>${esc(label(prev))}</button>`;
  if(next) h+=`<button class="nx" data-go="${next}"><small>Next →</small>${esc(label(next))}</button>`;
  h+=`</div>`;
  return h;
}
function show(k,push){
  if(!nodes[k]) k='root';
  pin.innerHTML=render(k); ctx.innerHTML=renderCtx(k);
  tree.querySelectorAll('.trow').forEach(r=>{const on=r.dataset.k===k;r.classList.toggle('on',on);
    if(on)r.setAttribute('aria-current','page');else r.removeAttribute('aria-current');});
  // expand path
  let p=row(k)&&row(k).dataset.p;
  const chain=[]; let cur=k;
  while(cur){ chain.unshift(cur); const r=row(cur); cur=r?r.dataset.p:null; }
  chain.forEach(c=>setExp(c,true));
  const r=row(k); if(r) r.scrollIntoView({block:'nearest'});
  document.body.classList.add('detail');
  document.getElementById('page').scrollTop=0;
  if(push!==false){
    const h='#'+(k==='root'?'':k.replaceAll('.','-'));
    if(location.hash!==h) history.pushState({k:k},'',h); else history.replaceState({k:k},'',h);
  }
  const tm=document.getElementById('toMap');
  if(tm){const n2=nodes[k]; tm.href = n2.type==='q' ? '../#q'+k.replaceAll('.','-') : (n2.type==='root'?'../':'../#'+k.replaceAll('.','-'));}
}
pin.addEventListener('click',e=>{const b=e.target.closest('[data-go]'); if(b) show(b.dataset.go)});
window.addEventListener('popstate',()=>{
  const h=(location.hash||'').replace(/^#q?/,'').replaceAll('-','.');
  const k=h&&nodes[h]?h:'root';
  show(k,false);
});
document.getElementById('back').addEventListener('click',()=>{document.body.classList.remove('detail')});
/* ---------- context rail ---------- */
const ctx=document.getElementById('ctx');
const REFS_OUT={},REFS_IN={};
order.forEach(k=>{const n=nodes[k]; if(n.type!=='q')return;
  const q=n.q;
  const outs=[...new Set((q.n.match(/[1-5]\.\d{1,2}\.\d{1,2}/g)||[]).filter(x=>x!==k&&nodes[x]))];
  REFS_OUT[k]=outs; outs.forEach(t0=>{(REFS_IN[t0]=REFS_IN[t0]||[]).push(k)});
  });
function ctxLink(k,cur){return `<a data-go="${k}"${k===cur?' class="cur"':''}>${esc(label(k))}</a>`}
function renderCtx(k){
  const n=nodes[k]; if(!n||n.type==='root'||n.type==='sec') return '';
  let h='';
  if(n.type==='sub'){
    h+=`<div class="cxb"><h4>In ${n.s.id} ${esc(n.s.name)}</h4>${n.s.subs.map(su=>ctxLink(su.id,k)).join('')}</div>`;
    return h;
  }
  return '';
  const {s,su,q}=n;
  h+=`<div class="cxb"><h4>In ${su.id} ${esc(su.t)}</h4>${su.qs.map(x=>ctxLink(x.id,k)).join('')}</div>`;
  const outs=REFS_OUT[k]||[], ins=REFS_IN[k]||[];
  if(outs.length||ins.length){
    h+=`<div class="cxb"><h4>Mentioned in framings</h4>`;
    if(outs.length) h+=`<div class="dir">This framing mentions</div>`+outs.map(x=>ctxLink(x,k)).join('');
    if(ins.length) h+=`<div class="dir">Mentioned by</div>`+ins.map(x=>ctxLink(x,k)).join('');
    h+=`</div>`;
  }
  return h;
}
ctx.addEventListener('click',e=>{const b=e.target.closest('[data-go]'); if(b) show(b.dataset.go)});

/* ---------- search + lenses ---------- */
const ENTRYSET=new Set(Object.keys(ENTRY));
const QROWS=[]; DATA.forEach(s0=>s0.subs.forEach(su=>su.qs.forEach(q=>QROWS.push({k:q.id,su:su.id,sec:s0.id,
  txt:(q.id+' '+q.t+' '+q.q+' '+q.n+' '+q.links.map(l=>l.t+' '+l.s).join(' ')+' '+(q.sx||'')).toLowerCase(),crux:!!q.crux,entry:ENTRYSET.has(q.id)}))));
let lensC=false,lensE=false;
const qbox=document.getElementById('q');
function applyFilter(){
  const term=qbox.value.trim().toLowerCase();
  const toks=term.split(/\s+/).filter(Boolean);
  const active=toks.length||lensC||lensE;
  if(!active){
    tree.querySelectorAll('.trow').forEach(r=>{r.style.display='';});
    tree.querySelectorAll('.trow.lv1,.trow.lv2').forEach(r=>{
      const pr=row(r.dataset.p); r.classList.toggle('hide',!(pr&&pr.classList.contains('exp')));});
    return;
  }
  const hits=new Set(), parents=new Set();
  QROWS.forEach(x=>{
    if(toks.length&&!toks.every(t0=>x.txt.includes(t0))) return;
    if(lensC&&!x.crux) return;
    if(lensE&&!x.entry) return;
    hits.add(x.k); parents.add(x.su); parents.add(x.sec);
  });
  tree.querySelectorAll('.trow').forEach(r=>{
    const k=r.dataset.k;
    if(k==='root'){r.style.display='none';return;}
    const shown=hits.has(k)||parents.has(k);
    r.style.display=shown?'':'none';
    if(shown) r.classList.remove('hide');
  });
}
qbox.addEventListener('input',applyFilter);
document.getElementById('lensEntry').addEventListener('click',e=>{lensE=!lensE;e.target.classList.toggle('on',lensE);e.target.setAttribute('aria-pressed',lensE);applyFilter();});

const hh=(location.hash||'').replace(/^#q?/,'').replaceAll('-','.');
if(hh&&nodes[hh]) show(hh,false);
else if(window.innerWidth>760) show('root',false);
else { setExp('1',false); }
</script></body></html>
